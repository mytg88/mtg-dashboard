      const acts = callerRaw ? (
        '<div class="call-actions">'+
          '<button class="call-act" data-num="'+numAttr+'" onclick="copyNum(this)">Copy number</button>'+
          '<a class="call-act call-call" href="tel:'+numAttr+'">\u260e Call</a>'+
          (gmailDigits ? '<a class="call-act call-wa" href="https://wa.me/'+gmailDigits+'" target="_blank" rel="noopener">WhatsApp</a>' : '')+
          gmailBtn+
        '</div>'
      ) : '';
      // The note belongs to the NUMBER, not to any one call row, so it survives transfers,
      // outcomes and view switches. Before the one-time migration runs, fall back to the
      // newest old-style row note in this number's history so nothing seems to vanish.
      const noteNum = c._callerNorm || '';
      let noteVal = (noteNum && numberNotes[noteNum]) ? numberNotes[noteNum].note : '';
      if (!noteVal) {
        const pool = (history && history.length ? history.slice() : [c]).sort((a,b) => (b._date||0) - (a._date||0));
        const legacy = pool.map(x => String(x._note||'').trim()).filter(Boolean)[0];
        if (legacy) noteVal = legacy;
      }
      const note = noteNum
        ? '<div class="call-note"><textarea rows="2" placeholder="Add a note about this caller\u2026" onchange="updateNumberNote(\''+noteNum+'\',this.value)">'+esc(noteVal)+'</textarea></div>'
        : '<div class="call-note"><textarea rows="2" placeholder="Add a note or transcript correction\u2026" onchange="updateCallNote(\''+key+'\',this.value)">'+esc(c._note||'')+'</textarea></div>';
      const by = c._by ? '<div class="call-by">Last updated by '+esc(c._by)+'</div>' : '';
      const nKey = c._callerNorm;
      const manual = nKey ? manualNames[nKey] : null;
      const autoMatch = nKey ? numToCust[nKey] : null;
      const known = manual ? { name: manual.name, status: autoMatch?autoMatch.status:'', inherited: autoMatch?autoMatch.inherited:false, manual:true } : autoMatch;
      const knownLine = known ? ('<div class="call-cust">'+esc(known.name)+
        (known.status ? '<span style="font-family:\'DM Sans\',sans-serif;font-size:12px;font-weight:500;color:var(--muted)">\u00b7 '+esc(known.status)+'</span>' : '')+
        (known.inherited ? '<span class="badge b-inherited">inherited</span>' : '')+
        (nKey ? '<button class="name-edit" onclick="editName(this)">edit name</button>' : '')+
        '</div>') : '';
      // Input shown only when no name is set yet; once named, it collapses behind the "edit name" link.
      const nameBox = nKey ? ('<div class="call-name"><input type="text" placeholder="Name this caller \u2014 saved for this number" value="'+esc(known?known.name:'')+'" onchange="saveContact(\''+nKey+'\', this.value)"'+(known?' style="display:none"':'')+'></div>') : '';
      const g = (c._callerNorm && callsStats && callsStats.byNum) ? callsStats.byNum[c._callerNorm] : null;
      let flag = '';
      if (g && g.count >= 2) {
        if (g.attention) {
          const hot = g.count >= 3 ? ' hot' : '';
          flag = '<div class="call-flag warn'+hot+'">\u26a0 '+g.count+' calls, no callback yet'+(g.last?' \u00b7 last '+esc(fmtDate(g.last)):'')+'</div>';
        } else {
          flag = '<div class="call-flag neutral">'+g.count+' calls from this number</div>';
        }
      }
      let histHtml = '';
      if (history && history.length > 1) {
        const rows = history.slice().sort((x,y) => (y._date?y._date.getTime():0) - (x._date?x._date.getTime():0)).map(h => {
          const w = fmtDate(h._date) + (h._time ? ' '+esc(h._time) : '');
          return '<div class="hist-row"><span class="hist-when">'+w+'</span><span class="hist-type">'+esc(h._type||'Call')+'</span><span class="hist-st">'+esc(stLabel(h._status||'New'))+'</span></div>';
        }).join('');
        histHtml = '<details class="call-history"><summary>View all '+history.length+' calls from this number</summary><div class="hist-list">'+rows+'</div></details>';
      }
      return '<div class="call-item">'+
        '<div class="call-top">'+typeBadge(c._type)+'<span class="call-when">'+when+'</span>'+ownerPill+'<div class="call-head-actions">'+statusCtl+'</div></div>'+
        knownLine +
        '<div class="call-caller-row"><span class="call-caller">'+(esc(c._caller)||'\u2014')+'</span></div>'+
        flag +
        xferNote +
        nameBox +
        acts +
        vm +
        note +
        histHtml +
        by +
      '</div>';
    };
    const latestOf = arr => arr.slice().sort((x,y) => (y._date?y._date.getTime():0) - (x._date?x._date.getTime():0))[0];
    const isOpen = c => isCallOpen(c._status) && !c._aged;
    const hasVM = u => u.calls.some(c => /voicemail/i.test(c._type||''));
    let units = [];
    if (callsFilter === 'attention') {
      // Worst offenders first, representative = the latest call.
      Object.values(s.byNum).filter(gg => gg.attention)
        .sort((ga, gb) => (gb.count - ga.count) || ((gb.last?gb.last.getTime():0) - (ga.last?ga.last.getTime():0)))
        .forEach(gg => units.push({ rep: latestOf(gg.calls), calls: gg.calls }));
    } else {
      // Group every caller into one card. Un-numbered calls can't be grouped, so they stay individual.
      Object.values(s.byNum).forEach(gg => {
        if (callsFilter === 'open' && (gg.aged || gg.open === 0)) return;     // only callers with a live open call
        if (callsFilter === 'ignored' && !gg.ignored) return;                 // only aged-out / ignored callers
        const openCalls = gg.calls.filter(isOpen);
        const rep = (callsFilter === 'open' && openCalls.length) ? latestOf(openCalls) : latestOf(gg.calls);
        units.push({ rep: rep, calls: gg.calls });
      });
      s.list.forEach(c => {
        if (c._callerNorm) return;                                          // already grouped above
        if (callsFilter === 'open' && !isOpen(c)) return;
        if (callsFilter === 'ignored' && !(c._aged || c._status === 'Ignored')) return;
        units.push({ rep: c, calls: [c] });
      });
      units.sort((a, b) => ((b.rep && b.rep._date)?b.rep._date.getTime():0) - ((a.rep && a.rep._date)?a.rep._date.getTime():0));
    }
    // With / without voicemail
    if (callType === 'vm') units = units.filter(hasVM);
    else if (callType === 'novm') units = units.filter(u => !hasVM(u));
    // Free-text search across name, number, notes and transcripts
    const cq = callSearch.trim().toLowerCase();
    if (cq) {
      const cqDigits = cq.replace(/\D/g, '');
      units = units.filter(u => {
        const num = u.rep._callerNorm || '';
        if (String(u.rep._caller||'').toLowerCase().includes(cq)) return true;
        if (cqDigits && num.includes(cqDigits)) return true;
        const known = (manualNames[num] && manualNames[num].name) || (numToCust[num] && numToCust[num].name) || '';
        if (known.toLowerCase().includes(cq)) return true;
        if (((numberNotes[num] && numberNotes[num].note) || '').toLowerCase().includes(cq)) return true;
        return u.calls.some(c => String(c._note||'').toLowerCase().includes(cq) || String(c._trans||'').toLowerCase().includes(cq));
      });
    }
    const isEmpty = units.length === 0;
    const cardsHtml = units.map(u => card(u.rep, u.calls.length > 1 ? u.calls : null)).join('');
    el.innerHTML = `
    <div class="grid grid-4">
      <div class="card accent-top"><div class="kpi-l">Total Calls</div><div class="kpi-v">${s.total}</div><div class="kpi-s">in period</div></div>
      <div class="card accent-top"><div class="kpi-l">Missed Calls</div><div class="kpi-v">${s.missed}</div><div class="kpi-s">no voicemail</div></div>
      <div class="card accent-top"><div class="kpi-l">Voicemails</div><div class="kpi-v">${s.vm}</div><div class="kpi-s">message left</div></div>
      <div class="card accent-top" style="border-top-color:var(--accent)"><div class="kpi-l">Still Open</div><div class="kpi-v" style="color:var(--amber)">${s.open}</div><div class="kpi-s">need a callback</div></div>
    </div>
    <div class="card">
      <div class="h" style="margin-bottom:4px">Call chase list</div>
      <div class="call-controls">
        <div style="font-size:12px;color:var(--muted);margin-bottom:14px">Updating as <b>${esc(callsWho||'\u2014')}</b>. Changes save for everyone. Tap a voicemail to read the full message. The Gmail link copies the email search, so on mobile just paste it into Gmail\u2019s search box.</div>
        ${s.attention>0 && callsFilter!=='attention' ? '<div class="call-flag warn" style="margin:0 0 12px;cursor:pointer" onclick="callsFilter=\'attention\';renderContent()">\u26a0 '+s.attention+(s.attention>1?' callers have':' caller has')+' tried more than once with no callback \u2014 tap to review</div>' : ''}
        <div class="filter-row">
          <button class="filter-btn ${callsFilter==='open'?'active':''}" onclick="callsFilter='open';renderContent()">Still open (${s.open})</button>
          <button class="filter-btn ${callsFilter==='attention'?'active':''}" onclick="callsFilter='attention';renderContent()">Needs attention (${s.attention})</button>
          <button class="filter-btn ${callsFilter==='ignored'?'active':''}" onclick="callsFilter='ignored';renderContent()">Ignored (${s.ignored})</button>
          <button class="filter-btn ${callsFilter==='all'?'active':''}" onclick="callsFilter='all';renderContent()">All (${s.total})</button>
        </div>
        <input id="callSearchBox" class="search" placeholder="Search name, number, note or message..." value="${esc(callSearch)}" oninput="onCallSearch(this.value, this.selectionStart)" style="margin-bottom:12px">
        <div class="filter-row" style="margin-bottom:0">
          <button class="filter-btn ${callType==='all'?'active':''}" onclick="callType='all';renderContent()">All types</button>
          <button class="filter-btn ${callType==='vm'?'active':''}" onclick="callType='vm';renderContent()">Voicemail</button>
          <button class="filter-btn ${callType==='novm'?'active':''}" onclick="callType='novm';renderContent()">No voicemail</button>
        </div>
      </div>
      ${isEmpty ? ((cq||callType!=='all')
          ? emptyState('search','No calls match','Try clearing the search box or the type filter above.')
          : callsFilter==='attention'
            ? emptyState('sun','All callers looked after','Everyone who rang more than once has had a callback.')
            : callsFilter==='ignored'
              ? emptyState('sun','Nothing has aged out','No unactioned missed calls older than 31 days.')
              : emptyState('phone','No calls to show'+(franchiseeView!=='All'?' for '+franchiseeView:''),'New calls from the phone line land here automatically.'))
        : '<div class="call-list">'+cardsHtml+'</div>'}
      <div class="ib ig" style="margin-top:16px"><b>How the list works:</b> a call stays here until you give it an outcome. Hit <b>Set outcome</b> and pick what actually happened \u2014 job booked, resolved, called back, moved to WhatsApp or email, or not relevant \u2014 or transfer it to the other operator. <b>Needs another callback</b> and <b>Left a message</b> keep a call in the list. A missed call with no message that goes 31 days with no callback drops into <b>Ignored</b> on its own; voicemails always stay until you action them. Every change saves for everyone.</div>
    </div>`;
  }

  else if (activeTab==='Revenue') {
    const b = dfBounds();
    const single = isSingleMonthPeriod(b);
    const curRev = totalRev;                                  // override-aware period total
    const avgJob = totalJobs ? Math.round(curRev/totalJobs) : 0;

    // --- headline: period total + adaptive comparisons ---
    const periodNames = {'this-month':'this month','last-month':'last month','ytd':'this year so far','tax-year':'this tax year','last-tax-year':'last tax year','last-12mo':'the last 12 months','all':'all time','custom':'the selected period'};
    const periodLabel = single ? shortMonth(monthKey(b.from)).replace(/(\d\d)$/,'20$1') : (periodNames[dfRange] || 'the selected period');
    let cmps = '';
    if (single) {
      const pm = prevMonthBounds(b);
      cmps += cmpRow(curRev, revTotalFor(pm, franchiseeView), 'vs ' + pm.from.toLocaleDateString('en-GB',{month:'long'}));
      const yo = prevBounds(b);
      if (yo.from) cmps += cmpRow(curRev, revTotalFor(yo, franchiseeView), 'vs ' + yo.from.toLocaleDateString('en-GB',{month:'short',year:'numeric'}));
    } else if (prevTotals && prevTotals.has) {
      cmps += cmpRow(curRev, prevTotals.rev, comparisonLabel());
    }
    const headline = `<div class="card" style="margin-bottom:24px">
      <div class="kpi-l">Revenue \u00b7 ${periodLabel}${franchiseeView!=='All'?' \u00b7 '+franchiseeView:''}</div>
      <div style="font-family:'Fraunces',serif;font-size:46px;font-weight:600;color:var(--ink);line-height:1;letter-spacing:-1px;margin-top:8px">${fmt(curRev)}</div>
      ${cmps?'<div style="display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px">'+cmps+'</div>':''}
      <div style="font-size:12px;color:var(--muted);margin-top:14px">${totalJobs.toLocaleString()} jobs \u00b7 ${totalCusts} customers \u00b7 avg ${fmt(avgJob)} per job</div>
    </div>`;

    // --- single month: weekly shape + recent-month context ---
    let compositionCard = '', timeDetail = '';
    if (single) {
      const key = monthKey(b.from), live = key > HIST_CUTOFF;
      let weekly;
      if (live) {
        const wk = weeklyRevenue(b);
        weekly = '<div class="card" style="margin-bottom:24px"><div class="h">Revenue by week</div>'
          + (wk.length ? hbarList(wk.map(w=>({label:w.label, r:w.r, sub:w.j+' job'+(w.j===1?'':'s'), hi:true})))
                       : emptyState('sun','No jobs yet this month','Completed jobs will appear here as they are logged.'))
          + '<div style="font-size:11px;color:var(--muted);margin-top:10px">Weeks run 1\u20137, 8\u201314 and so on within the month.</div></div>';
      } else {
        weekly = '<div class="card" style="margin-bottom:24px"><div class="h">Revenue by week</div><div class="ib ig" style="margin-top:0">This is an invoiced historical month, recorded as one monthly figure rather than week by week.</div></div>';
      }
      const rows = recentMonthKeys(key, 6).map(k => ({ label: shortMonth(k), r: monthRevFor(k, franchiseeView), hi: k === key }));
      const context = '<div class="card" style="margin-bottom:24px"><div class="h">Last 6 months</div>' + hbarList(rows)
        + '<div style="font-size:11px;color:var(--muted);margin-top:10px">The selected month is highlighted; earlier months are shown in full for context.</div></div>';
      trend = weekly + context;
      timeDetail = trend;
    } else {
      // --- multi month: composition over time + per-month detail ---
      const { top, colorOf } = serviceColorMap();
      const maxR = monthlyData.length ? Math.max(...monthlyData.map(m=>m.r)) : 1;
      compositionCard = `<div class="card" style="margin-bottom:24px"><div class="h">Revenue by service, month by month</div>${stackedServiceSVG(top, colorOf)}
        ${monthlyData.some(m=>m.m<=HIST_CUTOFF)?'<div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5">Months from 2026 are split by service from job records. Earlier invoiced months are shown as a single total, since a reliable service split isn\'t held for them.</div>':''}</div>`;
      timeDetail = `<div class="card" style="margin-bottom:24px"><div class="h">Month by month</div>
        ${monthlyData.length===0?emptyState('chart','No jobs in this period','Try widening the period in the top right.'):
          monthlyData.map(m=>'<div class="bar-row"><span class="bar-l">'+shortMonth(m.m)+'</span><div class="bar-c"><div class="bar" style="width:'+(maxR>0?Math.round(m.r/maxR*100):0)+'%"></div><span class="bar-v">'+fmt(m.r)+'</span><span class="bar-s">'+(m.j==null?'invoiced':m.j+' jobs \u2022 '+m.c+' customers')+'</span></div></div>').join('')}
        <div class="ib ig"><b>Seasonal pattern:</b> peak May to October, winter dip December to February, spring bounce in March. Average job value has trended upward over time.</div>
      </div>`;
    }

    // --- revenue by service (folded in from the old Services tab) ---
    const { colorOf: svcColors } = serviceColorMap();
    const svcRanked = serviceData.slice().sort((a,b2)=>b2.r-a.r);
    const svcTotal = svcRanked.reduce((s,x)=>s+x.r,0) || 1;
    const svcMax = svcRanked.length ? svcRanked[0].r : 1;
    const serviceCard = `<div class="card" style="margin-bottom:24px"><div class="h">Revenue by service</div>
      ${svcRanked.length===0?emptyState('chart','No services in this period','Try widening the period in the top right.'):
        svcRanked.map(s=>'<div class="sb"><div class="sb-h"><span class="sb-n">'+s.n+'</span><span class="sb-s">'+fmt(s.r)+' \u00b7 '+Math.round(s.r/svcTotal*100)+'% \u00b7 '+s.j+' jobs \u00b7 avg '+fmt(s.a)+'</span></div><div class="sb-t"><div class="sb-f" style="background:'+(svcColors[s.n]||'#9aa89c')+';width:'+Math.round(s.r/svcMax*100)+'%"></div></div></div>').join('')}
      <div class="ib ig"><b>Read it as:</b> the bar is each service\u2019s share of the period\u2019s revenue. Regular maintenance leads on volume; one-off jobs like tidy-ups, hedge cutting and clearances earn more per visit.</div>
    </div>`;

    // --- recurring maintenance vs one-off work ---
    const RECURRING_GROUPS = {'Regular Garden Maintenance':1,'Grass Cutting & Lawn Edging':1};
    let recR=0,recJ=0,oneR=0,oneJ=0;
    serviceData.forEach(s=>{ if(RECURRING_GROUPS[s.n]){recR+=s.r;recJ+=s.j;}else{oneR+=s.r;oneJ+=s.j;} });
    const splitTot = recR+oneR || 1;
    const recAvg = recJ?Math.round(recR/recJ):0, oneAvg = oneJ?Math.round(oneR/oneJ):0;
    const recPct = Math.round(recR/splitTot*100), onePct = 100-recPct;
    const splitCard = `<div class="card" style="margin-bottom:24px"><div class="h">Recurring maintenance vs one-off work</div>
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px"><b>Recurring maintenance</b><span style="color:var(--muted)">${recPct}% of revenue</span></div>
        <div style="display:flex;gap:18px;font-size:13px"><span><b>${fmt(recR)}</b></span><span>${recJ} jobs</span><span>avg <b>${fmt(recAvg)}</b></span></div>
        <div class="pb"><div class="pf" style="background:var(--green4);width:${recPct}%"></div></div></div>
      <div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px"><b>One-off and project work</b><span style="color:var(--muted)">${onePct}% of revenue</span></div>
        <div style="display:flex;gap:18px;font-size:13px"><span><b>${fmt(oneR)}</b></span><span>${oneJ} jobs</span><span>avg <b>${fmt(oneAvg)}</b></span></div>
        <div class="pb"><div class="pf" style="background:var(--accent);width:${onePct}%"></div></div></div>
      <div class="ib ig"><b>Why it matters:</b> recurring maintenance is the steady base by volume. One-off work earns far more per visit, so a handful of those jobs lifts the period total noticeably.</div>
    </div>`;

    // --- revenue by operator (only in the All view, framed as contribution not a contest) ---
    let operatorCard = '';
    if (franchiseeView === 'All') {
      const opMike = revTotalFor(b,'Mike'), opAdam = revTotalFor(b,'Adam'), opTot = opMike+opAdam || 1;
      const mPct = Math.round(opMike/opTot*100), aPct = 100-mPct;
      operatorCard = `<div class="card"><div class="h">Revenue by operator</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:16px">How the period\u2019s revenue splits across the team.</div>
        <div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;margin-bottom:6px">${badge('Mike')}<span style="font-size:13px"><b>${fmt(opMike)}</b> <span style="color:var(--muted)">\u00b7 ${mPct}%</span></span></div>
          <div class="pb"><div class="pf" style="background:var(--green4);width:${mPct}%"></div></div></div>
        <div><div style="display:flex;justify-content:space-between;margin-bottom:6px">${badge('Adam')}<span style="font-size:13px"><b>${fmt(opAdam)}</b> <span style="color:var(--muted)">\u00b7 ${aPct}%</span></span></div>
          <div class="pb"><div class="pf" style="background:var(--blue4);width:${aPct}%"></div></div></div>
        ${monthlyData.some(m=>m.m<'2024-10')?'<div style="font-size:11px;color:var(--muted);margin-top:14px;line-height:1.5">Mike\'s figure is his full invoiced history back to 2021. Adam\'s covers his franchisee period from April 2025, so the two spans differ.</div>':''}
      </div>`;
    }

    el.innerHTML = headline + compositionCard + splitCard + serviceCard + timeDetail + operatorCard;
  }

  else if (activeTab==='Customers') {
    const segs = ["All","Recurring","Repeat","One-Off","Churned"].concat(franchiseeView==='Adam' ? [] : ["Passed to Adam"]);
    const chipBtn = (v,label) => '<button class="filter-btn '+(custSegFilter===v?'active':'')+'" onclick="custSegFilter=\''+v+'\';custSearch=\'\';scoreEditFor=null;renderContent();window.scrollTo({top:0,behavior:\'smooth\'})">'+label+'</button>';
    const segChips = segs.map(s=>chipBtn(s, s+' ('+(s==='All'?allCustomers.length:allCustomers.filter(c=>c.s===s).length)+')')).join('');
    const chips = `<div class="filter-row">${segChips}</div>`;
    let body, isMap=false;
    if (custSegFilter === 'Recurring') body = renderRecurringHub();
    else if (custSegFilter === 'Churned') body = renderChurnedHub();
    else if (custSegFilter === 'Repeat') body = renderRepeatHub();
    else if (custSegFilter === 'One-Off') body = renderOneOffHub();
    else if (custSegFilter === 'Passed to Adam') body = renderPassedHub();
    else {
      let filtered = allCustomers;
      if (custSegFilter !== 'All') filtered = filtered.filter(c => c.s === custSegFilter);
      if (custSearch) filtered = filtered.filter(c => c.n.toLowerCase().includes(custSearch.toLowerCase()));
      const intro = custSegFilter==='All' ? customerMixCard() : '';
      const searchBox = `<input id="custSearchBox" class="search" placeholder="Search customers..." value="${escAttr(custSearch)}" oninput="onCustSearch(this.value, this.selectionStart)">`;
      body = intro + searchBox + (filtered.length===0
        ? '<div class="card">'+(custSearch
            ? emptyState('search','No customers match','Try a shorter search, or switch segment above.')
            : emptyState('users','No customers in this segment','They will appear as jobs and bookings come through.'))+'</div>'
        : `<div class="card"><div style="font-size:13px;color:var(--muted);margin-bottom:12px">Showing ${filtered.length} customers${franchiseeView!=='All'?' \u00b7 '+franchiseeView+' only':''}</div>
        <div class="table-wrap"><table><thead><tr>${sortTh('Customers','n','Customer')}<th>Segment</th>${sortTh('Customers','j','Jobs','r')}${sortTh('Customers','r','Revenue','r')}${sortTh('Customers','a','Avg','r')}<th class="c">Territory</th>${sortTh('Customers','first','First')}${sortTh('Customers','last','Last')}</tr></thead>
        <tbody>${sortRows(filtered,custSort.k,custSort.d).map(c=>'<tr data-cust="'+escAttr(c.n)+'" onclick="openCustomerFromRow(event, this.dataset.cust)"><td style="font-weight:500">'+custName(c)+'</td><td>'+badge(c.s)+'</td><td class="r">'+c.j+'</td><td class="r" style="font-weight:600;color:var(--green)">'+fmt(c.r)+'</td><td class="r">'+fmt(c.a)+'</td><td class="c">'+badge(c.f)+'</td><td style="color:var(--muted);font-size:12px">'+fmtDate(c.first)+'</td><td style="color:var(--muted);font-size:12px">'+fmtDate(c.last)+'</td></tr>').join('')}</tbody></table></div></div>`);
    }
    el.innerHTML = chips + body;
    if (isMap) initLiveMap();
  }


  else if (activeTab==='To-do') {
    el.innerHTML = renderTodoTab();
  }

  else if (activeTab==='Resources') {
    el.innerHTML = renderResourcesTab();
  }

  else if (activeTab==='Performance') {
    el.innerHTML = renderPerformanceTab();
  }

  else if (activeTab==='Regulars') {
    el.innerHTML = renderRegularsTab();
    if(regSub==='Planner') recalcPlanner();
    else if(regSub==='Map') initLiveMap();
    else if(regSub==='Rounds' && franchiseeView!=='All') rbInitGeocode();
  }
  initRtablize();
}

function showLogin(msg) {
  const ov = document.getElementById('loginOverlay');
  if (ov) ov.style.display = 'flex';
  const er = document.getElementById('loginErr'); if (er) er.textContent = msg || '';
  const lb = document.getElementById('logoutBtn'); if (lb) lb.style.display = 'none';
  const wi = document.getElementById('whoami'); if (wi) wi.textContent = '';
  const lp = document.getElementById('loginPass'); if (lp) lp.value = '';
  const lu = document.getElementById('loginUser'); if (lu) lu.focus();
}
function hideLogin() { const ov = document.getElementById('loginOverlay'); if (ov) ov.style.display = 'none'; }

function doLogin() {
  const u = (document.getElementById('loginUser').value || '').trim();
  const p = document.getElementById('loginPass').value || '';
  const remember = document.getElementById('loginRemember').checked;
  const er = document.getElementById('loginErr');
  if (!u || !p) { er.textContent = 'Enter your username and password.'; return; }
  er.textContent = 'Checking...';
  const cb = 'mtg_login_' + Date.now();
  const s = document.createElement('script');
  let done = false;
  const cleanup = () => { try { delete window[cb]; } catch(_) { window[cb] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); };
  window[cb] = function(d) {
    done = true; cleanup();
    if (d && d.ok) {
      auth = { user: u.toLowerCase(), pass: p, role: d.role || 'All', name: d.name || u };
      try {
        (remember ? localStorage : sessionStorage).setItem('mtg_auth', JSON.stringify(auth));
        (remember ? sessionStorage : localStorage).removeItem('mtg_auth');
      } catch(_) {}
      er.textContent = '';
      hideLogin();
      applyRole();
      loadData();
    } else {
      er.textContent = (d && d.error) ? d.error : 'Could not log in.';
    }
  };
  s.onerror = function() { if (!done) { cleanup(); er.textContent = 'Could not reach the app. Try again.'; } };
  setTimeout(() => { if (!done) { cleanup(); er.textContent = 'No response from the app. Try again.'; } }, 20000);
  s.src = API_URL + (API_URL.indexOf('?') === -1 ? '?' : '&') + 'action=login&user=' + encodeURIComponent(u) + '&pass=' + encodeURIComponent(p) + '&callback=' + cb;
  document.head.appendChild(s);
}

function doLogout() {
  auth = null;
  try { localStorage.removeItem('mtg_auth'); sessionStorage.removeItem('mtg_auth'); } catch(_) {}
  clearDataCache();
  showLogin('');
}

function applyRole() {
  const lb = document.getElementById('logoutBtn'); if (lb) lb.style.display = auth ? 'inline-block' : 'none';
  const wi = document.getElementById('whoami');
  if (wi) wi.textContent = auth ? (auth.name + (auth.role !== 'All' ? ' \u00b7 ' + auth.role + ' only' : '')) : '';
  const ab = document.getElementById('acctBtn');
  if (ab) ab.textContent = auth && auth.name ? auth.name.charAt(0).toUpperCase() : '\u00b7';
  try{ syncNotifyChk(); }catch(_){}
  const vs = document.getElementById('viewSelect');
  if (auth && auth.role !== 'All') {
    franchiseeView = auth.role;
    if (vs) vs.style.display = 'none'; var vl=document.getElementById('viewLab'); if (vl) vl.style.display='none';
    callsWho = auth.name;
  } else {
    if (vs) vs.style.display = ''; var vl2=document.getElementById('viewLab'); if (vl2) vl2.style.display='';
    if (auth) {
      callsWho = auth.name;
      // Default the opening view to the logged-in operator; the All toggle stays available.
      const op = { mike: 'Mike', adam: 'Adam' }[(auth.name || '').toLowerCase()];
      if (op) franchiseeView = op;
    }
  }
}

document.addEventListener('click', function (e) {
  const am = document.getElementById('acctMenu');
  if (am && am.hasAttribute('open') && !am.contains(e.target)) am.removeAttribute('open');
});

renderTabs();

// On phones the tab row is replaced by the bottom nav, which left the strip under the
// header holding nothing but the period select. Move the control up into the header on
// small screens (and back when the window widens) so that strip can be dropped entirely.
(function periodPlacement() {
  const mq = window.matchMedia ? window.matchMedia('(max-width:760px)') : null;
  function place() {
    const ctl = document.querySelector('.period-ctl');
    const slot = document.getElementById('hdrPeriodSlot');
    const nav = document.querySelector('.navwrap');
    if (!ctl || !slot || !nav) return;
    if (mq && mq.matches) { if (ctl.parentNode !== slot) slot.appendChild(ctl); }
    else { if (ctl.parentNode !== nav) nav.appendChild(ctl); }
  }
  if (mq) { if (mq.addEventListener) mq.addEventListener('change', place); else if (mq.addListener) mq.addListener(place); }
  place();
})();

(function initAuth() {
  const lb = document.getElementById('loginBtn');
  if (lb) lb.addEventListener('click', doLogin);
  const lp = document.getElementById('loginPass');
  if (lp) lp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  const lu = document.getElementById('loginUser');
  if (lu) lu.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginPass').focus(); });
  let saved = null;
  try { saved = localStorage.getItem('mtg_auth') || sessionStorage.getItem('mtg_auth'); } catch(_) {}
  if (saved) { try { auth = JSON.parse(saved); } catch(_) { auth = null; } }
  if (auth && auth.user && auth.pass) { hideLogin(); applyRole(); loadData(); }
  else { showLogin(''); }
})();
</script>
