<style>
:root{
  --ink:#16241C; --green:#1B5E20; --green6:#2E7D32; --green4:#4CAF50;
  --paper:#F1F4EE; --card:#FFFFFF; --line:#E5EAE3; --muted:#7C8A7E;
  --accent:#D98A2B; --blue:#1565C0; --blue4:#2196F3; --red:#C62828; --amber:#E65100;
  /* radius + elevation tokens */
  --r-sm:8px; --r-md:12px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(20,40,30,.05);
  --sh-2:0 8px 24px rgba(20,40,30,.12);
  /* semantic tint pairs, derived from the sage palette (badges, pills, flags) */
  --t-green-bg:#E3EEE2; --t-green-fg:#2C6B33;
  --t-amber-bg:#F6EAD3; --t-amber-fg:#96610E;
  --t-red-bg:#F5E1DE;   --t-red-fg:#AE3A2E;
  --t-blue-bg:#DFE9F1;  --t-blue-fg:#2B5D89;
  --t-violet-bg:#E8E3EF;--t-violet-fg:#5D4A8A;
  --t-neutral-bg:#EBEEE9;--t-neutral-fg:#5B665C;
  --hdr-h:56px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
.serif{font-family:'Fraunces',Georgia,serif}
.header{background:var(--ink);padding:0 20px 0 16px;color:#fff;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:12px;height:var(--hdr-h)}
@media(min-width:761px){.header{padding:0 28px}}
.header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--green4),var(--green),var(--accent))}
.header-actions{display:flex;align-items:center;gap:8px;flex:none}
.header .refresh{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.22);color:#fff;padding:8px 13px;border-radius:var(--r-pill);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:background .15s}
.header .refresh:hover{background:rgba(255,255,255,0.18)}
.header .refresh svg{width:13px;height:13px;flex:none}
.acct-menu{position:relative}
.acct-menu>summary{list-style:none;cursor:pointer}
.acct-menu>summary::-webkit-details-marker{display:none}
.acct-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--green6),var(--green));color:#fff;border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:16px;font-weight:600;user-select:none}
.acct-menu[open] .acct-btn{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.acct-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:120;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-2);padding:14px;min-width:224px;display:flex;flex-direction:column;gap:10px}
.acct-who{font-size:13px;font-weight:700;color:var(--ink)}

.cmenu-div{height:1px;background:var(--line);margin:5px 2px}
.call-pill{font-size:12px;font-weight:700;padding:5px 11px;border-radius:var(--r-pill);white-space:nowrap}
.pill-green{background:var(--t-green-bg);color:var(--t-green-fg)}
.pill-blue{background:var(--t-blue-bg);color:var(--t-blue-fg)}
.pill-grey{background:var(--t-neutral-bg);color:var(--t-neutral-fg)}
.pill-amber{background:var(--t-amber-bg);color:var(--t-amber-fg)}
.call-xfer-note{font-size:11px;color:var(--blue);font-weight:600;margin-bottom:8px}
.b-missed{background:var(--t-red-bg);color:var(--t-red-fg)}.b-vm{background:var(--t-blue-bg);color:var(--t-blue-fg)}
.call-caller-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.call-gmail{font-size:12px;color:var(--blue);text-decoration:none;border:1px solid #CFE0CB;padding:4px 11px;border-radius:var(--r-sm);white-space:nowrap;font-weight:500}
.call-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.call-act{font-size:12px;font-weight:600;padding:8px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;line-height:1}
.call-act:hover{background:var(--paper)}
.call-act.call-call{border-color:#BFE3C6;color:var(--green6)}
.call-act.call-wa{border-color:#BFE6CC;color:#1DA851}
.call-act.call-mail{border-color:#CFE0CB;color:var(--blue)}
.call-cust{font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--ink);margin-bottom:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.call-flag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:var(--r-sm);margin-bottom:8px;width:fit-content;max-width:100%}
.call-flag.neutral{background:var(--t-neutral-bg);color:var(--t-neutral-fg)}
.call-flag.warn{background:var(--t-amber-bg);color:var(--t-amber-fg);border:1px solid #E7D2A8}
.call-flag.warn.hot{background:var(--t-red-bg);color:var(--t-red-fg);border-color:#E5BEB8}
.call-name{margin-bottom:10px}
.call-name input{width:100%;box-sizing:border-box;font-family:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink)}
.call-name input::placeholder{color:var(--muted)}
.call-name input:focus{outline:none;border-color:var(--green)}
.name-edit{font-size:11px;font-weight:600;color:var(--green6);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:0;text-decoration:underline}
.call-history{margin-top:10px}
.call-history summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--green6)}
.hist-list{margin-top:8px;border-top:1px solid var(--line)}
.hist-row{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}
.hist-when{color:var(--muted);min-width:150px}
.hist-type{flex:1;color:var(--ink)}
.hist-st{font-weight:600;color:var(--ink)}
.bulk-l{font-size:12px;font-weight:600;color:var(--green6);margin-right:8px}
.call-gmail:hover{background:var(--t-green-bg)}
.call-note{margin-bottom:10px}
.call-note textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;font-family:inherit;font-size:13px;resize:vertical;color:#3c463d;background:#fff;min-height:38px}
.call-note textarea:focus{outline:none;border-color:var(--green)}
.call-by{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:640px){
  .header{padding:0 12px}
  .content{padding:20px 16px 50px}
  .df-bar{padding:12px 16px}
}
/* Rounds board */
.rb-wrap{display:flex;gap:16px;align-items:flex-start}
.rb-tray{flex:0 0 232px;position:sticky;top:12px;max-height:calc(100vh - 40px);overflow-y:auto;display:flex;flex-direction:column;background:#F7F9F5;border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.rb-tray h4{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin:0 0 4px;color:var(--ink)}
.rb-tray .rb-sub{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.4}
.rb-tray-search{width:100%;box-sizing:border-box;font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:10px;background:#fff}
.rb-addph-btn{width:100%;box-sizing:border-box;font:inherit;font-size:12px;font-weight:600;color:#2F6F3E;background:#fff;border:1px dashed #BFD8BF;border-radius:var(--r-sm);padding:8px;cursor:pointer;margin-bottom:10px}
.rb-addph-btn:hover{background:#F0F6EE;border-color:#9FC8A0}
.rb-addform{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:7px}
.rb-addin{width:100%;box-sizing:border-box;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff}
.rb-addrow{display:flex;gap:7px}
.rb-addrow .rb-addin{flex:1;min-width:0}
.rb-addsave{width:100%;box-sizing:border-box;font:inherit;font-size:13px;font-weight:600;color:#fff;background:var(--green);border:0;border-radius:var(--r-sm);padding:8px;cursor:pointer;margin-top:2px}
.rb-addsave:hover{filter:brightness(.96)}
.rb-viewtog{display:inline-flex;background:#EEF1EC;border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:2px}
.rb-vt{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:none;border:0;border-radius:var(--r-sm);padding:5px 13px;cursor:pointer;line-height:1}
.rb-vt:hover{color:var(--ink)}
.rb-vt.on{background:#fff;color:var(--green);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.rb-tray-list{display:flex;flex-direction:column;gap:7px;padding-right:2px}
.rb-tray-band{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:8px 0 1px;padding-top:8px;border-top:1px solid var(--line)}
.rb-tray-band:first-child{margin-top:0;padding-top:0;border-top:0}
.rb-rounds-panel{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.rb-rpanel{border:1px solid var(--line);border-left:4px solid #888;border-radius:var(--r-sm);padding:8px 9px;margin-bottom:8px;background:#fff}
.rb-rpanel-h{display:flex;align-items:center;gap:6px}
.rb-rname{flex:1;min-width:0;font:inherit;font-size:13px;font-weight:700;color:var(--ink);border:1px solid transparent;border-radius:var(--r-sm);padding:3px 5px;background:transparent}
.rb-rname:hover{border-color:var(--line);background:#fff}
.rb-rname:focus{outline:none;border-color:var(--green);background:#fff}
.rb-rpanel-ungroup{font-size:11px;color:var(--muted);background:none;border:0;cursor:pointer;white-space:nowrap;padding:3px 6px;border-radius:var(--r-sm)}
.rb-rpanel-ungroup:hover{background:#EEF1EE;color:var(--ink)}
.rb-rpanel-day{font-size:11px;color:var(--muted);margin:5px 0 7px}
.rb-rpanel-mem{display:flex;flex-direction:column;gap:3px}
.rb-rpanel-row{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--ink);background:var(--paper);border-radius:var(--r-sm);padding:4px 4px 4px 8px}
.rb-rpanel-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-rpanel-row button{background:none;border:0;cursor:pointer;color:var(--muted);font-size:13px;line-height:1;padding:2px 5px;border-radius:var(--r-sm);flex-shrink:0}
.rb-rpanel-row button:hover{background:#F7DCDA;color:var(--red)}
.rb-cols{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;min-width:0}
.rb-col{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);display:flex;flex-direction:column;min-height:120px}
.rb-col.rb-over{outline:2px dashed var(--green);outline-offset:-2px;background:#F2F8F0}
.rb-col-h{padding:9px 10px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:var(--r-md) 12px 0 0;z-index:1}
.rb-col-day{font-weight:700;font-size:13px;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:6px}
.rb-hbar{height:5px;border-radius:3px;background:#EAEFE7;margin-top:7px;overflow:hidden}
.rb-hbar>span{display:block;height:100%;border-radius:3px}
.rb-col-meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.rb-route{font-size:11px;font-weight:600;color:var(--blue);text-decoration:none;border:1px solid #CFE0CB;padding:3px 8px;border-radius:var(--r-sm);white-space:nowrap}
.rb-route:hover{background:var(--t-blue-bg)}
.rb-route.off{color:var(--muted);border-color:var(--line);cursor:default;pointer-events:none}
.rb-col-body{padding:8px;display:flex;flex-direction:column;gap:7px;flex:1}
.rb-card{border:1px solid var(--line);border-radius:var(--r-sm);background:#FBFCFA;padding:7px 9px;cursor:grab;font-size:13px}
.rb-card:active{cursor:grabbing}
.rb-card.sel{outline:2px solid var(--green);outline-offset:-2px;background:#EFF6EC}
.rb-card.rb-drag{opacity:.45}
.rb-card.rb-ins-top{box-shadow:inset 0 3px 0 0 var(--green)}
.rb-card.rb-ins-bot{box-shadow:inset 0 -3px 0 0 var(--green)}
.rb-card-top{display:flex;align-items:center;gap:6px}
.rb-card-name{font-weight:600;color:var(--ink);flex:1;line-height:1.25;word-break:break-word}
.rb-card-sub{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.rb-freq{font-size:10px;font-weight:700;letter-spacing:.3px;padding:1px 6px;border-radius:var(--r-pill);background:#EEF1EE;color:#566055;text-transform:uppercase}
.rb-hv{font-weight:600;color:#3c463d}
.rb-hv.miss{color:var(--amber)}
.rb-mini{background:none;border:0;cursor:pointer;color:var(--muted);font-size:13px;line-height:1;padding:2px 3px;border-radius:var(--r-sm)}
.rb-mini:hover{background:#EEF1EE;color:var(--ink)}
.rb-mini.on{color:var(--accent)}
.rb-round{border:1px solid var(--line);border-left:4px solid #888;border-radius:var(--r-sm);background:#fff;overflow:hidden}
.rb-round-h{padding:6px 8px;cursor:grab;display:flex;align-items:center;gap:6px}
.rb-round-h:active{cursor:grabbing}
.rb-round-name{font-weight:700;font-size:12px;color:var(--ink);flex:1;line-height:1.2;word-break:break-word}
.rb-round-sub{font-size:11px;color:var(--muted)}
.rb-round-body{padding:0 8px 8px;display:flex;flex-direction:column;gap:5px}
.rb-round .rb-card{background:#fff;cursor:default}
.rb-chip{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.rb-menu{position:relative}
.rb-menu>summary{list-style:none;cursor:pointer}
.rb-menu>summary::-webkit-details-marker{display:none}
.rb-menu-list{position:absolute;right:0;top:calc(100% + 4px);z-index:30;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:0 10px 26px rgba(20,40,30,.18);padding:5px;min-width:150px;display:flex;flex-direction:column;gap:1px}
.rb-menu-item{font-size:12px;text-align:left;background:none;border:0;padding:7px 9px;border-radius:var(--r-sm);cursor:pointer;color:var(--ink);white-space:nowrap;font-family:inherit}
.rb-menu-item:hover{background:var(--paper)}
.rb-menu-div{height:1px;background:var(--line);margin:3px 0}
.rb-actionbar{position:sticky;bottom:0;z-index:6;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:var(--r-md);padding:10px 14px;margin-top:14px;box-shadow:0 6px 20px rgba(20,40,30,.22)}
.rb-actionbar b{font-weight:700}
.rb-ab-btn{font-size:13px;font-weight:700;padding:7px 13px;border:none;border-radius:var(--r-sm);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit}
.rb-ab-btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
.rb-empty{font-size:11px;color:#aab3a6;text-align:center;padding:14px 4px;font-style:italic}
.rb-weeks{flex:1;display:flex;flex-direction:column;gap:18px;min-width:0}
.rb-week{border:1px solid var(--line);border-radius:var(--r-md);background:#FCFDFB;padding:12px}
.rb-week-h{display:flex;align-items:center;gap:12px;margin:0 2px 10px;flex-wrap:wrap}
.rb-week-t{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--ink)}
.rb-week-sum{font-size:12px;color:var(--muted)}
.rb-week-sum b{color:var(--ink)}
@media(max-width:1500px){ .rb-cols{grid-template-columns:repeat(7,minmax(0,1fr))} }
@media(max-width:1100px){ .rb-wrap{flex-direction:column} .rb-tray{position:static;flex-basis:auto;width:100%;max-height:60vh} .rb-cols{grid-template-columns:repeat(4,minmax(0,1fr));width:100%} }
@media(max-width:760px){ .rb-cols{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media(max-width:520px){ .rb-cols{grid-template-columns:repeat(2,minmax(0,1fr))} }
.td-task{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;margin-bottom:8px}
.td-task.done{background:#F6F8F4;border-color:#E2E8DD}
.td-check{flex-shrink:0;width:20px;height:20px;border-radius:50%;border:2px solid #CBD5C5;background:#fff;cursor:pointer;margin-top:1px;position:relative}
.td-check:hover{border-color:var(--green4)}
.td-check.on{background:var(--green);border-color:var(--green)}
.td-check.on:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.td-body{flex:1;min-width:0}
.td-title{font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.td-task.done .td-title{color:var(--muted);text-decoration:line-through}
.td-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-top:3px}
.td-tag{font-size:10px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:#4a554c;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:1px 6px}
.td-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0;align-items:center}
.td-actions .td-mini{font-size:16px;width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center}
.td-mini{background:none;border:0;cursor:pointer;color:var(--muted);font-size:13px;padding:3px 5px;border-radius:var(--r-sm);line-height:1}
.td-mini:hover{background:var(--paper);color:var(--ink)}
.td-block-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.td-block-title{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--ink)}
.td-prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);white-space:nowrap}
.td-prog-bar{width:120px;height:6px;border-radius:3px;background:#E8ECE6;overflow:hidden}
.td-prog-fill{height:100%;background:var(--green4);border-radius:3px;transition:width .25s}
.td-add-btn{font:inherit;font-size:13px;font-weight:600;color:#2F6F3E;background:#fff;border:1px dashed #BFD8BF;border-radius:var(--r-sm);padding:10px 14px;cursor:pointer}
.td-add-btn:hover{background:#F0F6EE;border-color:#9FC8A0}
.td-form{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:10px;max-width:640px}
.td-in,.td-sel{width:100%;box-sizing:border-box;font:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff}
.td-row{display:flex;gap:10px;flex-wrap:wrap}
.td-row>div{flex:1;min-width:130px}
.td-lab{font-size:11px;color:var(--muted);margin-bottom:4px;display:block}
.td-save{align-self:flex-start;font:inherit;font-size:13px;font-weight:600;color:#fff;background:var(--green);border:0;border-radius:var(--r-sm);padding:9px 18px;cursor:pointer}
.td-save:hover{filter:brightness(.96)}
.td-star{color:#CBD5C5}
.td-star.on{color:var(--amber)}
.td-task.urgent{border-left:3px solid var(--red)}
.td-tag.td-urgent{background:#FBE4E4;color:var(--red);border-color:#F0C9C9}
.td-tag.due-od{background:#FBE4E4;color:var(--red);border-color:#F0C9C9}
.td-tag.due-soon{background:#FFF3DF;color:#9A5410;border-color:#EAD9B0}
.td-hero{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.td-hero-date{font-size:13px;color:var(--muted);margin-top:2px}
.td-when-btn{font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 11px;cursor:pointer}
.td-when-btn:hover{background:#EAF0E8}
.td-sec-h{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--ink);margin:0 0 11px}
.td-chk-lab{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer}
.td-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
.bp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.bp-modes{display:flex;gap:6px;flex-wrap:wrap}
.bp-mode-btn{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 14px;cursor:pointer}
.bp-mode-btn:hover{border-color:var(--green4)}
.bp-mode-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bp-grp-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 9px}
.bp-sec-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;cursor:pointer;margin-bottom:8px;transition:all .12s}
.bp-sec-row:hover{border-color:var(--green4);background:#F7FAF6}
.bp-sec-name{font-size:14px;font-weight:600;color:var(--ink)}
.bp-sec-desc{font-size:12px;color:var(--muted);margin-top:2px}
.bp-tick{width:20px;height:20px;border-radius:50%;border:2px solid #CBD5C5;flex-shrink:0;position:relative}
.bp-tick.on{background:var(--green);border-color:var(--green)}
.bp-tick.on:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.bp-steps{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.bp-step{font:inherit;font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.bp-step:hover{border-color:var(--green4)}
.bp-step.on{background:var(--green);color:#fff;border-color:var(--green)}
.bp-step-dot{width:6px;height:6px;border-radius:50%;background:#CBD5C5}
.bp-step.done .bp-step-dot{background:var(--green4)}
.bp-step.on .bp-step-dot{background:#fff}
.bp-why{background:#EEF4FB;border:1px solid #D4E3F3;border-radius:var(--r-md);padding:13px 15px;font-size:13px;color:#2c4a66;line-height:1.6;margin-bottom:20px}
.bp-q{font-size:14px;font-weight:600;color:var(--ink);margin:20px 0 4px}
.bp-q:first-of-type{margin-top:4px}
.bp-hint{font-size:12px;color:var(--muted);margin-bottom:11px;line-height:1.5}
.bp-chips{display:flex;flex-wrap:wrap;gap:8px}
.bp-chip{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill);padding:7px 14px;cursor:pointer;transition:all .12s}
.bp-chip:hover{border-color:var(--green4)}
.bp-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bp-input,.bp-textarea,.bp-num,.bp-sel{font:inherit;font-size:13px;width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink)}
.bp-textarea{min-height:96px;resize:vertical;line-height:1.6}

.perf-gap{font-weight:700}
.perf-progress{height:8px;background:var(--green2);border-radius:var(--r-pill);overflow:hidden;margin-top:16px}
.perf-progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--green4),var(--green));border-radius:var(--r-pill);transition:width .3s}
.perf-sec-card{padding:20px 22px 10px;position:relative;overflow:hidden}
.perf-sec-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--green4),var(--green))}
.perf-sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.perf-sec-head .t{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--ink)}
.perf-sec-count{font-size:12px;font-weight:700;color:var(--green6);background:var(--green2);padding:3px 11px;border-radius:var(--r-pill);white-space:nowrap}
.perf-side{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 13px}
.perf-side.fee{background:#f3f8f3;border-color:#dcebdc}
.perf-side.locked{opacity:.9}
.perf-side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.perf-side-head .lk{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--muted)}
.perf-rate button:disabled{cursor:not-allowed;opacity:.5}
.perf-rate button:disabled:hover{border-color:var(--line)}
.perf-due{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,var(--ink),#21392a);color:#fff;border-radius:var(--r-md);padding:18px 22px;margin-bottom:18px}
.perf-due.ok{background:linear-gradient(120deg,#2f8f4e,#236f3c)}
.perf-due .due-l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.6)}
.perf-due .due-v{font-family:'Fraunces',serif;font-size:24px;font-weight:600;margin-top:3px}
.perf-due .due-s{font-size:13px;color:rgba(255,255,255,.72);margin-top:4px}
.perf-due-btn{background:#fff;color:var(--ink);border:none;border-radius:var(--r-sm);padding:11px 20px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.perf-due-btn:hover{background:var(--green2)}
.perf-bd-row{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.perf-bd-row .nm{flex:0 0 210px;font-size:13px;color:var(--ink)}
.perf-bd-bar{flex:1;min-width:60px;height:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-pill);overflow:hidden}
.perf-bd-bar > i{display:block;height:100%;border-radius:var(--r-pill);transition:width .3s}
.perf-bd-row .sc{flex:0 0 54px;text-align:right;font-size:13px;font-weight:700;color:var(--ink)}
@media(max-width:600px){.perf-bd-row .nm{flex-basis:130px}}
.fr-pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.fr-pick-grid{grid-template-columns:1fr}}
.fr-pick{display:flex;flex-direction:column;align-items:flex-start;gap:7px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 20px;cursor:pointer;font-family:inherit;transition:all .15s;position:relative;overflow:hidden}
.fr-pick:hover{border-color:var(--green4);box-shadow:0 5px 16px rgba(0,0,0,.06);transform:translateY(-1px)}
.fr-pick:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--green4),var(--green))}
.fr-pick-top{margin-bottom:2px}
.fr-pick-name{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--ink);line-height:1}
.fr-pick-sub{font-size:13px;color:var(--muted)}
.fr-pick-go{font-size:13px;font-weight:700;color:var(--green);margin-top:5px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand-logo{height:38px;width:auto;display:block;background:#fff;padding:4px 6px;border-radius:var(--r-sm);flex:none}
.brand-text{min-width:0}
.brand-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;letter-spacing:-0.3px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11px;opacity:.55;letter-spacing:.4px;margin-top:1px;white-space:nowrap}
@media(max-width:760px){.header{gap:8px}.header .refresh span{display:none}.header .refresh{padding:9px 10px}.brand-sub{display:none}}
@media(max-width:560px){.brand{gap:8px}.brand-logo{height:30px}.brand-title{font-size:16px}}
</style>
</head>

    <button class="login-btn" id="loginBtn">Log in</button>
    <div class="login-err" id="loginErr"></div>

<script>
// ====== CONNECTION SETTINGS — paste your two values here ======
// 1. Deploy the Apps Script (dashboard_api.gs) as a Web App and paste its /exec URL below.
// 2. Pick a long random password and paste the SAME string here and in the Apps Script.
const API_URL   = 'https://script.google.com/macros/s/AKfycbxN137wCPVA5IVaHseSxCK8-ffURw51bAaoCx8s0fvNxqM3Ci0Oh3gF-ZkzRmbl94SeEA/exec';

// ==============================================================

let rawJobs=[], customers=[], rawLeads=[], rawRecurring=[], numToCust={}, manualNames={}, customerNotes={}, scorecards={}, plan={}, lastSeenMap={};
let scoreEditFor=null;
let jobsPeriod=[], jobs=[], prevJobs=[], allCustomers=[], churnedList=[], monthlyData=[], serviceData=[], missingPriceData=[];
let roundsBoard = { assign:{}, rounds:{}, placeholders:{} };
let leadStats=null, recurringStats=null, prevTotals=null;
let rawCalls=[], callsStats=null, callsFilter='open', callsWho='', callSearch='', callType='all';
let custContact={};   // name -> {phone, addr, pc} for the customer detail sheet
let numberNotes={};   // normalised number -> {note, by}: the per-caller note store
let activeTab="Overview", custSegFilter="All", custSearch="";
let regSub="Map"; // sub-view inside the Regulars tab: Map / Planner / Rounds / Scorecard
let resSub="Overview"; // sub-view inside the Resources tab: Overview / Plan / Docs / Tools / Missing
// Possible header names a customer phone number might live under, once it's added to the feed.
const PHONE_HEADERS = ['Phone','Customer Phone','Mobile','Telephone','Phone Number','Contact Number','Cell','Tel'];
// Reduce any stored format to the UK national significant number so they all compare equal:
// +44 7713..., 447713..., 4407713..., 07713..., 7713... all become 7713...; landlines like
// 01202 736149 / 1202736149 / +441202736149 all become 1202736149.
function normNum(s) {
  let d = String(s == null ? '' : s).replace(/\D/g, '');
  if (!d) return '';
  if (d.indexOf('00') === 0) d = d.slice(2);   // drop international 00 prefix
  if (d.indexOf('44') === 0) d = d.slice(2);    // drop UK country code
  while (d.charAt(0) === '0') d = d.slice(1);    // drop the trunk 0 (and any stray leading zeros)
  return d;
}
// A call stays in the chase list (counts as "open") only for these. Anything else is a closed outcome.
// 'No answer' is a legacy value kept open so old rows behave sensibly.
function isCallOpen(st) {
  st = String(st == null ? '' : st).trim();
  return st === '' || st === 'New' || st === 'Needs callback' || st === 'Left message' || st === 'No answer';
}
let custSort={k:'r',d:'desc'}, recSort={k:'r',d:'desc'}, churnSort={k:'r',d:'desc'}, missSort={k:'z',d:'desc'};
let dfRange="all", dfFrom=null, dfTo=null, franchiseeView="All";

// Fold the many free-text Service Type values into the canonical service lines shown on the
// website, so the "Revenue by service" breakdown is a short, readable list instead of every
// one-off description. Ordered: first pattern to match wins, anything unmatched lands in "Other".
const SERVICE_GROUPS = [
  ['Assessment visits',                   /assessment/i],
  ['Regular Garden Maintenance',          /regular garden maintenance|garden maintenance|grounds maintenance|strim.*mow.*blow|regular maintenance/i],
  ['Garden Tidy-Up',                      /tidy/i],
  ['Hedge Cutting',                       /hedge/i],
  ['Pressure Washing & Exterior Cleaning',/pressure wash|exterior clean|soft wash|soft was|patio|driveway|jet wash/i],
  ['Garden Waste & Clearance',            /waste|clearance|tip run|rubbish|bamboo|leaf clear|removal/i],
  ['Lawn Care & Renovation',              /lawn care|lawn treatment|lawn renovation|renovation|scarif|aerat|overseed|turf|fertilis/i],
  ['Grass Cutting & Lawn Edging',         /grass cutting|lawn edging|lawn mowing|mowing|\bmow\b/i],
  ['Planting & Landscaping',              /planting|landscap|plant sourcing|compost|bark|decorative stone|mulch|nursery|garden project|mesh|border/i],
  ['Weed & Moss Control',                 /weed|moss/i]
];
function serviceGroup(name) {
  const s = String(name || '');
  for (let i = 0; i < SERVICE_GROUPS.length; i++) if (SERVICE_GROUPS[i][1].test(s)) return SERVICE_GROUPS[i][0];
  return 'Other';
}

// ---------- CSV ----------
function parseCSVLine(line) {
  const result = []; let current = ''; let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { result.push(current); current = ''; }
    else { current += ch; }
  }
  result.push(current);
  return result;
}
function parseCSV(text) {
  const lines = text.split('\n');
  if (lines.length < 2) return [];
  const headers = parseCSVLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = parseCSVLine(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => obj[h.trim()] = (vals[idx] || '').trim());
    rows.push(obj);
  }
  return rows;
}
// Tolerant reader: scans the first rows for the line containing a known header keyword,
// so a title/banner row above the real headers no longer breaks parsing.
function parseCSVSmart(text, keywords) {

// to the named operator, overriding the franchisee recorded on their jobs. For genuine misattributions
// (e.g. always Mike's customer, but another operator covered the first few visits). Keys are lowercased names.
const OWNER_REASSIGN = { "nicky waters": "Mike" };
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthOverlaps(k,b){ if(!b.from||!b.to) return true; const p=k.split('-'); const y=+p[0],m=+p[1]; const s=new Date(y,m-1,1), e=new Date(y,m,0,23,59,59); return e>=b.from && s<=b.to; }
// Per-franchisee Zenbooker monthly revenue within bounds b (all franchisees, ignores the view toggle).
function zenMonthlyByFr(b){
  const mike={}, adam={};
  rawJobs.forEach(j=>{ if(!j._date) return; if(b.from&&b.to&&(j._date<b.from||j._date>b.to)) return;
    const k=monthKey(j._date);
    if(j._franchisee==='Mike') mike[k]=(mike[k]||0)+j._amount;
    else if(j._franchisee==='Adam') adam[k]=(adam[k]||0)+j._amount; });
  return {mike,adam};
}
// Mike's revenue for a month, override applied: invoiced figure up to the cutoff, else Zenbooker.
function mikeRevFor(k,zenMike){ return (k<=HIST_CUTOFF && MIKE_HIST[k]!=null) ? MIKE_HIST[k] : (zenMike[k]||0); }
// Corrected revenue total for a given view within bounds b. Used by the KPI delta and Mike-vs-Adam.
function revTotalFor(b,view){
  const z=zenMonthlyByFr(b);
  const keys=new Set([...Object.keys(z.mike),...Object.keys(z.adam)]);
  if(view!=='Adam'){ for(const k in MIKE_HIST){ if(k<=HIST_CUTOFF && monthOverlaps(k,b)) keys.add(k); } }
  let mTot=0, aTot=0;
  keys.forEach(k=>{ mTot += mikeRevFor(k,z.mike); aTot += (z.adam[k]||0); });
  if(view==='Mike') return Math.round(mTot);
  if(view==='Adam') return Math.round(aTot);
  return Math.round(mTot+aTot);
}
// Rewrite the period's monthlyData (built from Zenbooker) so Mike's pre-2026 months use the
// invoiced figures, and backfilled months with no Zenbooker jobs are added revenue-only (no
// job/customer count). Mutates the global monthlyData in place, honouring the current view.
function applyHistoricalRevenue(){
  const b=dfBounds();
  const z=zenMonthlyByFr(b);
  const byKey={}; monthlyData.forEach(m=>{ byKey[m.m]=m; });
  if(franchiseeView!=='Adam'){
    monthlyData.forEach(m=>{
      const k=m.m;
      if(k>HIST_CUTOFF) return;
      if(MIKE_HIST[k]==null) return;
      m.r = Math.round(m.r - (z.mike[k]||0) + MIKE_HIST[k]); // swap Mike's Zenbooker slice for invoiced
    });
    for(const k in MIKE_HIST){
      if(k>HIST_CUTOFF) continue;
      if(byKey[k]) continue;
      if(!monthOverlaps(k,b)) continue;
      monthlyData.push({ m:k, j:(MIKE_HIST_JOBS[k]??null), r:Math.round(MIKE_HIST[k]), c:(MIKE_HIST_CUST[k]||0), hist:true }); // backfill: invoiced revenue + invoiced jobs/customers (pre-Oct-2024)
    }
  }
  monthlyData.sort((a,b2)=>a.m.localeCompare(b2.m));
}

function loadData() {
  if (!auth) { showLogin(''); return; }
  if (API_URL.indexOf('PASTE_') === 0) {
    showMsg('Almost there. Open this file and paste your Web App URL and token into the CONNECTION SETTINGS block near the top of the script, then redeploy.');
    return;
  }
  // Paint the last saved payload straight away, if there is one for this user.
  paintedFromCache = false;
  let cached = null;
  try { const raw = localStorage.getItem(dataCacheKey()); if (raw) cached = JSON.parse(raw); } catch (_) { cached = null; }
  if (cached && !cached.error && cached.jobs) {
    paintedFromCache = true;
    handleData(cached, true);
    syncPill('Updating\u2026');
  } else {
    showSkeleton();
  }
  const cb = 'mtg_cb_' + Date.now();
  const s = document.createElement('script');
  let done = false;
  const cleanup = () => { try { delete window[cb]; } catch(_) { window[cb] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); };
  const failSoft = (msg) => {
    if (paintedFromCache) { syncPill('Offline \u00b7 showing saved data', true); setTimeout(() => syncPill(''), 6000); }
    else showMsg(msg);
  };
  window[cb] = function(data) { done = true; cleanup(); handleData(data); };
  s.onerror = function() { if (!done) { cleanup(); failSoft('Could not reach the MTG app. Check the Web App URL is correct and deployed with access set to "Anyone".'); } };
  setTimeout(() => { if (!done) { cleanup(); failSoft('The MTG app did not respond. Check the Web App URL and token, then try Refresh.'); } }, 20000);
  s.src = API_URL + (API_URL.indexOf('?') === -1 ? '?' : '&') + 'user=' + encodeURIComponent(auth.user) + '&pass=' + encodeURIComponent(auth.pass) + '&callback=' + cb;
  document.head.appendChild(s);
}

function handleData(data, fromCache) {
  if (!data || data.error) {
    if (data && /unauthor/i.test(String(data.error))) { doLogout(); showLogin('Your session ended. Please log in again.'); return; }
    if (paintedFromCache && !fromCache) { syncPill('Could not refresh \u00b7 showing saved data', true); setTimeout(() => syncPill(''), 6000); return; }
    showMsg('The MTG app refused the request' + (data && data.error ? ' (' + data.error + ')' : '') + '.');
    return;
  }
  if (!fromCache) {
    try {
      const j = JSON.stringify(data);
      if (j.length < 4500000) localStorage.setItem(dataCacheKey(), j);
    } catch (_) {}
    paintedFromCache = false;
    syncPill('');
    setTimeout(function(){ try{ maybeNotify(); }catch(_){} }, 200);
  }
  rawJobs = data.jobs || [];
  lastSeenMap = data.lastSeen || {};
  rawLeads = data.leads || [];
  rawRecurring = data.recurring || [];
  rawCalls = data.calls || [];
  customers = [];

  // Manual caller labels (the "name this caller" store), keyed by national number.
  manualNames = {};
  (data.contacts || []).forEach(ct => {
    const num = normNum(ct.Number || ct.number);
    const nm = String(ct.Name || ct.name || '').trim();
    if (num && nm) manualNames[num] = { name: nm, by: String(ct['Updated By'] || '').trim() };
  });

  // Per-number call notes: one note per caller, keyed by normalised number. This is the
  // note shown on a call card, so it stays with the number through transfers, outcomes
  // and re-renders instead of living on whichever call row happened to be on top.
  numberNotes = {};
  (data.numberNotes || []).forEach(nn => {
    const num = normNum(nn.Number || nn.number);
    if (!num) return;
    numberNotes[num] = { note: String(nn.Note || ''), by: String(nn['Updated By'] || '').trim() };
  });

  // Customer churn reasons + free notes, keyed by normalised customer name.
  customerNotes = {};
  (data.customerNotes || []).forEach(cn => {
    const nm = normName(cn.Customer || cn.customer);
    if (!nm) return;
    customerNotes[nm] = { disposition: String(cn.Disposition || '').trim(), note: String(cn.Note || ''), by: String(cn['Updated By'] || '').trim() };
  });

  // Regular-job scorecards, keyed by normalised customer name. The Scores cell is a
  // JSON string of {questionId: 1|2|3}; we parse it and recompute percent/grade locally.
  scorecards = {};
  (data.scorecards || []).forEach(sc => {
    const nm = normName(sc.Customer || sc.customer);
    if (!nm) return;
    let scores = {};
    try { const p = JSON.parse(sc.Scores || sc.scores || '{}'); if (p && typeof p === 'object') scores = p; } catch (e) {}
    scorecards[nm] = { scores: scores, by: String(sc['Scored By'] || '').trim(), at: String(sc['Scored At'] || '').trim() };
  });
  // Seasonal value plans, keyed by normalised name. The Plan cell is a JSON blob of the
  // edited fields; anything not stored falls back to a sensible default derived from live data.
  plan = {};
  (data.plan || []).forEach(p => {
    const nm = normName(p.Customer || p.customer);
    if (!nm) return;
    let obj = {};
    try { const j = JSON.parse(p.Plan || p.plan || '{}'); if (j && typeof j === 'object') obj = j; } catch (e) {}
    plan[nm] = obj;
  });
  // Editable reference points from the Map Places sheet (falls back to defaults pre-deploy).
  if (data.places && data.places.length) {
    mapPlaces = data.places.map(p => ({
      kind: String(p.Kind || p.kind || '').trim().toLowerCase(),
      op: String(p.Operator || p.operator || '').trim(),
      label: String(p.Label || p.label || '').trim(),
      q: String(p.Address || p.address || '').trim()
    })).filter(p => p.kind && p.label);
  }
  // The 4-week rota board: one saved document of day assignments and named rounds.
  roundsBoard = (data.rounds && typeof data.rounds === 'object') ? data.rounds : {};
  if (!roundsBoard.assign || typeof roundsBoard.assign !== 'object') roundsBoard.assign = {};
  if (!roundsBoard.rounds || typeof roundsBoard.rounds !== 'object') roundsBoard.rounds = {};
  if (!roundsBoard.assignOff || typeof roundsBoard.assignOff !== 'object') roundsBoard.assignOff = {};
  if (!roundsBoard.roundsOff || typeof roundsBoard.roundsOff !== 'object') roundsBoard.roundsOff = {};
  if (!roundsBoard.placeholders || typeof roundsBoard.placeholders !== 'object') roundsBoard.placeholders = {};
  // Per-user to-do list: adopt the saved server copy, or seed the server from local on first run.
  todoBoot(data);
  // Per-user business plan: adopt the saved server copy once per session.
  bpBoot(data);
  // Franchisee performance reviews: adopt saved server copy, else local cache, always merged with the seed.
  perfBoot(data);

  rawJobs.forEach(j => {
    j._amount = parseAmount(j['Amount (£)']);
    j._date = parseDate(j['Date Completed']);
    let svc = j['Service Type'] || 'Unknown';
    if (svc === 'Regular Garden Maintenance Visits' || svc === 'Regular Strim, Mow, & Blow' || svc === 'Strim, Mow, & Blow') svc = 'Regular Garden Maintenance';
    j._service = svc;
    j._franchisee = j['Franchisee'] || '';
    { const rn = normName(j['Customer Name']); if (rn && OWNER_REASSIGN[rn]) j._franchisee = OWNER_REASSIGN[rn]; }
    j._postcode = String(j.postcode || '').toUpperCase();
  });
  // Adam's pre-franchise (subcontractor) jobs are not franchisee performance and aren't Mike's, so drop them.
  rawJobs = rawJobs.filter(j => !(j._franchisee === 'Adam' && j._date && j._date < ADAM_FRANCHISE_START));
  rawLeads.forEach((l, li) => {
    l._date = parseDate(col(l,['Date Received','Received','Date']));
    l._quote = parseAmount(col(l,['Quoted Price','Quote','Price','Value']));
    l._rawStatus = (col(l,['Status']) || '').trim().toUpperCase();
    // Pipeline status the dashboard drives, from the "Lead Status" column, falling back to
    // the raw Zenbooker status so pre-existing leads start in the funnel with no migration.
    l._status = ((col(l,['Lead Status']) || col(l,['Status']) || 'New').trim().toUpperCase());
    l._leadNotes = col(l,['Lead Notes']) || '';
    l._updatedBy = col(l,['Updated By']) || '';
    // The server Key (needed for writes). Until the Key column exists and the backend is
    // deployed it is blank, so every row also gets a unique client-side fallback key for
    // opening the right detail panel; writes stay disabled until a real key arrives.
    l._serverKey = col(l,['Key']) || '';
    l._key = l._serverKey || ('idx:'+li);
    // Offer gate (permanent) and pipeline stage (progress) are separate dimensions.
    l._updatedAtD = parseDate(col(l,['Updated At']));
    l._offer = (col(l,['Offer']) || '').trim().toUpperCase();
    l._offerAt = parseDate(col(l,['Offer At']));
    const stU = l._status;
    l._stage = (['CONTACTED','QUOTED','BOOKED','LOST','NOT RELEVANT','SPAM'].indexOf(stU)!==-1) ? stU : 'NEW';
    // Self-healing gate: the lead's CURRENT state wins over a stale Offer cell. A lead
    // that is accepted or progressing with a live owner cannot still be "Expired" or
    // "Declined" (that history lives in its notes); and a New lead with a live owner is
    // by definition awaiting a response. Prevents double counting after re-offers.
    const exM = String(l._leadNotes||'').match(/Expired from (Mike|Adam)/g);
    l._expiredFrom = exM ? exM[exM.length-1].replace('Expired from ','') : '';
    const live = l._franchisee==='Mike' || l._franchisee==='Adam';
    if (live && (l._offer==='EXPIRED' || l._offer==='DECLINED' || l._offer==='')) {
      if (stU==='ACCEPTED' || ['CONTACTED','QUOTED','BOOKED'].indexOf(stU)!==-1) l._offer='ACCEPTED';
      else if (stU==='NEW') l._offer='PENDING';
    }
    l._franchisee = (col(l,['Franchisee','Owner']) || '').trim();
    l._source = (col(l,['Source']) || '').trim() || 'Unknown';
    l._name = col(l,['Customer Name','Customer','Name']);
    l._svc = col(l,['Service Requested','Service']);
    l._territory = col(l,['Territory']);
    l._phone = col(l, PHONE_HEADERS);
  });
  rawRecurring.forEach(r => {
    r._created = parseDate(col(r,['Date Created','Created','Date']));
    r._canceled = parseDate(col(r,['Date Canceled','Date Cancelled','Cancelled','Canceled']));
    r._value = parseAmount(col(r,['Value','Price','Amount']));
    r._status = (col(r,['Status']) || '').trim().toUpperCase();
    r._franchisee = (col(r,['Franchisee','Owner']) || '').trim();
    r._cust = col(r,['Customer Name','Customer','Name']);
    { const rn = normName(r._cust); if (rn && OWNER_REASSIGN[rn]) r._franchisee = OWNER_REASSIGN[rn]; }
    r._svc = col(r,['Service']);
    r._freq = col(r,['Frequency','Recurring Frequency']);
    r._postcode = String(r.postcode || '').toUpperCase();
  });
  rawCalls.forEach(c => {
    c._date = parseDate(col(c,['Logged At','Logged','Date']));
    c._type = (col(c,['Type'])||'').trim();
    c._caller = col(c,['Caller']);
    c._callerNorm = normNum(c._caller);
    c._fr = (col(c,['Franchisee'])||'').trim();
    c._status = (col(c,['Status'])||'').trim();
    c._detail = col(c,['Status Detail']);
    c._time = col(c,['Time of Call']);
    c._dur = col(c,['Duration']);
    c._trans = col(c,['Transcription']);
    c._by = col(c,['Updated By']);
    c._note = col(c,['Notes','Note']);
    c._key = col(c,['Key']);
  });

  applyFilters();
  renderTabs();
  renderContent();
  dfRender();
}

// ---------- date logic ----------
function ukTaxYearBounds(ref) {
  const d = ref || new Date(); const y = d.getFullYear();
  const startThis = new Date(y, 3, 6);
  if (d < startThis) return { from: new Date(y-1, 3, 6), to: new Date(y, 3, 5, 23, 59, 59) };
  return { from: startThis, to: new Date(y+1, 3, 5, 23, 59, 59) };
}
function prevUkTaxYear() {
  const cur = ukTaxYearBounds();
  return { from: new Date(cur.from.getFullYear()-1, 3, 6), to: new Date(cur.from.getFullYear(), 3, 5, 23, 59, 59) };
}
function dfBounds() {
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth();
  let b;
  switch (dfRange) {
    case 'this-month':    b = { from: new Date(y, m, 1),     to: new Date(y, m+1, 0, 23, 59, 59) }; break;
    case 'last-month':    b = { from: new Date(y, m-1, 1),   to: new Date(y, m, 0, 23, 59, 59) }; break;
    case 'ytd':           b = { from: new Date(y, 0, 1),     to: now }; break;
    case 'tax-year':      b = ukTaxYearBounds(); break;
    case 'last-tax-year': b = prevUkTaxYear(); break;
    case 'last-12mo':     b = { from: new Date(y-1, m, now.getDate()), to: now }; break;
    case 'all':           return { from: null, to: null };
    case 'custom':        b = { from: dfFrom, to: dfTo }; break;
    default:              return { from: null, to: null };
  }
  // Never let an in-progress period run past now, so it compares like-for-like with last year.
  if (b && b.to && b.to > now) b.to = now;
  return b || { from: null, to: null };
}
function prevBounds(b) {
  if (!b.from || !b.to) return { from: null, to: null };
  // Year-on-year: the same window one year earlier. Gardening is seasonal, so this June
  // should be compared with last June, not with May.
  const shift = (d) => { const n = new Date(d.getTime()); n.setFullYear(n.getFullYear() - 1); return n; };
  return { from: shift(b.from), to: shift(b.to) };
}

// ---------- aggregation ----------
function applyFilters() {
  const b = dfBounds();
  const inB = (d) => !b.from || !b.to ? true : (d && d >= b.from && d <= b.to);
  jobsPeriod = rawJobs.filter(j => inB(j._date));
  jobs = franchiseeView === 'All' ? jobsPeriod : jobsPeriod.filter(j => j._franchisee === franchiseeView);
  const pb = prevBounds(b);
  let pj = (pb.from && pb.to) ? rawJobs.filter(j => j._date && j._date >= pb.from && j._date <= pb.to) : [];
  prevJobs = franchiseeView === 'All' ? pj : pj.filter(j => j._franchisee === franchiseeView);
  processData();
  try{ renderTabs(); }catch(_){}
  processPrev();
  processLeads(b);
  processRecurring(b);
  processCalls(b);
}

function processData() {
  const now = new Date();
  const cutoff90 = new Date(now); cutoff90.setDate(cutoff90.getDate() - 90);
  const norm = n => String(n || '').trim().toLowerCase();

  // ALL-TIME, view-filtered history decides the SEGMENT (independent of the selected period).
  const histJobs = franchiseeView === 'All' ? rawJobs : rawJobs.filter(j => j._franchisee === franchiseeView);

  // Recurring customers from the live Recurring Bookings feed (active = not cancelled).
  const recurringNames = new Set(
    rawRecurring.filter(r => matchView(r._franchisee))
      .filter(r => !r._canceled && r._status !== 'CANCELED' && r._status !== 'CANCELLED')
      .map(r => norm(r._cust)).filter(Boolean)
  );

  // Build each customer's all-time picture: total jobs ever, recurrence, first/last visit.
  const histMap = {};
  histJobs.forEach(j => {
    const name = j['Customer Name']; if (!name) return;
    const k = norm(name);
    if (!histMap[k]) histMap[k] = { hasRecurring: recurringNames.has(k), freq: '', count: 0, first: null, last: null };
    const h = histMap[k];
    h.count++;
    if (j['Recurring Frequency'] && String(j['Recurring Frequency']).trim()) { h.hasRecurring = true; h.freq = String(j['Recurring Frequency']).trim(); }
    if (j._date) { if (!h.first || j._date < h.first) h.first = j._date; if (!h.last || j._date > h.last) h.last = j._date; }
  });

  // Recurrence is decided FIRST, from all-time data — not from how many visits fall in the period.
  function segmentFor(h) {
    if (h.hasRecurring) return (h.last && h.last < cutoff90) ? 'Churned' : 'Recurring';
    if (h.count >= 5 && h.last && h.last < cutoff90) return 'Churned';
    if (h.count >= 2) return 'Repeat';
    return 'One-Off';
  }

  // PERIOD, view-filtered jobs decide the DISPLAYED numbers (jobs, revenue, avg).
  const NAME_ALIAS = { 'Lyn':'Lynn', 'Sam':'Sam Allen' };  // same person, two spellings in Zenbooker
  const custMap = {};
  jobs.forEach(j => {
    const raw = j['Customer Name']; if (!raw) return;
    const name = NAME_ALIAS[raw] || raw;
    if (!custMap[name]) custMap[name] = { name, jobs: [], totalRev: 0, franchisee: j._franchisee, services: new Set() };
    custMap[name].jobs.push(j);
    custMap[name].totalRev += j._amount;
    custMap[name].services.add(j._service);
    custMap[name].franchisee = j._franchisee || custMap[name].franchisee;
  });

  // True lifetime value per customer, independent of the selected period: all-time view-filtered
  // Zenbooker revenue, plus Mike's pre-Zenbooker invoiced and cash work and his folded-in historical customers.
  const ltvRev = {};
  const addLtv = (nm, amt) => { if (!nm || !amt) return; const key = norm(nm); ltvRev[key] = (ltvRev[key] || 0) + amt; };
  histJobs.forEach(j => addLtv(NAME_ALIAS[j['Customer Name']] || j['Customer Name'], j._amount));
  if (franchiseeView !== 'Adam') {
    Object.keys(MIKE_CUST_PRIOR).forEach(nm => addLtv(nm, MIKE_CUST_PRIOR[nm].pr));
    Object.keys(MIKE_CASH_PRIOR).forEach(nm => addLtv(nm, MIKE_CASH_PRIOR[nm].pr));
    MIKE_HIST_CUSTOMERS.forEach(hc => addLtv(hc.n, hc.r));
    MIKE_PASSED_EXTRA.forEach(hc => addLtv(hc.n, hc.r));
  }

  allCustomers = Object.values(custMap).map(c => {
    const h = histMap[norm(c.name)] || { hasRecurring:false, freq:'', count:c.jobs.length, first:null, last:null };
    const priced = c.jobs.filter(j => j._amount > 0);
    const avg = priced.length ? priced.reduce((s,j) => s + j._amount, 0) / priced.length : 0;
    const rgmJobs = c.jobs.filter(j => j._service === 'Regular Garden Maintenance');
    const visit = rgmJobs.length
      ? rgmJobs.reduce((s,j) => s + j._amount, 0) / rgmJobs.length
      : (c.jobs.length ? c.totalRev / c.jobs.length : 0);
    return { n: c.name, j: c.jobs.length, r: Math.round(c.totalRev*100)/100, a: Math.round(avg*100)/100,
      visit: Math.round(visit*100)/100,
      f: c.franchisee, s: segmentFor(h), freq: h.freq, first: h.first, last: h.last,
      daysSince: h.last ? daysBetween(h.last, now) : 999, svc: Array.from(c.services).slice(0,3).join(', ') };
  }).sort((a,b) => b.r - a.r);
  // Add CONTINUING customers' pre-Oct-2024 invoiced revenue/jobs onto their live totals (no crossover: Zenbooker covers Oct 2024 on).
  if (franchiseeView !== 'Adam') {
    const pb = dfBounds();
    if (!pb.from || pb.from < new Date(2024, 9, 1)) {   // only when the period reaches before Oct 2024
      allCustomers.forEach(c => {
        const pr = MIKE_CUST_PRIOR[c.n];
        if (!pr) return;
        c.r = Math.round((c.r + pr.pr) * 100) / 100;
        c.j = c.j + pr.pj;
        c.a = c.j ? Math.round(c.r / c.j) : c.a;
        c.visit = c.a;
        if (pr.f) { const pf = new Date(pr.f); if (!c.first || pf < c.first) c.first = pf; }
      });
      allCustomers.forEach(c => {     // pre-Oct-2024 cash work that was never invoiced
        const cp = MIKE_CASH_PRIOR[c.n];
        if (!cp) return;
        c.r = Math.round((c.r + cp.pr) * 100) / 100;
        c.j = c.j + cp.pj;
        c.a = c.j ? Math.round(c.r / c.j) : c.a;
        c.visit = c.a;
      });
      allCustomers.sort((a,b) => b.r - a.r);
    }
  }
  // Fold in Mike's pre-Oct-2024 invoice customers (gone before Zenbooker began), segmented by the same rules.
  // If the same person is already live (e.g. Adam serves them now), merge into that row rather than adding a duplicate.
  if (franchiseeView !== 'Adam') {
    const bnd = dfBounds();
    const byNorm = {}; allCustomers.forEach(c => { if (!byNorm[norm(c.n)]) byNorm[norm(c.n)] = c; });
    const inPeriod = (cf, cl) => !((bnd.from && cl < bnd.from) || (bnd.to && cf > bnd.to));
    const addOrMerge = (hc, passed) => {
      const cf = new Date(hc.f), cl = new Date(hc.l);
      if (!inPeriod(cf, cl)) return;
      const ex = byNorm[norm(hc.n)];
      if (ex) {   // already present from the live feed: combine the relationship into one row
        ex.r = Math.round((ex.r + hc.r) * 100) / 100;
        ex.j += hc.j;
        ex.a = ex.j ? Math.round(ex.r / ex.j) : ex.a;
        ex.visit = ex.a;
        if (!ex.first || cf < ex.first) ex.first = cf;
        if (!ex.last || cl > ex.last) ex.last = cl;
        if (passed && franchiseeView === 'Mike') ex.s = 'Passed to Adam'; // a live handover reads as "passed" only in Mike's view; the overall and Adam views keep their live status
        return;
      }
      const av = hc.j ? Math.round(hc.r/hc.j) : 0;
      const row = { n: hc.n, j: hc.j, r: hc.r, a: av, visit: av, f: 'Mike', s: passed ? 'Passed to Adam' : hc.s,
        freq: '', first: cf, last: cl, daysSince: daysBetween(cl, now), svc: 'Garden maintenance', hist: true };
      allCustomers.push(row);
      byNorm[norm(hc.n)] = row;
    };
    MIKE_HIST_CUSTOMERS.forEach(hc => addOrMerge(hc, false));
    MIKE_PASSED_EXTRA.forEach(hc => addOrMerge(hc, true));
    allCustomers.sort((x,y) => y.r - x.r);
  }
  // Churned-list corrections (Mike + All views): transfers to Adam, a rename, and a duplicate merge.
  // Match by name regardless of territory, because a customer Adam now serves is tagged to him by their latest job.
  if (franchiseeView !== 'Adam') {
    const fixNorm = {}; Object.keys(MIKE_CUST_FIX).forEach(k => fixNorm[norm(k)] = MIKE_CUST_FIX[k]);
    const byNorm = {}; allCustomers.forEach(c => { if (!byNorm[norm(c.n)]) byNorm[norm(c.n)] = c; });
    const drop = new Set();
    allCustomers.forEach(c => {
      const fix = fixNorm[norm(c.n)];
      if (!fix) return;
      if (fix === 'adam') { if (franchiseeView === 'Mike' || c.hist) c.s = 'Passed to Adam'; } // live handovers keep their live status in the overall view; only Mike's view and historical-only customers read as "passed"
      else if (fix === 'repeat') c.s = 'Repeat';
      else if (fix.startsWith('merge:')) {
        const tgt = byNorm[norm(fix.slice(6))];
        if (tgt && tgt !== c) { tgt.r = Math.round((tgt.r + c.r) * 100) / 100; tgt.j += c.j; tgt.a = tgt.j ? Math.round(tgt.r/tgt.j) : tgt.a; ltvRev[norm(tgt.n)] = (ltvRev[norm(tgt.n)]||0) + (ltvRev[norm(c.n)]||0); }
        drop.add(c);
      }
    });
    if (drop.size) allCustomers = allCustomers.filter(c => !drop.has(c));
  }
  // True all-time lifetime value, never below the period figure (so a short period can't make it look smaller than it is).
  allCustomers.forEach(c => { c.ltv = Math.round(Math.max(ltvRev[norm(c.n)] || 0, c.r) * 100) / 100; });
  allCustomers.forEach(c => { c.inherited = TRANSFERRED_TO_ADAM.has(norm(c.n)); }); // Adam's inherited book, for the tag
  allCustomers.forEach(c => { const cn = customerNotes[norm(c.n)]; c.disp = cn ? cn.disposition : ''; c.note = cn ? cn.note : ''; }); // saved churn reason + note
  // A churned customer marked "Transferred to another franchisee" was kept within MTG, not lost,
  // so move them out of the churn list into the Passed to Adam bucket (skip any wholesale-reassigned).
  allCustomers.forEach(c => { if (c.s === 'Churned' && c.disp === 'Transferred to another franchisee' && !OWNER_REASSIGN[norm(c.n)]) c.s = 'Passed to Adam'; });
  allCustomers.forEach(c => { c.score = scorecards[norm(c.n)] || null; c.plan = plan[norm(c.n)] || null; }); // saved scorecard / saved season plan or null
  // Each customer's postcode for the map: prefer their active recurring booking, else their most recent job.
  const pcByCust = {};
  rawRecurring.forEach(r => { if (r._postcode && r._cust) { const k = norm(r._cust); if (!pcByCust[k]) pcByCust[k] = r._postcode; } });
  const jobPc = {};
  histJobs.forEach(j => { const nm = NAME_ALIAS[j['Customer Name']] || j['Customer Name']; if (!nm || !j._postcode) return; const k = norm(nm); const d = j._date ? j._date.getTime() : 0; if (!jobPc[k] || d >= jobPc[k].d) jobPc[k] = { pc: j._postcode, d }; });
  allCustomers.forEach(c => { const k = norm(c.n); c.postcode = pcByCust[k] || (jobPc[k] ? jobPc[k].pc : '') || ''; });
  // Each customer's full service address, same precedence, used for accurate door-to-door routes.
  const addrByCust = {};
  rawRecurring.forEach(r => { const a = String(r.address || '').trim(); if (a && r._cust) { const k = norm(r._cust); if (!addrByCust[k]) addrByCust[k] = a; } });
  const jobAddr = {};
  histJobs.forEach(j => { const a = String(j.address || '').trim(); const nm = NAME_ALIAS[j['Customer Name']] || j['Customer Name']; if (!nm || !a) return; const k = norm(nm); const d = j._date ? j._date.getTime() : 0; if (!jobAddr[k] || d >= jobAddr[k].d) jobAddr[k] = { a:a, d:d }; });
  allCustomers.forEach(c => { const k = norm(c.n); c.address = addrByCust[k] || (jobAddr[k] ? jobAddr[k].a : '') || ''; });
  // Best-estimate annual value: realised regular-maintenance revenue over the trailing 12 months
  // (extras such as pressure washing or lawn care are excluded by counting only the maintenance
  // service), annualised for customers with under a year of history. Falls back to the cadence x
  // price model only when there is too little real data to trust.
  const REF = (function(){ let mx = 0; rawJobs.forEach(j => { if (j._date && j._date.getTime() > mx) mx = j._date.getTime(); }); return mx ? new Date(mx) : new Date(); })();
  const winStart = REF.getTime() - 365 * 864e5;
  const recSum = {}, recFirst = {};
  histJobs.forEach(j => {
    if (j._service !== 'Regular Garden Maintenance' || !j._date || !(j._amount > 0)) return;
    const nm = NAME_ALIAS[j['Customer Name']] || j['Customer Name']; if (!nm) return;
    const k = norm(nm), t = j._date.getTime();
    if (recFirst[k] === undefined || t < recFirst[k]) recFirst[k] = t;
    if (t >= winStart && t <= REF.getTime()) recSum[k] = (recSum[k] || 0) + j._amount;
  });
  allCustomers.forEach(c => {
    const k = norm(c.n), sum = recSum[k] || 0, first = recFirst[k];
    let best;
    if (sum > 0 && first !== undefined) {
      const activeDays = (REF.getTime() - Math.max(first, winStart)) / 864e5;
      best = activeDays >= 330 ? sum : (activeDays >= 60 ? sum * 365 / activeDays : annualValue(c));
    } else best = annualValue(c);
    c.annual = Math.round(best);
    c.annualReal = sum > 0;  // true when the figure came from real visits, not the model
  });
  churnedList = allCustomers.filter(c => c.s === 'Churned').sort((a,b) => b.r - a.r);

  // Number -> customer map for the Calls tab. Phone lives on the source rows (leads/recurring/jobs)
  // under one of PHONE_HEADERS. Empty until a phone column is added to the feed; lights up automatically when it is.
  numToCust = {};
  const _custByName = {}; allCustomers.forEach(c => { if (!_custByName[norm(c.n)]) _custByName[norm(c.n)] = c; });
  const _linkPhone = (nm, ph) => {
    const p = normNum(ph); if (!p || !nm) return;
    if (numToCust[p]) return;
    const cu = _custByName[norm(nm)] || null;
    numToCust[p] = { name: nm, status: cu ? cu.s : '', fr: cu ? cu.f : '', inherited: cu ? !!cu.inherited : false };
  };
  rawRecurring.forEach(r => _linkPhone(r._cust, col(r, PHONE_HEADERS)));
  rawLeads.forEach(l => _linkPhone(l._name, col(l, PHONE_HEADERS)));
  rawJobs.forEach(j => _linkPhone(col(j, ['Customer Name','Customer','Name']), col(j, PHONE_HEADERS)));

  // Name -> contact details for the customer detail sheet: phone from any source row,
  // address and postcode from the most recent job or booking that carries one.
  custContact = {};
  const _linkContact = (nm, ph, addr, pc) => {
    if (!nm) return;
    const k = norm(nm);
    if (!custContact[k]) custContact[k] = { phone:'', addr:'', pc:'' };
    const cc = custContact[k];
    if (!cc.phone) { const p = normNum(ph); if (p) cc.phone = p; }
    if (!cc.addr && addr) cc.addr = String(addr).trim();
    if (!cc.pc && pc) cc.pc = String(pc).trim();
  };
  rawLeads.forEach(l => _linkContact(l._name, col(l, PHONE_HEADERS), '', ''));
  rawRecurring.forEach(r => _linkContact(r._cust, col(r, PHONE_HEADERS), r.address, r.postcode));
  rawJobs.forEach(j => _linkContact(col(j, ['Customer Name','Customer','Name']), col(j, PHONE_HEADERS), j.address, j.postcode));
  // Manual caller names map number -> name; fold them back in as a fallback phone source.
  try {
    Object.keys(manualNames || {}).forEach(num => {
      const nm = manualNames[num]; if (!nm) return;
      const k = norm(String(nm));
      if (!custContact[k]) custContact[k] = { phone:'', addr:'', pc:'' };
      if (!custContact[k].phone) custContact[k].phone = normNum(num) || String(num);
    });
  } catch(_) {}

  const monthMap = {};
  jobs.forEach(j => {
    if (!j._date) return;
    const key = j._date.getFullYear() + '-' + String(j._date.getMonth()+1).padStart(2,'0');
    if (!monthMap[key]) monthMap[key] = { m: key, j: 0, r: 0, custs: new Set() };
    monthMap[key].j++; monthMap[key].r += j._amount;
    if (j['Customer Name']) monthMap[key].custs.add(j['Customer Name']);
  });
  monthlyData = Object.values(monthMap).sort((a,b) => a.m.localeCompare(b.m)).map(m => ({ m: m.m, j: m.j, r: Math.round(m.r), c: m.custs.size }));
  applyHistoricalRevenue();

  const svcMap = {};
  jobs.forEach(j => {
    const s = serviceGroup(j._service);
    if (!svcMap[s]) svcMap[s] = { n: s, j: 0, r: 0, priced: 0, pricedSum: 0 };
    svcMap[s].j++; svcMap[s].r += j._amount;
    if (j._amount > 0) { svcMap[s].priced++; svcMap[s].pricedSum += j._amount; }
  });
  serviceData = Object.values(svcMap).sort((a,b) => b.j - a.j).map(s => ({ n: s.n, j: s.j, r: Math.round(s.r), a: s.priced ? Math.round(s.pricedSum/s.priced) : 0 }));
  // Fold Mike's pre-Oct-2024 invoiced revenue into the service mix (categorised from descriptions), so the mix reflects full history.
  if (franchiseeView !== 'Adam' && monthlyData.some(m => m.m < '2024-10')) {
    const sd = {}; serviceData.forEach(s => sd[s.n] = s);
    Object.keys(MIKE_HIST_SERVICES).forEach(name => {
      const h = MIKE_HIST_SERVICES[name];
      const g = serviceGroup(name);
      if (sd[g]) { sd[g].j += h.j; sd[g].r += h.r; }
      else sd[g] = { n: g, j: h.j, r: h.r, a: h.j ? Math.round(h.r/h.j) : 0 };
    });
    serviceData = Object.values(sd).sort((a,b) => b.r - a.r);
  }

  const zeroMap = {};
  jobs.forEach(j => {
    if (j._amount > 0) return;
    if (/assessment|free/i.test(j._service || '')) return; // free assessment visits are legitimately £0
    const name = j['Customer Name']; if (!name) return;
    if (!zeroMap[name]) zeroMap[name] = { n: name, z: 0, svc: j._service };
    zeroMap[name].z++;
  });
  missingPriceData = Object.values(zeroMap).sort((a,b) => b.z - a.z);
  missingPriceData.forEach(mp => { const c = allCustomers.find(c => c.n === mp.n); mp.a = c ? c.a : 0; mp.est = mp.a > 0 ? mp.z * mp.a : 0; });
}

function processPrev() {
  const rev = revTotalFor(prevBounds(dfBounds()), franchiseeView); // override-aware so the change-vs-previous chip is right across the cutoff
  const custs = new Set(prevJobs.map(j => j['Customer Name']).filter(Boolean)).size;
  prevTotals = { rev: Math.round(rev), jobs: prevJobs.length, custs, has: prevJobs.length > 0 };
}

function processLeads(b) {
  let ls = rawLeads.filter(l => matchView(l._franchisee));
  if (b.from && b.to) ls = ls.filter(l => l._date && l._date >= b.from && l._date <= b.to);
  // Expired leads leave the owner's list (they belong to HQ now) but must not vanish
  // from their story: this collects the CURRENTLY-expired leads this view lost, shown
  // greyed-out behind the Expired chip. Re-offered leads drop out (they are live again).
  const inB2 = l => !(b.from && b.to) || (l._date && l._date >= b.from && l._date <= b.to);
  const expiredList = rawLeads.filter(l => l._offer==='EXPIRED' && inB2(l)
    && (franchiseeView==='All' ? true : l._expiredFrom===franchiseeView));
  const byStatus = {NEW:0,CONTACTED:0,QUOTED:0,BOOKED:0,LOST:0,SPAM:0,'NOT RELEVANT':0};
  const bySource = {}, byFr = {Mike:0,Adam:0,HQ:0,Other:0};
  ls.forEach(l => {
    if (byStatus[l._status] === undefined) byStatus[l._status] = 0;
    byStatus[l._status]++;
    bySource[l._source] = (bySource[l._source]||0)+1;
    if (l._franchisee === 'Mike') byFr.Mike++; else if (l._franchisee === 'Adam') byFr.Adam++; else if (l._franchisee === 'HQ') byFr.HQ++; else byFr.Other++;
  });
  const spam = byStatus.SPAM||0, expired = byStatus.EXPIRED||0, declined = byStatus.DECLINED||0, accepted = byStatus.ACCEPTED||0;
  // Offer gate counts (permanent answers) and the pipeline counted CUMULATIVELY over
  // accepted leads: a Booked lead still counts as Contacted and Quoted, because it was.
  const gate = { pending:0, accepted:0, declined:0, expired:0 };
  const pipe = { acceptedTotal:0, contacted:0, quoted:0, booked:0, lost:0 };
  ls.forEach(l => {
    if (l._status==='SPAM') return;
    if (l._offer==='PENDING') gate.pending++;
    else if (l._offer==='ACCEPTED') gate.accepted++;
    else if (l._offer==='DECLINED') gate.declined++;
    else if (l._offer==='EXPIRED' && franchiseeView==='All') gate.expired++;
    if (l._offer==='ACCEPTED') {
      pipe.acceptedTotal++;
      if (['CONTACTED','QUOTED','BOOKED'].indexOf(l._stage)!==-1) pipe.contacted++;
      if (['QUOTED','BOOKED'].indexOf(l._stage)!==-1) pipe.quoted++;
      if (l._stage==='BOOKED') pipe.booked++;
      if (l._stage==='LOST' || l._stage==='NOT RELEVANT') pipe.lost++;
    }
  });
  const lost = byStatus.LOST||0, notRelevant = byStatus['NOT RELEVANT']||0;
  // Spam is never counted. The ACTIVE pipeline is exactly the five funnel stages, so the
  // stage percentages always total 100; everything else (lost, not relevant, expired,
  // declined, spam) has left the funnel and is accounted for in the strip beneath it.
  const total = ls.length - spam, qualified = total, booked = byStatus.BOOKED||0;
  const activeTotal = (byStatus.NEW||0) + accepted + (byStatus.CONTACTED||0) + (byStatus.QUOTED||0) + booked;

function processRecurring(b) {
  // Reconstruct regular gained/lost from the full job history (accurate over all time,
  // not just since app tracking began). First visit = gained; 90+ days without a visit = lost.
  const now = new Date();
  const cutoff90 = new Date(now); cutoff90.setDate(cutoff90.getDate() - 90);
  const hist = {};
  rawJobs.filter(j => matchView(j._franchisee)).forEach(j => {
    const n = j['Customer Name']; if (!n) return;
    if (!hist[n]) hist[n] = { jobs: 0, rec: false, first: null, last: null };
    hist[n].jobs++;
    if (j['Recurring Frequency'] && j['Recurring Frequency'].trim()) hist[n].rec = true;
    if (j._date) {
      if (!hist[n].first || j._date < hist[n].first) hist[n].first = j._date;
      if (!hist[n].last  || j._date > hist[n].last)  hist[n].last  = j._date;
    }

  Object.values(hist).forEach(c => {
    if (c.jobs === 1) return;
    const isChurned = (c.rec || c.jobs >= 5) && c.last && c.last < cutoff90;
    const isActiveRecurring = c.rec && c.last && c.last >= cutoff90;
    if (isChurned) { regulars.push(c); churned.push(c); }
    else if (isActiveRecurring) { regulars.push(c); }
  });
  const inB = (d) => (!b.from || !b.to) ? true : (d && d >= b.from && d <= b.to);
  const gained = regulars.filter(c => c.first && inB(c.first)).length;
  const lost = churned.filter(c => c.last && inB(c.last)).length;

  // Live app log kept as supplementary precise recent activity.
  const base = rawRecurring.filter(r => matchView(r._franchisee));
  recurringStats = {
    gained, lost, net: gained - lost,
    list: base.slice().sort((a,b2) => (b2._created?b2._created:0) - (a._created?a._created:0)),
    mapped: base.some(x => x._cust || x._status),
    headers: rawRecurring.length ? Object.keys(rawRecurring[0]).filter(k => !k.startsWith('_')) : []

}

function processCalls(b) {
  let cs = rawCalls.filter(c => matchView(c._fr));
  if (b.from && b.to) cs = cs.filter(c => c._date && c._date >= b.from && c._date <= b.to);
  const now = Date.now();
  const AGE_MS = 31 * 24 * 3600 * 1000;   // a missed call with no message ages out after 31 days
  // Group by caller so we can spot repeat callers and age out stale ones.
  const byNum = {};
  cs.forEach(c => {
    c._aged = false;
    const k = c._callerNorm; if (!k) return;
    let g = byNum[k];
    if (!g) g = byNum[k] = { num: k, count: 0, open: 0, resolved: 0, last: null, first: null, calls: [], hasVM: false };
    g.count++;
    g.calls.push(c);
    if (/voicemail/i.test(c._type || '')) g.hasVM = true;
    if (isCallOpen(c._status)) g.open++; else g.resolved++;   // "resolved" here means any closed outcome
    if (c._date) { if (!g.last || c._date > g.last) g.last = c._date; if (!g.first || c._date < g.first) g.first = c._date; }
  });
  // Un-numbered calls can't be grouped, so age them one by one.
  cs.forEach(c => {
    if (c._callerNorm) return;
    c._aged = isCallOpen(c._status) && !/voicemail/i.test(c._type || '') && !!c._date && (now - c._date.getTime()) > AGE_MS;
  });
  Object.values(byNum).forEach(g => {
    // A whole number ages out only when every call is still open, none left a voicemail,
    // and the most recent attempt was over 31 days ago. Voicemails never auto-age.
    g.aged = (g.resolved === 0 && !g.hasVM && !!g.last && (now - g.last.getTime()) > AGE_MS);
    if (g.aged) g.calls.forEach(c => { c._aged = true; });
    g.openActive = g.aged ? 0 : g.open;
    g.ignoredCount = g.calls.filter(c => c._aged || c._status === 'Ignored').length;
    g.ignored = g.openActive === 0 && g.ignoredCount > 0;          // shows in the Ignored filter
    g.attention = g.count >= 2 && g.resolved === 0 && !g.aged;
  });
  const attentionNums = Object.values(byNum).filter(g => g.attention);
  callsStats = {
    total: cs.length,
    missed: cs.filter(c => /missed/i.test(c._type)).length,
    vm: cs.filter(c => /voicemail/i.test(c._type)).length,
    open: cs.filter(c => isCallOpen(c._status) && !c._aged).length,
    ignored: cs.filter(c => c._aged || c._status === 'Ignored').length,
    byNum: byNum,
    attention: attentionNums.length,
    list: cs.slice().sort((a, b2) => (b2._date ? b2._date : 0) - (a._date ? a._date : 0))
  };
}

  window[cb] = function(d) { done = true; cleanup(); onOk && onOk(d); };

  setTimeout(() => { if (!done) { cleanup(); onErr && onErr(); } }, 15000);

}

// Value-against-quality scatter. scored = [{c, r, av}].
function scorecardQuadrantSVG(scored){
  if(!scored.length) return '';
  const W=720,H=410,padL=66,padR=20,padT=24,padB=52, plotW=W-padL-padR, plotH=H-padT-padB;
  // Reserve label bands at top and bottom and a small side inset, so dots sit in a central
  // data area and never collide with the quadrant labels or straddle the frame edge.
  const bandT=44, bandB=42, insetX=18;
  const dataT=padT+bandT, dataB=padT+plotH-bandB, dataL=padL+insetX, dataR=padL+plotW-insetX;
  const vals=scored.map(s=>s.av); let maxV=Math.max(1,...vals);
  const step=maxV>4000?1000:maxV>2000?500:maxV>1000?250:100; maxV=Math.max(step,Math.ceil(maxV/step)*step);
  const xMin=30,xMax=100;
  const xs=p=>dataL+(Math.max(xMin,Math.min(xMax,p))-xMin)/(xMax-xMin)*(dataR-dataL);
  const ys=v=>dataB-(Math.max(0,Math.min(maxV,v))/maxV)*(dataB-dataT);
  const sv=vals.slice().sort((a,b)=>a-b);
  const medV=sv.length%2?sv[(sv.length-1)/2]:Math.round((sv[sv.length/2-1]+sv[sv.length/2])/2);
  const xL=xs(65), yL=ys(medV), split=scored.length>=2;
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;font-family:\'DM Sans\',sans-serif" xmlns="http://www.w3.org/2000/svg">';
  s+='<rect x="'+padL+'" y="'+padT+'" width="'+plotW+'" height="'+plotH+'" rx="6" fill="#FBFCFA" stroke="var(--line)"/>';
  if(split){
    s+='<rect x="'+xL+'" y="'+padT+'" width="'+(padL+plotW-xL)+'" height="'+(yL-padT)+'" fill="#2E7D32" opacity="0.05"/>';
    s+='<rect x="'+padL+'" y="'+padT+'" width="'+(xL-padL)+'" height="'+(yL-padT)+'" fill="#D98A2B" opacity="0.06"/>';
    s+='<rect x="'+xL+'" y="'+yL+'" width="'+(padL+plotW-xL)+'" height="'+(padT+plotH-yL)+'" fill="#1565C0" opacity="0.05"/>';
    s+='<rect x="'+padL+'" y="'+yL+'" width="'+(xL-padL)+'" height="'+(padT+plotH-yL)+'" fill="#C62828" opacity="0.05"/>';
    s+='<line x1="'+xL+'" y1="'+padT+'" x2="'+xL+'" y2="'+(padT+plotH)+'" stroke="#C7CFC4" stroke-dasharray="4 4"/>';
    s+='<line x1="'+padL+'" y1="'+yL+'" x2="'+(padL+plotW)+'" y2="'+yL+'" stroke="#C7CFC4" stroke-dasharray="4 4"/>';
    const lab=(x,y,t1,t2,c)=>'<text x="'+x+'" y="'+y+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="'+c+'">'+t1+'</text><text x="'+x+'" y="'+(y+14)+'" text-anchor="middle" font-size="9.5" fill="'+c+'" opacity="0.75">'+t2+'</text>';
    s+=lab((xL+padL+plotW)/2, padT+18, 'Keep & protect', 'high value, strong', '#2E7D32');
    s+=lab((padL+xL)/2, padT+18, 'Fix or reprice', 'high value, weak', '#B5681B');
    s+=lab((xL+padL+plotW)/2, padT+plotH-26, 'Nurture or upsell', 'easy, lower value', '#1565C0');
    s+=lab((padL+xL)/2, padT+plotH-26, 'Consider dropping', 'low value, weak', '#C62828');
  }
  s+='<text x="'+(padL+plotW/2)+'" y="'+(H-12)+'" text-anchor="middle" font-size="11" fill="var(--muted)">Quality score \u2192</text>';
  s+='<text x="15" y="'+(padT+plotH/2)+'" text-anchor="middle" font-size="11" fill="var(--muted)" transform="rotate(-90 15 '+(padT+plotH/2)+')">Estimated annual value \u2192</text>';
  [30,65,100].forEach(t=>{ s+='<text x="'+xs(t)+'" y="'+(padT+plotH+18)+'" text-anchor="middle" font-size="9.5" fill="var(--muted)">'+t+'%</text>'; });
  (split?[0,medV,maxV]:[0,maxV]).forEach(v=>{ s+='<text x="'+(padL-8)+'" y="'+(ys(v)+3)+'" text-anchor="end" font-size="9.5" fill="var(--muted)">'+fmt(v)+'</text>'; });
  const arg=n=>JSON.stringify(String(n)).replace(/"/g,'&quot;');
  const pts=scored.map(o=>({o, cx:xs(o.r.pct), cy:ys(o.av)}));
  // Dots that land on the same spot (same score and value) would hide each other, so fan them out sideways.
  const groups={}; pts.forEach(p=>{ const k=Math.round(p.cx/7)+'_'+Math.round(p.cy/7); (groups[k]=groups[k]||[]).push(p); });
  Object.keys(groups).forEach(k=>{ const g=groups[k]; if(g.length>1){ const spread=9; g.forEach((p,i)=>{ p.cx += (i-(g.length-1)/2)*spread; }); } });
  pts.forEach(p=>{ const o=p.o, c=scoreGradeColor(o.r.grade);
    const tip=o.c.n+' \u00b7 '+o.r.grade+' '+o.r.pct+'% \u00b7 ~'+fmt(o.av)+'/yr'+(o.r.complete?'':' (in progress)')+' \u00b7 click to open';
    s+='<circle class="qd-dot" cx="'+p.cx+'" cy="'+p.cy+'" r="7" fill="'+c+'" stroke="#fff" stroke-width="2.5" onclick="openScorecard('+arg(o.c.n)+')"><title>'+escAttr(tip)+'</title></circle>'; });
  return s+'</svg>';
}

async function geocodePlaces(list){
  const VB='-2.12,50.86,-1.66,50.66';
  for(let i=0;i<list.length;i++){
    const q=list[i].q; if(!q || (q in placeGeo)) continue;
    try{

      const j=await res.json();
      placeGeo[q] = (j && j.length) ? { lat:parseFloat(j[0].lat), lng:parseFloat(j[0].lon) } : null;
    }catch(e){ /* try again next visit */ }
    await sleepMs(700);
  }
  try{ localStorage.setItem('mtg_geo_places', JSON.stringify(placeGeo)); }catch(e){}

// Geocode UK postcodes to lat/lng via postcodes.io (free, no key), cached so each postcode is looked up once.
async function geocodePostcodes(pcs){
  const need = Array.from(new Set(pcs.filter(p=>p && !(p in geoCache))));
  for(let i=0;i<need.length;i+=100){
    const chunk=need.slice(i,i+100);
    try{
      const res=await fetch('https://api.postcodes.io/postcodes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({postcodes:chunk})});
      const j=await res.json();
      (j.result||[]).forEach(item=>{ const q=(item.query||'').toUpperCase(); geoCache[q]= item.result ? {lat:item.result.latitude,lng:item.result.longitude} : null; });
    }catch(e){ /* leave uncached, try again next time */ }
  }
  try{ localStorage.setItem('mtg_geo', JSON.stringify(geoCache)); }catch(e){}
}

    ? ' <span class="badge b-inherited" title="Customer handed to Adam when he became a franchisee">inherited</span>'
    : '');
}

/* ===== Customer detail sheet =====
   Tap any customer row to open a full-screen sheet (mobile) or centred card (desktop)
   with contact details, quick actions, the shared note, and a follow-up reminder that
   lands in the To-do list as a dated task. */
let custModalFor = null;
function custNorm(n){ return String(n||'').trim().toLowerCase(); }
function custByName(name){ const k=custNorm(name); return allCustomers.find(c=>custNorm(c.n)===k) || (churnedList||[]).find(c=>custNorm(c.n)===k) || null; }
function custContactOf(name){ return custContact[custNorm(name)] || { phone:'', addr:'', pc:'' }; }
function waNumber(p){ let d=String(p||'').replace(/\D/g,''); if(!d) return ''; if(d.indexOf('00')===0) d=d.slice(2); if(d.charAt(0)==='0') d='44'+d.slice(1); else if(d.indexOf('44')!==0 && d.length===10) d='44'+d; return d; }
function fmtPhone(p){ if(!p) return ''; let d=String(p).replace(/\D/g,''); if(d.indexOf('44')===0) d='0'+d.slice(2); else if(d.length===10 && d.charAt(0)!=='0') d='0'+d; return d.length===11 ? d.slice(0,5)+' '+d.slice(5) : d; }
function custRemId(name){ return 'cust-rem-'+custNorm(name).replace(/[^a-z0-9]+/g,'-'); }
function custReminder(name){ if(typeof todoState==='undefined'||!Array.isArray(todoState.tasks)) return null; const id=custRemId(name); const t=todoState.tasks.find(x=>x.id===id); if(!t) return null; if(todoState.doneMap && todoState.doneMap[t.id+':'+t.due]) return null; return t; }
function openCustomerFromRow(ev, name){ if(ev && ev.target && ev.target.closest && ev.target.closest('input,select,button,a,textarea,.sc-pill')) return; if(name) openCustomer(name); }
