// Cover days: re-attribute one visit's REVENUE to the other franchisee without touching
// who invoices (that stays with the customer's owner and their QB record). Franchisor
// (role All) only. Uses the job Key the backend computes per Completed Jobs row, and
// requires the "Revenue Franchisee" column on the Completed Jobs tab.
function cmVisitRevHTML(c){
  if(!auth || auth.role!=='All') return '';
  const k = normName(c.n);
  const vs = rawJobs.filter(j => normName(j['Customer Name'])===k && j['Key'] && j._date)
    .sort((a,b)=> b._date - a._date).slice(0,6);
  if(!vs.length) return '';
  const rows = vs.map(j => {
    const owner = j['Franchisee'] || '';
    const rev = j['Revenue Franchisee'] || owner || '';
    const other = rev==='Mike' ? 'Adam' : 'Mike';
    const moved = owner && rev && owner!==rev;
    const keyArg = JSON.stringify(String(j['Key'])).replace(/"/g,'&quot;');
    return '<div class="cm-row"><span>'+fmtDate(j._date)+'</span>'
      + '<span style="margin-left:8px;color:var(--muted)">'+(j._amount>0?fmt(j._amount):'\u2014')+'</span>'
      + '<span class="badge" style="margin-left:auto'+(moved?';background:#FFF3E0;color:#9A5410':'')+'" title="'+(moved?'Revenue credited to '+escAttr(rev)+', invoiced by '+escAttr(owner):'Revenue and invoicing: '+escAttr(rev))+'">'+escAttr(rev)+'</span>'
      + '<button class="cm-rev-btn" onclick="cmTransferRev('+keyArg+',\''+other+'\')" title="Credit this visit\u2019s revenue to '+other+' (invoicing stays with '+escAttr(owner)+')">\u2192 '+other+'</button></div>';
  }).join('');
  return '<div class="cm-sec">Visits \u00b7 revenue credit</div>' + rows
    + '<div style="font-size:11.5px;color:var(--muted);margin-top:6px">For cover days: moves the revenue credit on the dashboard only. Invoicing always stays with the customer\u2019s owner.</div>';
}
function cmTransferRev(key, to){
  apiCall({ action:'transferJobRevenue', key:key, to:to }, function(d){
    if(d && d.ok){
      const j = rawJobs.find(x => String(x['Key'])===String(key));
      if(j) j['Revenue Franchisee'] = to;
      if(custModalFor) openCustomer(custModalFor);
    } else { alert((d && d.error) || 'Transfer failed'); }
  }, function(){ alert('Could not reach the app'); });
}
function openCustomer(name){

  if(!c) return;
  custModalFor = c.n;
  const cc = custContactOf(c.n);
  const tel = cc.phone ? 'tel:0'+cc.phone.replace(/^0+/,'') : '';
  const wa  = cc.phone ? 'https://wa.me/'+waNumber(cc.phone) : '';
  const dirQ = cc.addr || cc.pc || '';
  const dir = dirQ ? 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dirQ) : '';

  const remBlock = rem
    ? '<div class="cm-rem-on">Reminder set for '+todoDueLabel(rem.due).toLowerCase()+' ('+rem.due.split('-').reverse().join('/')+')<button class="cm-rem-x" onclick="cmClearReminder()" aria-label="Remove reminder">\u00d7</button></div>'
    : '<div class="cm-rem"><input type="date" id="cmRemDate" min="'+todoYmd(0)+'" value="'+todoYmd(1)+'"><button class="cm-rem-btn" onclick="cmSetReminder()">Add to To-do</button></div>'
      + '<div style="font-size:12px;color:var(--muted);margin-top:7px">Creates a dated task in your To-do list. The note above is used as the task detail.</div>';

  const scoreBtn = c.s==='Recurring'

    '<div class="cm-head"><div><div class="cm-name">'+escAttr(c.n)+'</div><div class="cm-badges">'+badge(c.s)+badge(c.f)+(c.freq?'<span class="badge" style="background:var(--t-neutral-bg);color:var(--t-neutral-fg)">'+escAttr(c.freq)+'</span>':'')+'</div></div>'
    + '<button class="cm-x" onclick="closeCustomer()" aria-label="Close">\u00d7</button></div>'
    + '<div class="cm-body">'
    + '<div class="cm-stats">'
      + '<div class="cm-stat"><b>'+c.j+'</b><span>Jobs</span></div>'
      + '<div class="cm-stat"><b>'+life+'</b><span>Lifetime</span></div>'
      + '<div class="cm-stat"><b>'+(c.a>0?fmt(c.a):'\u2014')+'</b><span>Avg</span></div>'
      + '<div class="cm-stat"><b>'+(c.daysSince!=null&&c.daysSince<999?c.daysSince+'d':'\u2014')+'</b><span>Since visit</span></div>'
    + '</div>'
    + '<div class="cm-acts">'
      + (tel?'<a class="cm-act" href="'+tel+'">'+cmIcons.phone+'Call</a>':'<span class="cm-act off">'+cmIcons.phone+'Call</span>')
      + (wa?'<a class="cm-act wa" href="'+wa+'" target="_blank" rel="noopener">'+cmIcons.wa+'WhatsApp</a>':'<span class="cm-act off">'+cmIcons.wa+'WhatsApp</span>')
      + (dir?'<a class="cm-act" href="'+dir+'" target="_blank" rel="noopener">'+cmIcons.nav+'Directions</a>':'<span class="cm-act off">'+cmIcons.nav+'Directions</span>')
      + scoreBtn
    + '</div>'
    + '<div class="cm-sec">Contact</div>'
    + '<div class="cm-row">'+cmIcons.phone+(tel?'<a href="'+tel+'">'+fmtPhone(cc.phone)+'</a>':'<span class="na">Phone not on file</span>')+'</div>'
    + '<div class="cm-row">'+cmIcons.mail+'<span class="na">Email not on file</span></div>'
    + '<div class="cm-row">'+cmIcons.pin+(dirQ?'<span>'+escAttr(cc.addr||'')+(cc.pc?(cc.addr?', ':'')+escAttr(cc.pc):'')+'</span>':'<span class="na">Address not on file</span>')+'</div>'
    + '<div class="cm-sec">History</div>'
    + '<div class="cm-row"><span style="color:var(--muted)">First visit</span><span style="margin-left:auto;font-weight:600">'+fmtDate(c.first)+'</span></div>'
    + '<div class="cm-row"><span style="color:var(--muted)">Last visit</span><span style="margin-left:auto;font-weight:600">'+fmtDate(c.last)+'</span></div>'
    + (c.svc?'<div class="cm-row"><span style="color:var(--muted)">Services</span><span style="margin-left:auto;font-weight:600;text-align:right">'+escAttr(c.svc)+'</span></div>':'')
    + cmVisitRevHTML(c)
    + '<div class="cm-sec">Note</div>'
    + '<textarea class="cm-note" id="cmNote" placeholder="Add a note about this customer..." onchange="cmSaveNote(this.value)">'+escAttr(c.note||'')+'</textarea>'

    + remBlock
    + '</div>';
  document.getElementById('cmOv').classList.add('show');

  document.getElementById('custModal').classList.add('show');
  document.body.style.overflow='hidden';

/* ===================== LEADS CRM ===================== */
let leadModalFor = null;
const LEAD_ST = [
  ['New','New','amber'], ['Accepted','Accepted','blue'], ['Contacted','Contacted','blue'], ['Quoted','Quoted','blue'],
  ['Booked','Booked','green'], ['Declined','Declined','grey'], ['Expired','Expired','red'], ['Not relevant','Not relevant','grey'], ['Lost','Lost','grey'], ['Spam','Spam','grey']
];
function leadStLabel(v){ const u=String(v||'').toUpperCase(); for(const x of LEAD_ST) if(x[0].toUpperCase()===u) return x[1]; return v||'New'; }
function leadStCls(v){ const u=String(v||'').toUpperCase(); for(const x of LEAD_ST) if(x[0].toUpperCase()===u) return x[2]; return 'amber'; }
function leadPill(v){ const c=leadStCls(v); const col={amber:'#9A5410',blue:'#1D4E89',green:'var(--green)',grey:'#6B7466',red:'#C62828'}[c]||'#6B7466';
  const bg={amber:'#FFF3E0',blue:'#E7EFF8',green:'#E7F1E9',grey:'#EEF1EC',red:'#FDECEA'}[c]||'#EEF1EC';
  return '<span class="badge" style="background:'+bg+';color:'+col+'">'+escAttr(leadStLabel(v))+'</span>'; }
function leadByKey(k){ return rawLeads.find(l => String(l._key)===String(k)) || null; }

function openLead(key){
  const l = leadByKey(key);
  if(!l) return;
  leadModalFor = key;
  const sk = l._serverKey ? String(l._serverKey).replace(/'/g,"\\'") : '';
  // Web-form phone numbers sometimes arrive with stray leading zeros or a "00" prefix
  // (e.g. "007756998918"). Normalise to the bare national significant number first,
  // the same way the Calls tab does, then rebuild a clean UK number for display and links.
  const phoneClean = l._phone ? normNum(l._phone) : '';
  const phoneUk = phoneClean ? '0'+phoneClean : '';
  const wa = phoneClean ? 'https://wa.me/44'+phoneClean : '';
  const tel = phoneUk ? 'tel:'+phoneUk : '';
  const svc = l._svc || 'your enquiry';
  const waMsg = encodeURIComponent('Hi'+(l._name?' '+String(l._name).split(' ')[0]:'')+', thanks for your enquiry about '+svc+' with My Tidy Garden. When would suit you for a quick chat or to arrange a visit?');
  const mailto = 'mailto:?subject='+encodeURIComponent('My Tidy Garden \u2014 '+svc)+'&body='+waMsg;
  const canWrite = !!sk && (!auth || auth.role==='All' || (l._franchisee===auth.name));
  const cur = String(l._status||'New');
  const statusBtns = ['New','Accepted','Contacted','Quoted','Booked','Not relevant','Lost','Spam'].map(v=>{
    const on = v.toUpperCase()===cur.toUpperCase();
    return '<button class="lead-st-btn'+(on?' on':'')+'" onclick="leadSetStatus(\''+sk+'\',\''+v+'\')">'+leadStLabel(v)+'</button>';
  }).join('');
  // The OFFER banner: a New lead is an offer on a clock. Accept starts working it;
  // Decline (reason required) sends it straight to the HQ pool for re-offering.
  let offerBlock = '';
  if (canWrite && cur.toUpperCase()==='NEW') {
    let clockText = '';
    if (l._date) {
      const hoursLeft = Math.round(24 - (Date.now() - l._date.getTime())/3600000);
      clockText = hoursLeft > 0
        ? 'Respond within the 24-hour window or this lead reassigns to HQ.'
        : 'The 24-hour window has passed; this lead reassigns to HQ on the next sweep.';
    }
    offerBlock = '<div style="margin:14px 0 4px;padding:12px 14px;background:#FFF8EE;border:1px solid #F0DFC4;border-radius:10px">'
      + '<div style="font-size:12px;font-weight:700;color:#9A5410;letter-spacing:.04em;margin-bottom:6px">NEW LEAD OFFER</div>'
      + (clockText?'<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">'+clockText+'</div>':'')
      + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
      + '<button class="cm-rem-btn" style="padding:9px 18px" onclick="leadAccept(\''+sk+'\')">Accept lead</button>'
      + '<button class="lead-st-btn" style="padding:9px 14px" onclick="leadDecline(\''+sk+'\')">Decline\u2026</button>'
      + '</div></div>';
  }
  const acts = [];
  if(tel) acts.push('<a class="call-act" href="'+tel+'" onclick="leadContactAttempt(\''+sk+'\')">Call</a>');
  if(wa) acts.push('<a class="call-act call-wa" href="'+wa+'?text='+waMsg+'" target="_blank" rel="noopener" onclick="leadContactAttempt(\''+sk+'\')">WhatsApp</a>');
  acts.push('<a class="call-act" href="'+mailto+'">Email</a>');
  const other = l._franchisee==='Mike' ? 'Adam' : 'Mike';
  const noteVal = escAttr(l._leadNotes||'');
  const quoteVal = l._quote>0 ? l._quote : '';
  const writeBlock = canWrite ? (
      '<div class="cm-sec">Quote</div>'
      + '<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:var(--muted)">\u00a3</span>'
      + '<input id="leadQuoteInput" type="number" step="1" min="0" value="'+quoteVal+'" placeholder="set a price" style="width:120px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font:inherit">'
      + '<button class="cm-rem-btn" style="padding:7px 12px" onclick="leadSaveQuote(\''+sk+'\')">Save quote</button></div>'
      + '<div class="cm-sec">Pipeline status</div>'
      + '<div class="lead-st-grid">'+statusBtns+'</div>'
      + '<div class="cm-sec">Notes</div>'
      + '<textarea id="leadNoteInput" class="cm-note" rows="3" placeholder="Add a note\u2026" onchange="leadSaveNote(\''+sk+'\', this.value)">'+noteVal+'</textarea>'
      + '<div class="cm-sec">'+(l._franchisee==='HQ'?'Re-offer from the HQ pool':'Transfer')+'</div>'
      + ['Mike','Adam'].filter(t=>t!==l._franchisee).map(t=>'<button class="cm-rev-btn" style="margin-right:6px" onclick="leadTransfer(\''+sk+'\',\''+t+'\')">\u2192 '+(l._franchisee==='HQ'?'Offer to ':'Move to ')+t+'</button>').join('')
      + (l._franchisee!=='HQ' && (!auth||auth.role==='All') ? '<button class="cm-rev-btn" onclick="leadTransfer(\''+sk+'\',\'HQ\')">\u2192 HQ pool</button>' : '')
      + '<div class="cm-sec">Reject</div><button class="cm-rev-btn" style="margin-right:6px" onclick="leadRejectNotify(\''+sk+'\')">Reject \u0026 notify customer\u2026</button><button class="cm-rev-btn" onclick="if(confirm(\'Mark this lead as Lost without messaging the customer?\')) leadSetStatus(\''+sk+'\',\'Lost\')">Reject (no message)</button><div style="font-size:11.5px;color:var(--muted);margin-top:4px">Reject \u0026 notify marks the lead Lost and opens a standard \u201csorry, we are unable to help at this time\u201d message; plain Reject just marks it Lost.</div>'
    ) : (!sk
      ? '<div style="font-size:12.5px;color:var(--muted);margin-top:12px;padding:10px 12px;background:#FFF3E0;border-radius:8px">Actions are disabled: this lead has no Key yet. Add the \u201cKey\u201d, \u201cLead Status\u201d, \u201cLead Notes\u201d, \u201cUpdated By\u201d and \u201cUpdated At\u201d columns to the Leads tab and deploy the updated backend, then refresh.</div>'
      : '<div style="font-size:12px;color:var(--muted);margin-top:10px">This lead belongs to '+escAttr(l._franchisee||'the other operator')+'.</div>');

  document.getElementById('leadModal').innerHTML =
    '<div class="cm-head"><div><div class="cm-name">'+escAttr(l._name||'Lead')+'</div>'
    + '<div class="cm-badges">'+leadPill(l._status)+(l._franchisee?badge(l._franchisee):'')+(l._territory?'<span class="badge" style="background:var(--t-neutral-bg);color:var(--t-neutral-fg)">'+escAttr(l._territory)+'</span>':'')+'</div></div>'
    + '<button class="cm-x" onclick="closeLead()" aria-label="Close">\u00d7</button></div>'
    + '<div class="cm-body">'
    + '<div class="cm-row"><span style="color:var(--muted)">Service</span><span style="margin-left:auto;font-weight:600;text-align:right">'+escAttr(l._svc||'\u2014')+'</span></div>'
    + '<div class="cm-row"><span style="color:var(--muted)">Received</span><span style="margin-left:auto;font-weight:600">'+fmtDate(l._date)+'</span></div>'
    + '<div class="cm-row"><span style="color:var(--muted)">Phone</span><span style="margin-left:auto;font-weight:600">'+(phoneUk?escAttr(fmtPhone(phoneUk)):'\u2014')+'</span></div>'
    + '<div class="cm-row"><span style="color:var(--muted)">Source</span><span style="margin-left:auto;font-weight:600">'+escAttr(l._source||'\u2014')+'</span></div>'
    + '<div class="cm-acts" style="display:flex;gap:8px;margin:14px 0 4px">'+acts.join('')+'</div>'
    + offerBlock
    + writeBlock
    + '</div>';
  document.getElementById('cmOv').classList.add('show');
  document.getElementById('cmOv').setAttribute('onclick','closeLead()');
  document.getElementById('leadModal').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeLead(){
  leadModalFor=null;
  document.getElementById('cmOv').classList.remove('show');
  document.getElementById('cmOv').setAttribute('onclick','closeCustomer()');
  document.getElementById('leadModal').classList.remove('show');
  document.body.style.overflow='';
}
function _leadLocal(key, fn){ const l=leadByKey(key); if(l) fn(l); }
function leadSetStatus(key, status){
  apiCall({ action:'updateLeadStatus', key:key, status:status }, function(d){
    if(d && d.ok){ _leadLocal(key, l=>{ l['Lead Status']=status; l._status=status.toUpperCase(); }); if(leadModalFor===key) openLead(key); if(activeTab==='Leads'){ processLeads(dfBounds()); renderContent(); } }
    else alert((d&&d.error)||'Could not update status');
  }, function(){ alert('Could not reach the app'); });
}
function leadSaveNote(key, note){
  apiCall({ action:'updateLeadNote', key:key, note:note }, function(d){
    if(d && d.ok){ _leadLocal(key, l=>{ l['Lead Notes']=note; l._leadNotes=note; }); }
    else alert((d&&d.error)||'Could not save note');
  }, function(){ alert('Could not reach the app'); });
}
function leadSaveQuote(key){
  const el=document.getElementById('leadQuoteInput'); if(!el) return;
  const q=el.value;
  apiCall({ action:'updateLeadQuote', key:key, quote:q }, function(d){
    if(d && d.ok){ _leadLocal(key, l=>{ l['Quoted Price']=q; l._quote=parseAmount(q); }); openLead(key); if(activeTab==='Leads'){ processLeads(dfBounds()); renderContent(); } }
    else alert((d&&d.error)||'Could not save quote');
  }, function(){ alert('Could not reach the app'); });
}
function leadAccept(key){
  apiCall({ action:'acceptLead', key:key }, function(d){
    if(d && d.ok){ _leadLocal(key, l=>{ l['Lead Status']='Accepted'; l._status='ACCEPTED'; l._stage='NEW'; l._offer='ACCEPTED'; l._offerAt=new Date(); }); if(leadModalFor===key) openLead(key); if(activeTab==='Leads'){ processLeads(dfBounds()); renderContent(); } }
    else alert((d&&d.error)||'Could not accept');
  }, function(){ alert('Could not reach the app'); });
}
function leadDecline(key){
  const reason = prompt('Why are you declining this lead? (e.g. at capacity, out of scope, too far)');
  if (reason === null) return;   // cancelled
  apiCall({ action:'declineLead', key:key, reason:reason }, function(d){
    if(d && d.ok){ _leadLocal(key, l=>{ l['Lead Status']='Declined'; l._status='DECLINED'; l['Franchisee']='HQ'; l._franchisee='HQ'; }); if(leadModalFor===key) openLead(key); if(activeTab==='Leads'){ processLeads(dfBounds()); renderContent(); } }
    else alert((d&&d.error)||'Could not decline');
  }, function(){ alert('Could not reach the app'); });
}
/* ===== MANAGE LEADS: a guided queue that walks every outstanding item, one at a
   time, until the book is clean. Offers to answer, accepted leads awaiting contact,
   stale follow-ups (2+ days without movement), and the HQ pool for re-offering. ===== */
let mlQueue=[], mlIdx=0;
function mlQueueBuild(){
  const owned = franchiseeView!=='All' ? [franchiseeView] : ['Mike','Adam'];
  const q=[]; const STALE_MS = 2*86400000;
  rawLeads.forEach(l=>{
    if(!l._serverKey || l._status==='SPAM') return;
    const own = owned.indexOf(l._franchisee)!==-1;
    if(own && l._offer==='PENDING' && l._stage==='NEW') q.push({t:'offer', l});

// Deadline clocks made visible: how long before the sweep acts on this lead.

  }
  if (l._offer==='ACCEPTED' && l._stage==='NEW') {
    const start = l._offerAt || l._updatedAtD;
    if (!start) return null;
    const left = 24*H - (Date.now()-start.getTime());
    return { kind:'contact', left, label: left>0 ? ('contact within '+leadHrs(left)) : 'Your 24 hours to make contact are up. Contact the customer and update the outcome now, before this lead moves to HQ.', urgent: left < 6*H, over: left<=0 };

function areaChartSVG(data, color) {

  const max = Math.max(...data.map(d=>d.r), 1), n = data.length;
  const xs = i => padL + (n===1 ? (W-padL-padR)/2 : i*(W-padL-padR)/(n-1));
  const ys = v => padT + (1 - v/max)*(H-padT-padB);
  const pts = data.map((d,i)=>[xs(i),ys(d.r)]);
  const baseY = H-padB;
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = 'M'+pts[0][0].toFixed(1)+','+baseY+' '+pts.map(p=>'L'+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+' L'+pts[n-1][0].toFixed(1)+','+baseY+' Z';
  let grid='';

  let xl=''; const idxs = n<=8 ? data.map((_,i)=>i) : [0,Math.floor(n/3),Math.floor(2*n/3),n-1];
  idxs.forEach(i=>{ xl+='<text x="'+xs(i).toFixed(1)+'" y="'+(H-8)+'" font-size="10" text-anchor="middle" fill="#9aa89c">'+shortMonth(data[i].m)+'</text>'; });
  return '<div class="svg-wrap"><svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">'
    + grid
    + '<path d="'+area+'" fill="'+color+'22"/>'
    + '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
    + pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="#fff" stroke="'+color+'" stroke-width="2"/>').join('')
    + pts.map((p,i)=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="16" fill="transparent" style="cursor:pointer" onmouseenter="showTip(event,\''+shortMonth(data[i].m)+'\',\''+fmt(data[i].r)+'\',\''+(data[i].j!=null?data[i].j+' jobs':'')+'\')" onmousemove="moveTip(event)" onmouseleave="hideTip()"></circle>').join('')
    + xl + '</svg></div>';
}

function funnelSVG(stages, total) {

// ---------- revenue helpers (period-aware, override-safe) ----------
// A labelled comparison: "vs May  ▲ 12%  (£3,120)". prev is the comparison figure.
function cmpRow(cur, prev, text) {
  if (!prev || prev === 0) return '';
  const d = Math.round((cur - prev) / prev * 100);
  const cls = d > 0 ? 'chip-up' : (d < 0 ? 'chip-down' : 'chip-flat');
  const arrow = d > 0 ? '\u25b2 ' : (d < 0 ? '\u25bc ' : '');
  return '<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)">'
    + text + ' <span class="chip ' + cls + '" style="margin-left:0">' + arrow + Math.abs(d) + '%</span>'
    + ' <span style="color:var(--muted)">(' + fmt(prev) + ')</span></span>';
}
// True when the selected period sits inside a single calendar month.
function isSingleMonthPeriod(b) {
  return !!(b.from && b.to && b.from.getFullYear() === b.to.getFullYear() && b.from.getMonth() === b.to.getMonth());
}
// The previous calendar month, capped to the same day so an in-progress month compares like-for-like.
function prevMonthBounds(b) {
  const y = b.from.getFullYear(), m = b.from.getMonth();
  const lastPrev = new Date(y, m, 0).getDate();          // last day of the previous month
  const cap = Math.min(b.to.getDate(), lastPrev);
  return { from: new Date(y, m - 1, 1), to: new Date(y, m - 1, cap, 23, 59, 59) };
}
// Override-aware revenue for one whole calendar month ("YYYY-MM"), honouring the view.
function monthRevFor(key, view) {
  const p = key.split('-'), y = +p[0], mm = +p[1];
  return revTotalFor({ from: new Date(y, mm - 1, 1), to: new Date(y, mm, 0, 23, 59, 59) }, view);
}
// n month keys ending at endKey (inclusive), oldest first.
function recentMonthKeys(endKey, n) {
  const p = endKey.split('-'), y = +p[0], m = +p[1], out = [];
  for (let i = n - 1; i >= 0; i--) out.push(monthKey(new Date(y, m - 1 - i, 1)));
  return out;
}
// Weekly revenue for a single live month, from the period+view-filtered jobs in scope.
function weeklyRevenue(b) {
  const r = [0, 0, 0, 0, 0], j = [0, 0, 0, 0, 0];
  jobs.forEach(job => {
    if (!job._date || job._date < b.from || job._date > b.to) return;
    const wi = Math.min(4, Math.floor((job._date.getDate() - 1) / 7));
    r[wi] += job._amount; j[wi]++;
  });
  const last = b.to.getDate(), ranges = [[1, 7], [8, 14], [15, 21], [22, 28], [29, 31]], out = [];
  for (let i = 0; i < 5; i++) {
    if (ranges[i][0] > last) break;
    out.push({ label: ranges[i][0] + '\u2013' + Math.min(ranges[i][1], last), r: Math.round(r[i]), j: j[i] });
  }
  return out;
}
// Horizontal revenue bars. rows: [{label, r, sub, hi}]. hi rows use the solid green gradient.
function hbarList(rows) {
  const max = Math.max(1, ...rows.map(x => x.r));
  return rows.map(x => {
    const w = Math.round(x.r / max * 100);
    const bg = x.hi ? 'linear-gradient(90deg,var(--green6),var(--green4))' : 'linear-gradient(90deg,#A9CDAC,#C8E2CA)';
    return '<div class="bar-row"><span class="bar-l">' + x.label + '</span><div class="bar-c">'
      + '<div class="bar" style="width:' + w + '%;background:' + bg + '"></div>'
      + '<span class="bar-v">' + fmt(x.r) + '</span>'

}
const SVC_COLORS = ['#2E7D32', '#66BB6A', '#1565C0', '#D98A2B', '#7E57C2', '#26A69A'];
// Service colour map: top groups by period revenue get distinct colours, the rest share grey.
function serviceColorMap() {
  const ranked = serviceData.slice().sort((a, b) => b.r - a.r);
  const top = ranked.slice(0, 6).map(s => s.n);
  const colorOf = { Other: '#9aa89c', Invoiced: '#C7D2C9' };
  top.forEach((n, i) => colorOf[n] = SVC_COLORS[i]);
  return { top, colorOf };
}
// Stacked monthly columns split by service group. Live months (post cutoff) are split from job
// records; pre-2026 invoiced months can't be split honestly, so they show as one neutral block.
function stackedServiceSVG(top, colorOf) {
  const months = monthlyData;
  if (!months.length) return '<div style="color:var(--muted);text-align:center;padding:36px">No data in this period.</div>';
  const byMonth = {}; months.forEach(m => byMonth[m.m] = {});
  jobs.forEach(j => {
    if (!j._date) return;
    const k = monthKey(j._date);
    if (!(k in byMonth) || k <= HIST_CUTOFF) return;
    const grp = serviceGroup(j._service);
    const g = top.indexOf(grp) >= 0 ? grp : 'Other';
    byMonth[k][g] = (byMonth[k][g] || 0) + j._amount;
  });
  const maxTot = Math.max(1, ...months.map(m => m.r));
  const W = 720, H = 240, padL = 46, padR = 14, padT = 14, padB = 46, n = months.length;
  const colW = (W - padL - padR) / n, bw = Math.min(46, colW * 0.62);
  const ys = v => padT + (1 - v / maxTot) * (H - padT - padB);
  const groups = top.concat(['Other']);
  let bars = '';
  months.forEach((m, i) => {
    const x = padL + colW * i + colW / 2 - bw / 2;
    let yTop = H - padB;
    if (m.m <= HIST_CUTOFF) {
      const h = (m.r / maxTot) * (H - padT - padB); yTop -= h;
      bars += '<rect x="' + x.toFixed(1) + '" y="' + yTop.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(0, h).toFixed(1) + '" fill="' + colorOf.Invoiced + '" rx="2"><title>' + shortMonth(m.m) + ' \u00b7 ' + fmt(m.r) + ' invoiced</title></rect>';
    } else {
      const segs = byMonth[m.m] || {};
      groups.forEach(g => {
        const v = segs[g] || 0; if (v <= 0) return;
        const h = (v / maxTot) * (H - padT - padB); yTop -= h;
        bars += '<rect x="' + x.toFixed(1) + '" y="' + yTop.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="' + (colorOf[g] || '#9aa89c') + '"><title>' + shortMonth(m.m) + ' \u00b7 ' + g + ' \u00b7 ' + fmt(v) + '</title></rect>';
      });
    }
  });
  let grid = '';
  [0, 0.5, 1].forEach(f => {
    const gy = ys(maxTot * f);
    grid += '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) + '" stroke="#E5EAE3"/>';
    grid += '<text x="' + (padL - 8) + '" y="' + (gy + 4).toFixed(1) + '" font-size="10" text-anchor="end" fill="#9aa89c">' + fmt(maxTot * f) + '</text>';
  });
  let xl = ''; const step = n <= 12 ? 1 : Math.ceil(n / 12);
  months.forEach((m, i) => {
    if (i % step !== 0 && i !== n - 1) return;
    const cx = padL + colW * i + colW / 2;
    xl += '<text x="' + cx.toFixed(1) + '" y="' + (H - padB + 16) + '" font-size="10" text-anchor="middle" fill="#9aa89c">' + shortMonth(m.m) + '</text>';
  });
  const anyHist = months.some(m => m.m <= HIST_CUTOFF);
  const legendItems = groups.concat(anyHist ? ['Invoiced'] : []);
  const legend = '<div style="display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px;font-size:12px;color:var(--muted)">'
    + legendItems.map(g => '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:11px;height:11px;border-radius:3px;background:' + (colorOf[g] || '#9aa89c') + ';display:inline-block"></span>' + (g === 'Invoiced' ? 'Invoiced (pre-2026, not split)' : g) + '</span>').join('') + '</div>';
  return '<div class="svg-wrap"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">' + grid + bars + xl + '</svg></div>' + legend;
}

/* ===================== Rounds board (4-week rota) ===================== */
const RB_DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const RB_TARGET_LO = 6, RB_TARGET_HI = 8;
const RB_COLORS = ['#E07B1A','#1565C0','#0D9488','#7C3AED','#D64545','#2E7D32','#B26A00','#3949AB','#C2185B','#00838F'];

// Which schedule the rounds board is editing: the core-season rota or the separate off-season
// (winter) rota. Each has its own placements and rounds, saved side by side in the same board

let rbSeasonMode = 'core';
function rbA(){ if(rbSeasonMode==='off'){ if(!roundsBoard.assignOff || typeof roundsBoard.assignOff!=='object') roundsBoard.assignOff={}; return roundsBoard.assignOff; } if(!roundsBoard.assign || typeof roundsBoard.assign!=='object') roundsBoard.assign={}; return roundsBoard.assign; }
function rbR(){ if(rbSeasonMode==='off'){ if(!roundsBoard.roundsOff || typeof roundsBoard.roundsOff!=='object') roundsBoard.roundsOff={}; return roundsBoard.roundsOff; } if(!roundsBoard.rounds || typeof roundsBoard.rounds!=='object') roundsBoard.rounds={}; return roundsBoard.rounds; }

// Placeholder customers: planning-only entries that are not yet in the live system. They live

function rbPhArr(){ const p=roundsBoard.placeholders||{}; return Object.keys(p).map(id=>p[id]); }
function rbPhToCust(p){
  const v4 = +p.v4 || 2;

  return { n:p.name, f:p.owner||'Mike', s:'Recurring', freq:freq, postcode:p.postcode||'', address:'', visit:0, j:0, r:0, ltv:0,

}
// All recurring customers (any operator) plus placeholders, for round bookkeeping that must not depend on the view.
function rbAllRecurring(){ return allCustomers.filter(c => c.s==='Recurring').concat(rbPhArr().map(rbPhToCust)); }
// The operator the board is scoped to. Follows the global view when it is set to one person;
// when the global view is All, a board-local toggle (rbViewOverride) lets you flip between

function rbView(){ return (franchiseeView==='All') ? rbViewOverride : franchiseeView; }
function rbSetView(v){ rbViewOverride = v; rbSel = {}; rbRerender(); rbInitGeocode(); }
// The recurring customers this board plans, scoped to the current operator view, biggest value first.
function rbCustomers(){
  const v = rbView();
  let live = allCustomers.filter(c => c.s==='Recurring' && (v==='All' || c.f===v));
  if(rbSeasonMode==='off') live = live.filter(c => !!planFields(c).wOn);   // winter plan ticked in the planner
  // A placeholder shadowed by a live customer of the same name disappears: the live record
  // wins (it is the real Zenbooker customer) and inherits the placement, since assignments
  // are keyed by name. The planned entry stays in the Planner flagged as a duplicate to delete.
  const liveKeys = {}; allCustomers.forEach(c => { if(c.s==='Recurring') liveKeys[normName(c.n)] = 1; });
  const ph = rbPhArr().map(rbPhToCust).filter(c => (v==='All' || c.f===v) && !liveKeys[normName(c.n)]);
  return live.concat(ph).sort((a,b)=> (b.ltv||b.r||0) - (a.ltv||a.r||0));
}
// The planned (placeholder) entry with this name, if any.
function rbPhByName(name){ const k=normName(name); return rbPhArr().find(p=>normName(p.name)===k) || null; }
const RB_WEEKS = [1,2,3,4];
function rbAssign(name){
  const k = normName(name);
  const store = rbA();
  let a = store[k];
  if(!a){ a = { day:null, anchor:1, pinned:false, rounds:[] }; store[k] = a; }
  if(a.day===undefined) a.day=null;
  if(a.anchor===undefined || !a.anchor) a.anchor=1;
  if(a.pinned===undefined) a.pinned=false;
  // migrate the old single round field to a list, so a customer can ride more than one round
  if(a.round!==undefined){ if(a.round){ if(!Array.isArray(a.rounds)) a.rounds=[]; if(a.rounds.indexOf(a.round)===-1) a.rounds.push(a.round); } delete a.round; }

}
function rbRound(rid){ return rbR()[rid] || null; }
function rbRoundsArr(){ const r=rbR(); return Object.keys(r).map(id=>r[id]); }
// The rounds a customer belongs to (pruned to ones that still exist).
function rbCustRounds(c){ return (rbAssign(c.n).rounds||[]).filter(rid=>rbRound(rid)); }
// Everyone who is ever a member of this round, regardless of which weeks it runs.
function rbRoundMembers(rid){ return rbCustomers().filter(c => (rbAssign(c.n).rounds||[]).indexOf(rid)!==-1); }
// How often a round runs, in weeks. A round inherits the cadence of its least frequent member,
// so a round built around fortnightly jobs runs fortnightly and a weekly customer in it only
// rides on those weeks. Stored on the round when grouped, derived for older rounds.
function rbRoundEvery(rd){
  if(rd.every) return Math.max(1, Math.min(4, rd.every));
  let e=1; rbAllRecurring().forEach(c=>{ if((rbAssign(c.n).rounds||[]).indexOf(rd.id)!==-1) e=Math.max(e, rbCadence(c)); });

}
function rbRoundDueWeeks(rd){ const every=rbRoundEvery(rd), base=(((rd.anchor||1)-1)%every); const out=[]; for(let w=1;w<=4;w++){ if(((w-1)%every)===base) out.push(w);} return out; }
function rbRoundActiveIn(rd, week){ return rbRoundDueWeeks(rd).indexOf(week)!==-1; }
// The single round a customer rides on a given week: the first of their rounds that runs that
// week. Null means they are loose that week, so the visit shows as a free card and can be grouped.
function rbActiveRound(c, week){ const rs=rbCustRounds(c); for(let i=0;i<rs.length;i++){ const rd=rbRound(rs[i]); if(rd && rbRoundActiveIn(rd, week)) return rs[i]; } return null; }
function rbIsLooseIn(c, week){ return rbDueIn(c, week) && !rbActiveRound(c, week); }
// The day a customer sits on: the day of their round(s) if grouped, else their own loose day.
function rbCustDay(c){ const rs=rbCustRounds(c); if(rs.length){ const rd=rbRound(rs[0]); if(rd) return rd.day; } return rbAssign(c.n).day; }
// The anchor week (1-4). A non-weekly customer in a round aligns to that round's fortnight; a
// weekly customer is due every week so the anchor does not matter for them.
function rbCustAnchor(c){ const a=rbAssign(c.n); if(rbCadence(c)>1){ const rs=rbCustRounds(c); for(let i=0;i<rs.length;i++){ const rd=rbRound(rs[i]); if(rd && rd.anchor) return rd.anchor; } } return a.anchor||1; }
// How often, in weeks, this customer is visited (1 = weekly, 2 = fortnightly, 4 = four-weekly).
// Trust the planner's visits-per-4-weeks first, since that is the curated figure, then fall
// back to the live booking frequency text.
function rbCadence(c){
  if(rbSeasonMode==='off'){
    // Winter: spread the planner's winter visit count (wV) over the off season (~12 weeks,
    // usually ~10 worked). E.g. 3 visits => every 4 weeks, 6 => fortnightly, 12 => weekly.
    const wv = +planFields(c).wV || 0;
    if(wv > 0) return Math.max(1, Math.min(4, Math.round(PLAN_OFF_WEEKS / wv)));
    return 4;   // winter ticked but no visit count yet: assume every 4 weeks
  }
  const v4 = +planFields(c).v4 || 0;
  if(v4 > 0) return Math.max(1, Math.min(4, Math.round(4 / v4)));
  const f = String(c.freq||'').toLowerCase();

  const m = f.match(/every\s+(\d+)\s+week/); if(m) return Math.max(1,parseInt(m[1],10));

// Which of weeks 1-4 this customer falls in, from their cadence and anchor week.
function rbDueWeeks(c){
  const every=rbCadence(c), base=((rbCustAnchor(c)-1)%every);

}
function rbDueIn(c, week){ return rbDueWeeks(c).indexOf(week)!==-1; }
// Hours the OPERATOR personally spends on the visit: total labour (hv) split across the crew
// (gd). The planner keeps counting the total; the rounds board plans one person's day.
function rbHv(c){ const f=planFields(c); const hv=+f.hv||0; const gd=Math.max(1,+f.gd||1); return hv ? hv/gd : 0; }
function rbCrew(c){ return Math.max(1, +planFields(c).gd || 1); }
function rbFreqTag(c){
  const e = rbCadence(c);
  if(e===1) return 'wk'; if(e===2) return '2wk'; if(e===4) return '4wk'; return e+'wk';
}

// The board travels in a GET URL (JSONP), which Apps Script caps at roughly 8k characters.
// rbAssign auto-creates a default record for every customer it renders, so without pruning

// mints a default entry per winter customer). Strip pure-default entries and default fields;
// rbAssign regenerates the defaults on demand after reload, so nothing is lost.
function rbCompactAssign_(store){
  const out={};
  Object.keys(store||{}).forEach(k=>{
    const a=store[k]||{}; const e={};
    if(a.day!=null) e.day=a.day;
    if(a.day2!=null) e.day2=a.day2;
    if(a.anchor && a.anchor!==1) e.anchor=a.anchor;
    if(a.pinned) e.pinned=true;
    if(a.ord!=null) e.ord=a.ord;
    if(Array.isArray(a.rounds) && a.rounds.length) e.rounds=a.rounds;
    if(Object.keys(e).length) out[k]=e;

}
// Save the whole board, debounced. Empty rounds are pruned first so stale groups don't linger.
function rbSave(){
  const rr=rbR(); Object.keys(rr).forEach(rid=>{ if(!rbAllRecurring().some(c=>(rbAssign(c.n).rounds||[]).indexOf(rid)!==-1)) delete rr[rid]; });
  if(rbSaveTimer) clearTimeout(rbSaveTimer);
  const msg=document.getElementById('rbSaveMsg'); if(msg){ msg.textContent='Saving\u2026'; msg.style.color='var(--muted)'; }
  rbSaveTimer = setTimeout(function(){
    apiCall({ action:'saveRounds', board: JSON.stringify({ assign:rbCompactAssign_(roundsBoard.assign), rounds:roundsBoard.rounds, assignOff:rbCompactAssign_(roundsBoard.assignOff||{}), roundsOff:roundsBoard.roundsOff||{}, placeholders:roundsBoard.placeholders }) },
      function(d){ const m=document.getElementById('rbSaveMsg'); if(!m) return; if(!d||d.error){ m.textContent='Could not save, hit Refresh and check'; m.style.color='var(--red)'; } else { m.textContent='Saved'; m.style.color='var(--muted)'; } },
      function(){ const m=document.getElementById('rbSaveMsg'); if(m){ m.textContent='Could not reach the app to save'; m.style.color='var(--red)'; } });
  }, 350);
}
function rbApply(){ rbSave(); rbRerender(); }
function rbRerender(){ const el=document.getElementById('content'); if(el && activeTab==='Regulars' && regSub==='Rounds') el.innerHTML = renderRegularsTab(); }
function rbRenderTray(){ const el=document.getElementById('rbTrayList'); if(el) el.innerHTML = rbTrayListHTML(); }

// Mutations. A drop sets both the day and the anchor week, and cadence fills the rest of the cycle.
function rbCustByName(name){ const k=normName(name); return allCustomers.find(c=>normName(c.n)===k) || rbPhArr().map(rbPhToCust).find(c=>normName(c.n)===k) || null; }
// Moving a WEEKLY customer who is already placed only moves the fortnight you dragged in:
// a drop on week 1 or 3 sets the odd-week day, a drop on week 2 or 4 sets the even-week day
// (stored as day2). The first drop from the tray still places all four weeks in one drag, and
// non-weekly customers keep the original behaviour (one day, anchored to the week you drop on).
function rbMoveCard(name, week, day){
  const a=rbAssign(name); const c=rbCustByName(name); a.rounds=[];

  else if(weekly && a.day!=null && week && (week%2===1)){ if(a.day2==null) a.day2=a.day; a.day=day; }

}
// Explicit whole-pattern move (the card's \u22ee menu): every week goes to this day.
function rbMoveCardAll(name, day){ const a=rbAssign(name); a.rounds=[]; a.day=day; delete a.day2; delete a.ord; rbApply(); }
function rbMoveToTray(name){ const a=rbAssign(name); a.rounds=[]; a.day=null; delete a.day2; delete a.ord; rbApply(); }
function rbMoveRound(rid, week, day){ const rd=rbRound(rid); if(rd){ rd.day=day; rd.anchor=(day==null?rd.anchor:(week||1)); delete rd.ord; rbApply(); } }
function rbJoinRound(name, rid){ const rd=rbRound(rid); if(!rd) return; const c=rbCustByName(name); const a=rbAssign(name); if(!Array.isArray(a.rounds)) a.rounds=[]; if(a.rounds.indexOf(rid)===-1) a.rounds.push(rid); a.day=rd.day; if(c && rbCadence(c)>1) a.anchor=rd.anchor||1; rbApply(); }

function rbTogglePin(name){ const a=rbAssign(name); a.pinned=!a.pinned; rbApply(); }
function rbTogglePinRound(rid){ const rd=rbRound(rid); if(rd){ rd.pinned=!rd.pinned; rbApply(); } }
function rbUngroup(rid){ const rd=rbRound(rid); if(!rd) return; rbAllRecurring().forEach(c=>{ const a=rbAssign(c.n); if(Array.isArray(a.rounds) && a.rounds.indexOf(rid)!==-1){ a.rounds=a.rounds.filter(r=>r!==rid); a.day=rd.day; } }); delete rbR()[rid]; rbApply(); }

function rbMenuMove(btn){ rbMoveCardAll(btn.getAttribute('data-name'), btn.getAttribute('data-day')); }
function rbMenuTray(btn){ rbMoveToTray(btn.getAttribute('data-name')); }
function rbToggleSel(name, wk){ const k=normName(name)+'#'+(wk==null?'t':wk); if(rbSel[k]) delete rbSel[k]; else rbSel[k]=true; rbRerender(); }
function rbClearSel(){ rbSel={}; rbRerender(); }
// The visits currently ticked, as {customer, week}. Week is null for a card ticked in the tray.

function rbSelectedVisits(){
  const out=[], custs=rbCustomers();
  Object.keys(rbSel).forEach(key=>{ if(!rbSel[key]) return; const i=key.lastIndexOf('#'); if(i<0) return; const nk=key.slice(0,i), wk=key.slice(i+1); const c=custs.find(x=>normName(x.n)===nk); if(c) out.push({c:c, week:(wk==='t'?null:parseInt(wk,10))}); });

}

function rbGroupSelected(){

// Routing: nearest-next ordering from the operator's base, keeping each round contiguous.
// Start and finish are the operator's start point from the Map, so the Google route is a true
// out-and-back from base and the mileage and time reflect the real day.
function rbStartPlace(op){ return mapPlaces.find(p=>p.kind==='start' && p.op===op) || null; }
function rbBase(op){
  const sp = rbStartPlace(op);
  let coord=null, label='';
  if(sp){ label=sp.q; const g=placeGeo[sp.q]; if(g) coord=g; }
  if(!label) label = op==='Adam' ? '3 Rushton Crescent, Bournemouth, UK' : '80 Florence Road, Parkstone, Poole, UK';
  if(!coord && op==='Mike') coord={lat:50.724095,lng:-1.9362076};   // 80 Florence Road, until the map start geocodes
  return { coord, label };
}
function rbCoord(c){ return geoCache[String(c.postcode||'').toUpperCase()] || null; }

  custs.forEach(c=>{ const rid=rbActiveRound(c, week); if(rid){ (byRound[rid]=byRound[rid]||[]).push(c); } else loose.push(c); });
  const units=[];
  Object.keys(byRound).forEach(rid=>{ const mem=byRound[rid]; const pts=mem.map(rbCoord).filter(Boolean); const cen = pts.length?{lat:pts.reduce((s,p)=>s+p.lat,0)/pts.length,lng:pts.reduce((s,p)=>s+p.lng,0)/pts.length}:null; units.push({members:mem,coord:cen}); });

}
function rbOrderStops(week, day, op){

    const stops=[];
    allUnits.forEach(u=>{
      if(u.kind==='round'){ rbRoundMembers(u.id).filter(c=>rbDueIn(c, week) && rbActiveRound(c, week)===u.id).forEach(c=>stops.push(c)); }
      else { const c=rbCustByName(u.id); if(c && rbIsLooseIn(c, week) && rbVisitDay(c, week)===day) stops.push(c); }
    });

  const ordered=[]; let cur=base;
  while(withC.length){ let bi=0,bd=1e9; for(let i=0;i<withC.length;i++){ const d=cur?rbHav(cur,withC[i].coord):0; if(d<bd){bd=d;bi=i;} } const u=withC.splice(bi,1)[0]; ordered.push(u); cur=u.coord; }
  const stops=[]; let prev=base;
  ordered.forEach(u=>{
    if(u.members.length===1){ stops.push(u.members[0]); prev=u.coord||prev; }
    else { const pts=u.members.map(m=>({m,g:rbCoord(m)})); const wG=pts.filter(p=>p.g), nG=pts.filter(p=>!p.g); let c2=prev; while(wG.length){ let bi=0,bd=1e9; for(let i=0;i<wG.length;i++){ const d=rbHav(c2,wG[i].g); if(d<bd){bd=d;bi=i;} } const p=wG.splice(bi,1)[0]; stops.push(p.m); c2=p.g; prev=p.g; } nG.forEach(p=>stops.push(p.m)); }

function rbLL(g){ return g.lat.toFixed(6)+','+g.lng.toFixed(6); }

function rbWaypoint(c){

function rbRouteUrl(week, day, op){

  const wp = rbOrderStops(week, day, op).map(rbWaypoint).filter(Boolean);
  if(!wp.length) return null;
  return 'https://www.google.com/maps/dir/'+[startTok].concat(wp).concat([startTok]).join('/');

// Ordering within a day. A unit is a loose card or a whole round. Until a day is hand-arranged
// units fall in value order; once you drag to reorder, every unit on that day gets an explicit
// position and the day stays in the order you set, across all four weeks.
function rbUnitOrd(u){ if(u.kind==='round'){ const rd=rbRound(u.id); return rd&&rd.ord!=null?rd.ord:null; } const a=rbA()[normName(u.id)]; return (a&&a.ord!=null)?a.ord:null; }

function rbDayAllUnits(day){
  const units=[], seenR={};

  rbCustomers().forEach(c=>{ if(rbDueWeeks(c).some(w=>rbActiveRound(c, w)===null && rbVisitDay(c, w)===day)) units.push({kind:'card', id:c.n}); });
  units.sort((x,y)=>{ const ox=rbUnitOrd(x), oy=rbUnitOrd(y), hx=(ox!=null), hy=(oy!=null); if(hx&&hy) return ox-oy; if(hx!==hy) return hx?-1:1; return rbUnitVal(y)-rbUnitVal(x); });

function rbCardOver(ev){ if(!rbDragData) return; ev.preventDefault(); ev.stopPropagation(); const el=ev.currentTarget; const r=el.getBoundingClientRect(); const top=(ev.clientY < r.top+r.height/2); el.classList.toggle('rb-ins-top', top); el.classList.toggle('rb-ins-bot', !top); }
function rbCardLeave(ev){ const el=ev.currentTarget; if(el&&el.classList) el.classList.remove('rb-ins-top','rb-ins-bot'); }
function rbCardDrop(ev){
  if(!rbDragData) return;
  ev.preventDefault(); ev.stopPropagation();
  const el=ev.currentTarget; el.classList.remove('rb-ins-top','rb-ins-bot');
  const col=el.closest('.rb-col'); if(!col){ rbDragData=null; return; }
  const day=col.getAttribute('data-day'), week=parseInt(col.getAttribute('data-week'),10)||1;
  const r=el.getBoundingClientRect(), before=(ev.clientY < r.top+r.height/2);
  const d=rbDragData; rbDragData=null;
  rbReorderOnto(day, week, d, el.getAttribute('data-name'), before);

function rbReorderOnto(day, week, d, targetName, before){
  if(d.kind==='card'){ const a=rbAssign(d.name); const c=rbCustByName(d.name); const weekly=c&&rbCadence(c)===1;
    if(!a.rounds||!a.rounds.length){
      if(weekly && a.day!=null && (week%2===0)){ if(a.day2!==day) a.day2=day; }
      else if(weekly && a.day!=null && (week%2===1)){ if(a.day!==day){ if(a.day2==null) a.day2=a.day; a.day=day; } }
      else if(a.day!==day){ a.day=day; a.anchor=week; if(weekly) delete a.day2; }
    }
  }
  else if(d.kind==='round'){ const rd=rbRound(d.rid); if(rd && rd.day!==day){ rd.day=day; rd.anchor=week; } }
  const isDragged = u => (d.kind==='card') ? (u.kind==='card' && normName(u.id)===normName(d.name)) : (u.kind==='round' && u.id===d.rid);
  let units = rbDayAllUnits(day);
  const dragged = units.find(isDragged);
  units = units.filter(u=>!isDragged(u));
  let ti = units.findIndex(u=> u.kind==='card' && normName(u.id)===normName(targetName));
  if(ti<0) ti = units.length; else if(!before) ti = ti+1;
  if(dragged) units.splice(ti,0,dragged);
  units.forEach((u,i)=>{ if(u.kind==='round'){ const rd=rbRound(u.id); if(rd) rd.ord=i; } else rbAssign(u.id).ord=i; });
  rbApply();
}

function rbCadLabel(cd){ return cd===1?'Weekly':cd===2?'Fortnightly':cd===4?'Every 4 weeks':cd+'-weekly'; }
// Break a postcode into area letters + outward number + sub, so we can cluster by district in the
// natural way (BH9 before BH13, not a raw string sort). No postcode sorts to the end.
function rbPcParts(pc){
  const s=String(pc||'').toUpperCase().replace(/\s+/g,' ').trim();
  const m=s.match(/^([A-Z]{1,2})(\d{1,2})([A-Z]?)/);
  if(m) return { area:m[1], num:parseInt(m[2],10), sub:m[3]||'', raw:s };

// Order the unplaced list: weekly first, then fortnightly, then four-weekly, and within each band by

function rbTrayCmp(a,b){

  if(pa.area!==pb.area) return pa.area<pb.area?-1:1;
  if(pa.num!==pb.num) return pa.num-pb.num;
  if(pa.sub!==pb.sub) return pa.sub<pb.sub?-1:1;
  if(pa.raw!==pb.raw) return pa.raw<pb.raw?-1:1;
  return a.n.localeCompare(b.n);
}
function rbTrayListHTML(){

  tray = tray.filter(c=>!q || c.n.toLowerCase().indexOf(q)!==-1).sort(rbTrayCmp);
  let items = trayRounds.map(rd=>'<div class="rb-round" style="border-left-color:'+rd.color+'"><div class="rb-round-h" draggable="true" data-rid="'+escAttr(rd.id)+'" ondragstart="rbDragRoundStart(event)" ondragend="rbDragEnd(event)"><span class="rb-chip" style="background:'+rd.color+'"></span><span class="rb-round-name">'+escAttr(rd.name)+'</span>'+rbRoundMenu(rd.id)+'</div><div class="rb-round-body" data-rid="'+escAttr(rd.id)+'" ondragover="rbDragOver(event)" ondrop="rbDropRound(event)">'+rbRoundMembers(rd.id).map(c=>rbCardHTML(c,true,rd.id)).join('')+'</div></div>');

function rbSidebarRoundsHTML(){

// Local cache is keyed per logged-in user so two people on one browser never collide.

function todoCacheKey(){ return 'mtg_todo_' + ((typeof auth!=='undefined' && auth && auth.user) ? String(auth.user).toLowerCase() : 'anon'); }

// A saved server document wins (cross-device truth); if none exists yet, seed it from what we have.

// edits made this session that are still syncing; a full page reload re-pulls across devices.
let todoBootedFor = null;
function todoBoot(data){
  const u = (typeof auth!=='undefined' && auth && auth.user) ? String(auth.user).toLowerCase() : 'anon';
  if(todoBootedFor === u) return;
  todoBootedFor = u;
  const had=todoLoadCache();
  const srv = data && data.todos;
  if(srv && typeof srv==='object' && Array.isArray(srv.tasks)){
    todoState.tasks = srv.tasks;

function todoWeekKey(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-day+3);
  const firstThu=new Date(Date.UTC(t.getUTCFullYear(),0,4));
  const wk=1+Math.round(((t-firstThu)/86400000 - 3 + ((firstThu.getUTCDay()+6)%7))/7);
  return t.getUTCFullYear()+'-W'+wk;
}
function todoPeriodKey(recur, ts){
  const d=new Date(ts);
  if(recur==='daily') return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  if(recur==='weekly') return todoWeekKey(d);
  if(recur==='fourweekly'){ const epoch=Date.UTC(2026,0,5); const day=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()); return 'C'+Math.floor((day-epoch)/(28*86400000)); }

}

// Full-year hours from a working pattern: per season, worked weeks x days x (span minus
// break), and billable hours after the efficiency rate (travel, quotes, admin). This is
// what the planner's capacity target inherits, so the plan and the planner agree.
function bpOpsCalcFor(state){
  function seasonCalc(p, weeks){
    const t=x=>{ const m=String(x||'').match(/^(\d{1,2}):(\d{2})$/); return m? (+m[1]+(+m[2])/60) : null; };
    const st=t(p.start), fi=t(p.finish);
    if(st==null||fi==null||fi<=st) return { weeks:0, days:0, hours:0, billable:0 };
    const perDay=Math.max(0, (fi-st) - (bpNum(p.breakMins)||0)/60);
    const workedWeeks=Math.max(0, weeks - bpNum(p.holiday));
    const days=workedWeeks*bpNum(p.days);
    const hours=days*perDay;
    const eff=(p.eff===''||p.eff==null)?75:Math.max(10,Math.min(100,bpNum(p.eff)));
    return { weeks:workedWeeks, days:Math.round(days), hours:Math.round(hours), billable:Math.round(hours*eff/100) };
  }
  const pk=seasonCalc(state.ops.peak, 40), of=seasonCalc(state.ops.off, 12);
  return { peak:pk, off:of, hours:pk.hours+of.hours, billable:pk.billable+of.billable };
}

function perfEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function perfCacheKey(){ return 'mtg_perf_reviews'; }
function perfWriteCache(){ try{ localStorage.setItem(perfCacheKey(), JSON.stringify(perfReviews)); }catch(e){} }
function perfLoadCache(){ try{ const r=localStorage.getItem(perfCacheKey()); if(r){ const a=JSON.parse(r); if(Array.isArray(a)) return a; } }catch(e){} return null; }
function perfSaveServerNow(){ try{ if(typeof auth!=='undefined'&&auth) apiCall({ action:'saveDoc', doc:'performance', data: JSON.stringify(perfReviews) }); }catch(e){} }
function perfSave(){ perfWriteCache(); clearTimeout(perfSaveTimer); perfSaveTimer=setTimeout(perfSaveServerNow,800); }
function perfMergeSeed(list){ const out=Array.isArray(list)?list.slice():[]; PERF_SEED.forEach(seed=>{ if(!out.some(r=>r.id===seed.id)) out.push(JSON.parse(JSON.stringify(seed))); }); return out; }
function perfBoot(data){

function perfCurrentQuarter(){ return 'Q'+(Math.floor(new Date().getMonth()/3)+1); }

function perfFind(f,q,y){ return perfReviews.find(r=>r.franchisee===f&&r.quarter===q&&String(r.year)===String(y))||null; }
function perfReviewId(f,q,y){ return (f+'-'+y+'-'+q).toLowerCase(); }
function perfEnsureReview(){ const m=perfCurrentMeta(); let r=perfFind(m.franchisee,m.quarter,m.year); if(!r){ r={ id:perfReviewId(m.franchisee,m.quarter,m.year), franchisee:m.franchisee, territory:(m.franchisee==='Adam'?'Bournemouth':'Parkstone'), quarter:m.quarter, year:m.year, date:new Date().toISOString().slice(0,10), status:'draft', answers:{} }; perfReviews.push(r); } return r; }

function perfQuarterIndex(q){ return {Q1:0,Q2:1,Q3:2,Q4:3}[q]||0; }

  const list=perfReviews.filter(r=>r.franchisee===fr).sort((a,b)=>(b.year-a.year)||(perfQuarterIndex(b.quarter)-perfQuarterIndex(a.quarter)));
  const lc=list.find(r=>r.status==='complete');
  let q,y;
  if(lc){ const qi=perfQuarterIndex(lc.quarter)+1; q='Q'+((qi%4)+1); y=lc.year+Math.floor(qi/4); }
  else { q=perfCurrentQuarter(); y=new Date().getFullYear(); }
  const curY=new Date().getFullYear(), curQi=perfQuarterIndex(perfCurrentQuarter());
  if(y<curY || (y===curY && perfQuarterIndex(q)<curQi)){ q=perfCurrentQuarter(); y=curY; }
  return { quarter:q, year:y };
}
