<style>
:root{
  --ink:#16241C; --green:#1B5E20; --green6:#2E7D32; --green4:#4CAF50;
  --paper:#F1F4EE; --card:#FFFFFF; --line:#E5EAE3; --muted:#7C8A7E;
  --accent:#D98A2B; --blue:#1565C0; --blue4:#2196F3; --red:#C62828; --amber:#E65100;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
.serif{font-family:'Fraunces',Georgia,serif}
.header{background:var(--ink);padding:30px 36px 24px;color:#fff;position:relative;overflow:hidden}
.header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--green4),var(--green),var(--accent))}
.header h1{font-family:'Fraunces',serif;font-size:30px;font-weight:600;letter-spacing:-0.5px}
.header p{font-size:13px;opacity:0.6;margin-top:3px;letter-spacing:.3px}
.header .refresh{position:absolute;top:30px;right:36px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.25);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500;font-family:inherit;transition:all .15s}
.header .refresh:hover{background:rgba(255,255,255,0.2)}
.tabs{display:flex;gap:0;background:var(--card);border-bottom:1px solid var(--line);padding:0 28px;overflow-x:auto}
.tab{padding:15px 20px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab.active{font-weight:700;color:var(--green);border-bottom-color:var(--green)}
.tab:hover{color:var(--green)}
.content{padding:26px 36px 60px;max-width:1240px}
.loading{text-align:center;padding:70px;color:var(--muted);font-size:15px}
.grid{display:grid;gap:16px;margin-bottom:28px}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

@media(max-width:820px){.grid-2{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:14px;padding:22px 24px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,40,30,.04)}
.h{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:18px;letter-spacing:-.2px}
.kpi-l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.7px}

.kpi-s{font-size:12px;color:var(--muted);margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:middle}
.chip-up{background:#E8F5E9;color:var(--green6)}.chip-down{background:#FFEBEE;color:var(--red)}.chip-flat{background:#EEF1ED;color:var(--muted)}
.accent-top{border-top:3px solid var(--green)}
.attn{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:28px}
.attn-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:16px 18px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:14px}
.attn-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,40,30,.08)}
.attn-card.ok{border-left-color:var(--green4);opacity:.8}
.attn-n{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1;min-width:44px}
.attn-t{font-size:12.5px;font-weight:600;color:var(--ink)}
.attn-d{font-size:11px;color:var(--muted);margin-top:2px}
.badge{padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block}
.b-active{background:#E8F5E9;color:#2E7D32}.b-churned{background:#FFEBEE;color:#C62828}
.b-mike{background:#E8F5E9;color:#1B5E20}.b-adam{background:#E3F2FD;color:#1565C0}
.b-oneoff{background:#FFF9C4;color:#F57F17}.b-repeat{background:#BBDEFB;color:#1565C0}
.b-recurring{background:#C8E6C9;color:#2E7D32}
.b-new{background:#FFF3E0;color:#E65100}.b-contacted{background:#E3F2FD;color:#1565C0}
.b-quoted{background:#F3E5F5;color:#6A1B9A}.b-booked{background:#E8F5E9;color:#2E7D32}
.b-lost{background:#FFEBEE;color:#C62828}.b-spam{background:#ECEFF1;color:#607D8B}.b-na{background:#EEF1ED;color:#7C8A7E}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
th.r,td.r{text-align:right}th.c,td.c{text-align:center}
td{padding:11px 12px;border-bottom:1px solid #F4F6F2}
tr:hover td{background:#FAFBF9}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar-l{font-size:11px;color:var(--muted);width:62px;text-align:right;font-weight:500}
.bar-c{flex:1;display:flex;align-items:center;gap:8px}
.bar{background:linear-gradient(90deg,var(--green6),var(--green4));border-radius:4px;height:22px;min-width:2px}
.bar-v{font-size:12px;color:var(--ink);font-weight:700;white-space:nowrap}
.bar-s{font-size:10px;color:var(--muted)}
.pb{background:#EEF1ED;border-radius:5px;height:9px;margin-top:7px;overflow:hidden}
.pf{border-radius:5px;height:9px}
.ib{margin-top:18px;padding:16px 18px;border-radius:10px;font-size:13px;color:#4a554c;line-height:1.55}
.ig{background:#F1F4EE}.ia{background:#FFF8E1}.io{background:#FFF3E0}
.svc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F4F6F2;font-size:13px}
.svc-n{color:#3c463d;flex:1}.svc-s{width:84px;text-align:right}.svc-g{font-weight:700;color:var(--green)}
.sb{margin-bottom:14px}.sb-h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.sb-n{font-weight:500}.sb-s{color:var(--muted);font-size:12px}
.sb-t{background:#EEF1ED;border-radius:5px;height:11px;overflow:hidden}.sb-f{border-radius:5px;height:11px}
.search{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;margin-bottom:16px;outline:none}
.search:focus{border-color:var(--green)}
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s}
.filter-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
.filter-btn:hover{border-color:var(--green)}
.table-wrap{max-height:620px;overflow-y:auto;border-radius:10px;border:1px solid var(--line)}
.df-bar{background:var(--card);border-bottom:1px solid var(--line);padding:14px 36px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.df-label{font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.6px;margin-right:4px}
.df-btn{padding:6px 14px;border:1px solid #CFE0CB;background:var(--card);color:var(--green);border-radius:20px;font-size:12px;font-family:inherit;cursor:pointer;transition:all .15s}
.df-btn:hover{background:#E8F5E9}
.df-btn.active{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
.df-btn.vw{border-color:#CBD5D0;color:var(--ink)}
.df-btn.vw:hover{background:#EEF1ED}
.df-btn.vw.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.vw-group{display:inline-flex;align-items:center;gap:8px;margin-left:10px;padding-left:14px;border-left:1px solid var(--line)}
.df-custom{display:none;align-items:center;gap:6px;margin-left:4px}
.df-custom.show{display:flex}
.df-date{padding:5px 8px;border:1px solid #CFE0CB;border-radius:5px;font-size:12px;font-family:inherit}
.df-summary{margin-left:auto;font-size:11px;color:var(--muted)}
.df-summary b{color:var(--green)}
.svg-wrap{width:100%}
</style>

<body>

<div class="header">
  <h1>My Tidy Garden</h1>
  <p>Command Centre — live business data</p>
  <button class="refresh" onclick="loadData()">Refresh</button>
</div>

<div class="df-bar" id="dfBar">
  <span class="df-label">Period</span>
  <button class="df-btn" data-range="this-month">This month</button>
  <button class="df-btn" data-range="last-month">Last month</button>
  <button class="df-btn" data-range="ytd">YTD</button>
  <button class="df-btn" data-range="tax-year">Tax year</button>
  <button class="df-btn" data-range="last-tax-year">Last tax year</button>
  <button class="df-btn" data-range="last-12mo">Last 12 mo</button>
  <button class="df-btn active" data-range="all">All time</button>
  <button class="df-btn" data-range="custom">Custom</button>
  <div class="df-custom" id="dfCustom">
    <input type="date" id="dfFrom" class="df-date">
    <span style="font-size:11px;color:var(--muted)">to</span>
    <input type="date" id="dfTo" class="df-date">
    <button class="df-btn" id="dfApply" style="background:var(--green);color:#fff;border-color:var(--green)">Apply</button>
  </div>
  <span class="vw-group">
    <span class="df-label" style="margin-right:0">View</span>
    <button class="df-btn vw active" data-view="All">Overall</button>
    <button class="df-btn vw" data-view="Mike">Mike</button>
    <button class="df-btn vw" data-view="Adam">Adam</button>
  </span>
  <div class="df-summary" id="dfSummary"></div>
</div>

<div class="tabs" id="tabs"></div>
<div class="content" id="content"><div class="loading">Loading data from MTG app...</div></div>

<script>
const SHEET_ID = '11UHcc9bXXhE92bvXOTp8fmhpjELQbI9ETBaiFxhTqZw';
const JOBS_GID = '1576165006';
const CUSTOMERS_GID = '1593119775';
function gvizUrl(gid) { return 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&gid='+gid; }
function gvizUrlByName(name) { return 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(name); }

let rawJobs=[], customers=[], rawLeads=[], rawRecurring=[];
let jobsPeriod=[], jobs=[], prevJobs=[], allCustomers=[], churnedList=[], monthlyData=[], serviceData=[], missingPriceData=[];
let leadStats=null, recurringStats=null, attention=null, prevTotals=null;
let activeTab="Overview", custSegFilter="All", custSearch="";
let dfRange="all", dfFrom=null, dfTo=null, franchiseeView="All";

// ---------- CSV ----------
function parseCSVLine(line) {
  const result = []; let current = ''; let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { result.push(current); current = ''; }
    else { current += ch; }
  }
  result.push(current);
  return result;
}
function parseCSV(text) {
  const lines = text.split('\n');
  if (lines.length < 2) return [];
  const headers = parseCSVLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = parseCSVLine(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => obj[h.trim()] = (vals[idx] || '').trim());
    rows.push(obj);
  }
  return rows;
}
// Tolerant reader: scans the first rows for the line containing a known header keyword,
// so a title/banner row above the real headers no longer breaks parsing.
function parseCSVSmart(text, keywords) {
  const lines = text.split('\n');
  let hi = -1;
  for (let i = 0; i < Math.min(lines.length, 12); i++) {
    if (!lines[i].trim()) continue;
    const low = lines[i].toLowerCase();
    if (keywords.some(k => low.includes(k))) { hi = i; break; }
  }
  if (hi === -1) hi = 0;
  const headers = parseCSVLine(lines[hi]).map(h => h.trim());
  const rows = [];
  for (let i = hi + 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = parseCSVLine(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => obj[h] = (vals[idx] || '').trim());
    if (Object.values(obj).every(v => !v)) continue;
    rows.push(obj);
  }
  return rows;
}
function parseAmount(s) { if (!s) return 0; return parseFloat(String(s).replace(/[£,]/g, '')) || 0; }
function parseDate(s) {
  if (!s) return null;
  s = String(s).split(' ')[0];
  const parts = s.split('/');
  if (parts.length === 3) return new Date(parts[2], parts[1]-1, parts[0]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function daysBetween(d1, d2) { return Math.floor((d2 - d1) / (1000*60*60*24)); }
function col(row, candidates) {
  const keys = Object.keys(row);
  for (const cand of candidates) {
    const c = cand.toLowerCase();
    for (const k of keys) if (k.trim().toLowerCase() === c) return row[k];
  }
  for (const cand of candidates) {
    const c = cand.toLowerCase();
    for (const k of keys) if (k.trim().toLowerCase().includes(c)) return row[k];
  }
  return '';
}
function matchView(f) { return franchiseeView === 'All' || f === franchiseeView; }

// ---------- fetch ----------
async function loadData() {
  document.getElementById('content').innerHTML = '<div class="loading">Loading data from MTG app...</div>';
  try {
    const [jobsRes, custRes] = await Promise.all([ fetch(gvizUrl(JOBS_GID)), fetch(gvizUrl(CUSTOMERS_GID)) ]);
    rawJobs = parseCSV(await jobsRes.text());
    customers = parseCSV(await custRes.text());

    rawJobs.forEach(j => {
      j._amount = parseAmount(j['Amount (£)']);
      j._date = parseDate(j['Date Completed']);
      let svc = j['Service Type'] || 'Unknown';
      if (svc === 'Regular Garden Maintenance Visits' || svc === 'Regular Strim, Mow, & Blow' || svc === 'Strim, Mow, & Blow') svc = 'Regular Garden Maintenance';
      j._service = svc;
      j._franchisee = j['Franchisee'] || '';
    });

    try {
      const [leadsRes, recRes] = await Promise.all([ fetch(gvizUrlByName('Leads')), fetch(gvizUrlByName('Recurring Bookings')) ]);
      const lt = await leadsRes.text(), rt = await recRes.text();
      rawLeads = lt.trim().startsWith('<') ? [] : parseCSVSmart(lt, ['customer','status','source','received','quoted','service','territory']);
      rawRecurring = rt.trim().startsWith('<') ? [] : parseCSVSmart(rt, ['customer','status','frequency','service','created','value','booking']);
    } catch(e2) { rawLeads = []; rawRecurring = []; console.warn('Leads/Recurring load failed', e2); }

    rawLeads.forEach(l => {
      l._date = parseDate(col(l,['Date Received','Received','Date']));
      l._quote = parseAmount(col(l,['Quoted Price','Quote','Price','Value']));
      l._status = (col(l,['Status']) || '').trim().toUpperCase();
      l._franchisee = (col(l,['Franchisee','Owner']) || '').trim();
      l._source = (col(l,['Source']) || '').trim() || 'Unknown';
      l._name = col(l,['Customer Name','Customer','Name']);
      l._svc = col(l,['Service Requested','Service']);
      l._territory = col(l,['Territory']);
    });
    rawRecurring.forEach(r => {
      r._created = parseDate(col(r,['Date Created','Created','Date']));
      r._canceled = parseDate(col(r,['Date Canceled','Date Cancelled','Cancelled','Canceled']));
      r._value = parseAmount(col(r,['Value','Price','Amount']));
      r._status = (col(r,['Status']) || '').trim().toUpperCase();
      r._franchisee = (col(r,['Franchisee','Owner']) || '').trim();
      r._cust = col(r,['Customer Name','Customer','Name']);
      r._svc = col(r,['Service']);
      r._freq = col(r,['Frequency','Recurring Frequency']);
    });

    applyFilters();
    renderTabs();
    renderContent();
    dfRender();
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="loading">Error loading data. Check that sheets are published to web.</div>';
    console.error(e);
  }
}

// ---------- date logic ----------
function ukTaxYearBounds(ref) {
  const d = ref || new Date(); const y = d.getFullYear();
  const startThis = new Date(y, 3, 6);
  if (d < startThis) return { from: new Date(y-1, 3, 6), to: new Date(y, 3, 5, 23, 59, 59) };
  return { from: startThis, to: new Date(y+1, 3, 5, 23, 59, 59) };
}
function prevUkTaxYear() {
  const cur = ukTaxYearBounds();
  return { from: new Date(cur.from.getFullYear()-1, 3, 6), to: new Date(cur.from.getFullYear(), 3, 5, 23, 59, 59) };
}
function dfBounds() {
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth();
  switch (dfRange) {
    case 'this-month':    return { from: new Date(y, m, 1),     to: new Date(y, m+1, 0, 23, 59, 59) };
    case 'last-month':    return { from: new Date(y, m-1, 1),   to: new Date(y, m, 0, 23, 59, 59) };
    case 'ytd':           return { from: new Date(y, 0, 1),     to: now };
    case 'tax-year':      return ukTaxYearBounds();
    case 'last-tax-year': return prevUkTaxYear();
    case 'last-12mo':     return { from: new Date(y-1, m, now.getDate()), to: now };
    case 'all':           return { from: null, to: null };
    case 'custom':        return { from: dfFrom, to: dfTo };
  }
  return { from: null, to: null };
}
function prevBounds(b) {
  if (!b.from || !b.to) return { from: null, to: null };
  const len = b.to - b.from;
  return { from: new Date(b.from.getTime() - len - 1), to: new Date(b.from.getTime() - 1) };
}

// ---------- aggregation ----------
function applyFilters() {
  const b = dfBounds();
  const inB = (d) => !b.from || !b.to ? true : (d && d >= b.from && d <= b.to);
  jobsPeriod = rawJobs.filter(j => inB(j._date));
  jobs = franchiseeView === 'All' ? jobsPeriod : jobsPeriod.filter(j => j._franchisee === franchiseeView);
  const pb = prevBounds(b);
  let pj = (pb.from && pb.to) ? rawJobs.filter(j => j._date && j._date >= pb.from && j._date <= pb.to) : [];
  prevJobs = franchiseeView === 'All' ? pj : pj.filter(j => j._franchisee === franchiseeView);
  processData();
  processPrev();
  processLeads(b);
  processRecurring(b);
  processAttention();
}

function processData() {
  const now = new Date();
  const cutoff90 = new Date(now); cutoff90.setDate(cutoff90.getDate() - 90);
  const custMap = {};
  jobs.forEach(j => {
    const name = j['Customer Name']; if (!name) return;
    if (!custMap[name]) custMap[name] = { name, jobs: [], totalRev: 0, franchisee: j._franchisee, hasRecurring: false, freq: '', services: new Set() };
    custMap[name].jobs.push(j);
    custMap[name].totalRev += j._amount;
    if (j['Recurring Frequency'] && j['Recurring Frequency'].trim()) { custMap[name].hasRecurring = true; custMap[name].freq = j['Recurring Frequency'].trim(); }
    custMap[name].services.add(j._service);
    custMap[name].franchisee = j._franchisee || custMap[name].franchisee;
  });
  allCustomers = Object.values(custMap).map(c => {
    const dates = c.jobs.map(j => j._date).filter(Boolean).sort((a,b) => a-b);
    const firstJob = dates[0], lastJob = dates[dates.length - 1];
    const priced = c.jobs.filter(j => j._amount > 0);
    const avg = priced.length ? priced.reduce((s,j) => s + j._amount, 0) / priced.length : 0;
    let segment;
    if (c.jobs.length === 1) segment = 'One-Off';
    else if (c.hasRecurring && lastJob < cutoff90) segment = 'Churned';
    else if (c.hasRecurring) segment = 'Recurring';
    else if (c.jobs.length >= 5 && lastJob < cutoff90) segment = 'Churned';
    else if (c.jobs.length >= 2) segment = 'Repeat';
    else segment = 'Other';
    return { n: c.name, j: c.jobs.length, r: Math.round(c.totalRev*100)/100, a: Math.round(avg*100)/100,
      f: c.franchisee, s: segment, freq: c.freq, first: firstJob, last: lastJob,
      daysSince: lastJob ? daysBetween(lastJob, now) : 999, svc: Array.from(c.services).slice(0,3).join(', ') };
  }).sort((a,b) => b.r - a.r);
  churnedList = allCustomers.filter(c => c.s === 'Churned').sort((a,b) => b.r - a.r);

  const monthMap = {};
  jobs.forEach(j => {
    if (!j._date) return;
    const key = j._date.getFullYear() + '-' + String(j._date.getMonth()+1).padStart(2,'0');
    if (!monthMap[key]) monthMap[key] = { m: key, j: 0, r: 0, custs: new Set() };
    monthMap[key].j++; monthMap[key].r += j._amount;
    if (j['Customer Name']) monthMap[key].custs.add(j['Customer Name']);
  });
  monthlyData = Object.values(monthMap).sort((a,b) => a.m.localeCompare(b.m)).map(m => ({ m: m.m, j: m.j, r: Math.round(m.r), c: m.custs.size }));

  const svcMap = {};
  jobs.forEach(j => {
    const s = j._service;
    if (!svcMap[s]) svcMap[s] = { n: s, j: 0, r: 0, priced: 0, pricedSum: 0 };
    svcMap[s].j++; svcMap[s].r += j._amount;
    if (j._amount > 0) { svcMap[s].priced++; svcMap[s].pricedSum += j._amount; }
  });
  serviceData = Object.values(svcMap).sort((a,b) => b.j - a.j).map(s => ({ n: s.n, j: s.j, r: Math.round(s.r), a: s.priced ? Math.round(s.pricedSum/s.priced) : 0 }));

  const zeroMap = {};
  jobs.forEach(j => {
    if (j._amount > 0) return;
    const name = j['Customer Name']; if (!name) return;
    if (!zeroMap[name]) zeroMap[name] = { n: name, z: 0, svc: j._service };
    zeroMap[name].z++;
  });
  missingPriceData = Object.values(zeroMap).sort((a,b) => b.z - a.z);
  missingPriceData.forEach(mp => { const c = allCustomers.find(c => c.n === mp.n); mp.a = c ? c.a : 0; mp.est = mp.a > 0 ? mp.z * mp.a : 0; });
}

function processPrev() {
  const rev = prevJobs.reduce((s,j) => s + j._amount, 0);
  const custs = new Set(prevJobs.map(j => j['Customer Name']).filter(Boolean)).size;
  prevTotals = { rev: Math.round(rev), jobs: prevJobs.length, custs, has: prevJobs.length > 0 };
}

function processLeads(b) {
  let ls = rawLeads.filter(l => matchView(l._franchisee));
  if (b.from && b.to) ls = ls.filter(l => l._date && l._date >= b.from && l._date <= b.to);
  const byStatus = {NEW:0,CONTACTED:0,QUOTED:0,BOOKED:0,LOST:0,SPAM:0};
  const bySource = {}, byFr = {Mike:0,Adam:0,Other:0};
  ls.forEach(l => {
    if (byStatus[l._status] === undefined) byStatus[l._status] = 0;
    byStatus[l._status]++;
    bySource[l._source] = (bySource[l._source]||0)+1;
    if (l._franchisee === 'Mike') byFr.Mike++; else if (l._franchisee === 'Adam') byFr.Adam++; else byFr.Other++;
  });
  const total = ls.length, spam = byStatus.SPAM||0, qualified = total - spam, booked = byStatus.BOOKED||0;
  leadStats = { total, byStatus, bySource, byFr,
    conversion: qualified > 0 ? Math.round(booked/qualified*100) : 0,
    staleNew: byStatus.NEW||0,
    list: ls.slice().sort((a,b2) => (b2._date?b2._date:0) - (a._date?a._date:0)),
    headers: rawLeads.length ? Object.keys(rawLeads[0]).filter(k => !k.startsWith('_')) : [] };
}

function processRecurring(b) {
  const base = rawRecurring.filter(r => matchView(r._franchisee));
  let created = base, cancelled = base.filter(r => r._canceled);
  if (b.from && b.to) {
    created = base.filter(r => r._created && r._created >= b.from && r._created <= b.to);
    cancelled = base.filter(r => r._canceled && r._canceled >= b.from && r._canceled <= b.to);
  }
  recurringStats = {
    newInPeriod: created.length, cancelledInPeriod: cancelled.length,
    netInPeriod: created.length - cancelled.length,
    list: base.slice().sort((a,b2) => (b2._created?b2._created:0) - (a._created?a._created:0)),
    mapped: base.some(x => x._cust || x._status),
    headers: rawRecurring.length ? Object.keys(rawRecurring[0]).filter(k => !k.startsWith('_')) : []
  };
}

function processAttention() {
  const now = new Date();
  const c90 = new Date(now); c90.setDate(c90.getDate()-90);
  const c30 = new Date(now); c30.setDate(c30.getDate()-30);
  const staleLeads = rawLeads.filter(l => l._status === 'NEW' && matchView(l._franchisee)).length;
  const missingPrices = rawJobs.filter(j => j._amount <= 0 && j['Customer Name'] && !/assessment|free/i.test(j._service||'') && matchView(j._franchisee)).length;
  const cm = {};
  rawJobs.filter(j => matchView(j._franchisee)).forEach(j => {
    const n = j['Customer Name']; if (!n) return;
    if (!cm[n]) cm[n] = { jobs:0, rec:false, last:null };
    cm[n].jobs++;
    if (j['Recurring Frequency'] && j['Recurring Frequency'].trim()) cm[n].rec = true;
    if (j._date && (!cm[n].last || j._date > cm[n].last)) cm[n].last = j._date;
  });
  let churnRisk = 0;
  Object.values(cm).forEach(c => { if (c.last && c.last < c90 && (c.rec || c.jobs >= 5)) churnRisk++; });
  const recentCancel = rawRecurring.filter(r => r._canceled && r._canceled >= c30 && matchView(r._franchisee)).length;
  attention = { staleLeads, missingPrices, churnRisk, recentCancel };
}

// ---------- helpers ----------
function badge(t) {
  const m = {ACTIVE:'active',Churned:'churned',Mike:'mike',Adam:'adam','One-Off':'oneoff',Repeat:'repeat',Recurring:'recurring',
    NEW:'new',CONTACTED:'contacted',QUOTED:'quoted',BOOKED:'booked',LOST:'lost',SPAM:'spam'};
  return '<span class="badge b-'+(m[t]||'na')+'">'+t+'</span>';
}
function statusBadge(s) {
  s = (s||'').trim().toUpperCase();
  if (s === 'ACTIVE') return '<span class="badge b-active">ACTIVE</span>';
  if (s === 'CANCELED' || s === 'CANCELLED') return '<span class="badge b-churned">CANCELLED</span>';
  if (!s) return '—';
  return '<span class="badge b-na">'+s+'</span>';
}
function fmt(n) { return '\u00a3'+Math.round(n).toLocaleString(); }
function fmtDate(d) { if (!d) return ''; return d.getDate()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }
function fmtDateLong(d) { if (!d) return '—'; return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function shortMonth(ym) { const [y,m] = ym.split('-'); const mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return mn[parseInt(m)-1]+' '+y.slice(2); }
function deltaChip(cur, prev) {
  if (!prevTotals || !prevTotals.has || prev === 0) return '';
  const d = Math.round((cur - prev) / prev * 100);
  if (d === 0) return '<span class="chip chip-flat">0%</span>';
  return '<span class="chip '+(d>0?'chip-up':'chip-down')+'">'+(d>0?'\u25b2':'\u25bc')+' '+Math.abs(d)+'%</span>';
}

// ---------- SVG charts ----------
function areaChartSVG(data, color) {
  if (!data.length) return '<div style="color:var(--muted);text-align:center;padding:36px">No data in this period.</div>';
  const W=720,H=220,padL=46,padR=14,padT=14,padB=28;
  const max = Math.max(...data.map(d=>d.r), 1), n = data.length;
  const xs = i => padL + (n===1 ? (W-padL-padR)/2 : i*(W-padL-padR)/(n-1));
  const ys = v => padT + (1 - v/max)*(H-padT-padB);
  const pts = data.map((d,i)=>[xs(i),ys(d.r)]);
  const baseY = H-padB;
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = 'M'+pts[0][0].toFixed(1)+','+baseY+' '+pts.map(p=>'L'+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+' L'+pts[n-1][0].toFixed(1)+','+baseY+' Z';
  let grid='';
  [0,0.5,1].forEach(f=>{ const gy=ys(max*f); grid+='<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="#E5EAE3"/>'; grid+='<text x="'+(padL-8)+'" y="'+(gy+4).toFixed(1)+'" font-size="10" text-anchor="end" fill="#9aa89c">'+fmt(max*f)+'</text>'; });
  let xl=''; const idxs = n<=8 ? data.map((_,i)=>i) : [0,Math.floor(n/3),Math.floor(2*n/3),n-1];
  idxs.forEach(i=>{ xl+='<text x="'+xs(i).toFixed(1)+'" y="'+(H-8)+'" font-size="10" text-anchor="middle" fill="#9aa89c">'+shortMonth(data[i].m)+'</text>'; });
  return '<div class="svg-wrap"><svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">'
    + grid
    + '<path d="'+area+'" fill="'+color+'22"/>'
    + '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
    + pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="#fff" stroke="'+color+'" stroke-width="2"/>').join('')
    + xl + '</svg></div>';
}
function funnelSVG(stages, total) {
  const W=720, rowH=56, H=rowH*stages.length;
  const max = Math.max(...stages.map(s=>s.count), 1);
  let out='<div class="svg-wrap"><svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;font-family:DM Sans,sans-serif">';
  stages.forEach((s,i)=>{
    const w = Math.max(46, s.count/max*(W-230));
    const x = (W-230-w)/2 + 10, y = i*rowH+8;
    const pct = total>0 ? Math.round(s.count/total*100) : 0;
    out += '<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+w.toFixed(1)+'" height="40" rx="8" fill="'+s.color+'"/>';
    if (w>70) out += '<text x="'+(x+w/2).toFixed(1)+'" y="'+(y+25)+'" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">'+pct+'%</text>';
    out += '<text x="'+(W-200)+'" y="'+(y+19)+'" font-size="13" font-weight="600" fill="#16241C">'+s.label+'</text>';
    out += '<text x="'+(W-200)+'" y="'+(y+35)+'" font-size="11" fill="#7C8A7E">'+pct+'% of all leads</text>';
    out += '<text x="'+(W-14)+'" y="'+(y+28)+'" font-size="19" font-weight="700" text-anchor="end" fill="#16241C" font-family="Fraunces,serif">'+s.count+'</text>';
  });
  out += '</svg></div>';
  return out;
}

    el.innerHTML = `<input class="search" placeholder="Search customers..." value="${custSearch}" oninput="custSearch=this.value;renderContent()">
      <div class="filter-row">
        ${segs.map(s=>'<button class="filter-btn '+(custSegFilter===s?'active':'')+'" onclick="custSegFilter=\''+s+'\';renderContent()">'+s+' ('+(s==='All'?allCustomers.length:allCustomers.filter(c=>c.s===s).length)+')</button>').join('')}
      </div>
      <div class="card"><div style="font-size:13px;color:var(--muted);margin-bottom:12px">Showing ${filtered.length} customers${franchiseeView!=='All'?' \u00b7 '+franchiseeView+' only':''}</div>
      <div class="table-wrap"><table><thead><tr><th>Customer</th><th>Segment</th><th class="r">Jobs</th><th class="r">Revenue</th><th class="r">Avg</th><th class="c">Territory</th><th>First</th><th>Last</th></tr></thead>
      <tbody>${filtered.map(c=>'<tr><td style="font-weight:500">'+c.n+'</td><td>'+badge(c.s)+'</td><td class="r">'+c.j+'</td><td class="r" style="font-weight:600;color:var(--green)">'+fmt(c.r)+'</td><td class="r">'+fmt(c.a)+'</td><td class="c">'+badge(c.f)+'</td><td style="color:var(--muted);font-size:12px">'+fmtDate(c.first)+'</td><td style="color:var(--muted);font-size:12px">'+fmtDate(c.last)+'</td></tr>').join('')}</tbody></table></div></div>`;
  }

  else if (activeTab==='Recurring') {
    const recValue = recCusts.reduce((s,c)=>s+c.a,0);
    const recMike = recCusts.filter(c=>c.f==='Mike').length, recAdam = recCusts.filter(c=>c.f==='Adam').length;
    const w = recurringStats || {newInPeriod:0,cancelledInPeriod:0,netInPeriod:0,list:[],mapped:false};
    const netColor = w.netInPeriod>0?'var(--green6)':(w.netInPeriod<0?'var(--red)':'var(--muted)');
    const netSign = w.netInPeriod>0?'+':'';
    const moves = w.list.filter(x=>x._cust || x._status);
    el.innerHTML = `
      <div class="grid grid-4">
        <div class="card accent-top" style="border-top-color:var(--green4)"><div class="kpi-l">Active Recurring</div><div class="kpi-v">${recCusts.length}</div><div class="kpi-s">customers on a schedule</div></div>
        <div class="card accent-top"><div class="kpi-l">Per-visit Value</div><div class="kpi-v">${fmt(recValue)}</div><div class="kpi-s">combined, each round</div></div>
        <div class="card accent-top"><div class="kpi-l">New (tracked)</div><div class="kpi-v">${w.newInPeriod}</div><div class="kpi-s">logged by app in period</div></div>
        <div class="card accent-top" style="border-top-color:var(--red)"><div class="kpi-l">Cancelled (tracked)</div><div class="kpi-v" style="color:var(--red)">${w.cancelledInPeriod}</div><div class="kpi-s">logged by app in period</div></div>
      </div>
      <div class="grid grid-2">
        <div class="card"><div class="h">Net movement (app log)</div>
          <div class="serif" style="font-size:40px;font-weight:600;color:${netColor};line-height:1">${netSign}${w.netInPeriod}</div>
          <div style="font-size:13px;color:var(--muted);margin-top:6px">${w.newInPeriod} started \u2212 ${w.cancelledInPeriod} cancelled in the selected period</div>
          <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:24px;font-size:13px;align-items:center">
            <span>${badge('Mike')} <b>${recMike}</b> active</span><span>${badge('Adam')} <b>${recAdam}</b> active</span>
          </div>
        </div>
        <div class="card"><div class="h">Two numbers, two sources</div>
          <div class="ib ig" style="margin-top:0"><b>Active recurring (${recCusts.length})</b> comes from your full job history, every customer currently on a repeat schedule. <b>New and cancelled (tracked)</b> come from the app's live log, which only records schedules created or cancelled since tracking went live, so it starts small and builds over time. Watch net movement as that log fills: consistently positive means the round is growing.</div>
        </div>
      </div>
      <div class="card" style="margin-bottom:24px"><div style="font-size:13px;color:var(--muted);margin-bottom:12px">${recCusts.length} active recurring customers${franchiseeView!=='All'?' \u00b7 '+franchiseeView:''}, from job history</div>
        <div class="table-wrap"><table><thead><tr><th>Customer</th><th class="c">Owner</th><th>Frequency</th><th class="r">Avg/visit</th><th class="r">Jobs</th><th class="r">Lifetime</th><th>Last visit</th></tr></thead>
        <tbody>${recCusts.map(c=>'<tr><td style="font-weight:500">'+c.n+'</td><td class="c">'+badge(c.f)+'</td><td style="font-size:12px;color:var(--muted)">'+(c.freq||'\u2014')+'</td><td class="r">'+(c.a>0?fmt(c.a):'\u2014')+'</td><td class="r">'+c.j+'</td><td class="r" style="font-weight:600;color:var(--green)">'+fmt(c.r)+'</td><td style="color:var(--muted);font-size:12px">'+fmtDate(c.last)+'</td></tr>').join('')}</tbody></table></div>
      </div>
      ${moves.length ? '<div class="card"><div class="h">Recent schedule changes (app log)</div><div class="table-wrap"><table><thead><tr><th>Customer</th><th class="c">Owner</th><th>Service</th><th>Frequency</th><th class="r">Value</th><th class="c">Status</th><th>Created</th><th>Cancelled</th></tr></thead><tbody>'+moves.map(x=>'<tr><td style="font-weight:500">'+(x._cust||'\u2014')+'</td><td class="c">'+(x._franchisee?badge(x._franchisee):'\u2014')+'</td><td style="font-size:12px">'+(x._svc||'\u2014')+'</td><td style="font-size:12px;color:var(--muted)">'+(x._freq||'\u2014')+'</td><td class="r">'+(x._value>0?fmt(x._value):'\u2014')+'</td><td class="c">'+statusBadge(x._status)+'</td><td style="color:var(--muted);font-size:12px">'+fmtDate(x._created)+'</td><td style="color:var(--muted);font-size:12px">'+(x._canceled?fmtDate(x._canceled):'\u2014')+'</td></tr>').join('')+'</tbody></table></div></div>'
      : (rawRecurring.length && !w.mapped ? '<div class="ib io">The app log loaded '+rawRecurring.length+' rows but the columns didn\'t map. Columns found: <b>'+(recurringStats?recurringStats.headers.join(', '):'')+'</b></div>' : '')}
    `;
  }

  else if (activeTab==='Churned') {
    const total = churnedList.reduce((s,c)=>s+c.r,0);
    const adamCh = churnedList.filter(c=>c.f==='Adam').length, mikeCh = churnedList.filter(c=>c.f==='Mike').length;
    el.innerHTML = `<div class="card"><div class="h" style="color:var(--red)">All ${churnedList.length} churned customers</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:16px">Was recurring or 5+ jobs, no visit in 90+ days.</div>
      ${churnedList.length===0?'<div style="color:var(--muted);text-align:center;padding:40px">No churned customers in this period.</div>':
      '<div class="table-wrap"><table><thead><tr><th>Customer</th><th class="r">Jobs</th><th class="r">Lifetime</th><th class="r">Last Visit</th><th class="r">Days</th><th class="c">Territory</th><th>Services</th></tr></thead>'+
      '<tbody>'+churnedList.map(c=>'<tr><td style="font-weight:500">'+c.n+'</td><td class="r">'+c.j+'</td><td class="r" style="font-weight:600;color:var(--red)">'+fmt(c.r)+'</td><td class="r" style="color:var(--muted)">'+fmtDate(c.last)+'</td><td class="r">'+c.daysSince+'</td><td class="c">'+badge(c.f)+'</td><td style="font-size:12px;color:var(--muted)">'+c.svc+'</td></tr>').join('')+'</tbody></table></div>'+
      '<div class="ib ia"><b>Total lifetime value:</b> '+fmt(total)+'. '+adamCh+' on Adam\'s patch, '+mikeCh+' on Mike\'s. A re-engagement push targeting the top 10 could recover recurring revenue.</div>'}
    </div>`;
  }

  else if (activeTab==='Missing Prices') {
    el.innerHTML = `<div class="card"><div class="h" style="color:var(--amber)">Jobs missing a price (\u00a30)</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:16px">${missingPriceData.reduce((s,c)=>s+c.z,0)} jobs at \u00a30. Run Fix Missing Prices from the MTG app menu to auto-fix where possible.</div>
      ${missingPriceData.length===0?'<div style="color:var(--muted);text-align:center;padding:40px">No missing prices in this period.</div>':
      '<div class="table-wrap"><table><thead><tr><th>Customer</th><th class="r">£0 Jobs</th><th class="r">Avg When Priced</th><th class="r">Est. Missing</th><th>Service</th></tr></thead>'+
      '<tbody>'+missingPriceData.map(c=>{const e=c.est;return'<tr><td style="font-weight:500">'+c.n+'</td><td class="r" style="font-weight:600;color:var(--amber)">'+c.z+'</td><td class="r">'+(c.a>0?fmt(c.a):'Never priced')+'</td><td class="r" style="font-weight:600;color:'+(e>0?'var(--green6)':'#ccc')+'">'+(e>0?'~'+fmt(e):'\u2014')+'</td><td style="font-size:12px;color:var(--muted)">'+(c.svc||'\u2014')+'</td></tr>'}).join('')+'</tbody></table></div>'+
      '<div class="ib io"><b>Action:</b> update recurring booking prices in the MTG app for customers showing "Never priced". These are active regulars with no pricing set.</div>'}
    </div>`;
  }

  else if (activeTab==='Services') {
    const mx = serviceData.length ? serviceData[0].j : 1;
    el.innerHTML = `<div class="card"><div class="h">Service performance</div>
      ${serviceData.length===0?'<div style="color:var(--muted);text-align:center;padding:40px">No services in this period.</div>':
        serviceData.map(s=>'<div class="sb"><div class="sb-h"><span class="sb-n">'+s.n+'</span><span class="sb-s">'+s.j+' jobs \u2022 '+fmt(s.r)+' \u2022 avg '+fmt(s.a)+'</span></div><div class="sb-t"><div class="sb-f" style="background:'+(s.a>100?'#FF9800':s.a>50?'#4CAF50':'#81C784')+';width:'+Math.round(s.j/mx*100)+'%"></div></div></div>').join('')}
      <div class="ib ig"><b>Key insight:</b> one-off services like tidy-ups, hedge cutting and clearances are high-margin. Regular maintenance is the bread and butter by volume, but tidy-ups generate significant revenue from fewer jobs.</div>
    </div>`;
  }
}

loadData();
</script>
</body>
</html>
