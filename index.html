    const totRev = allCustomers.reduce((s,c)=>s+c.r,0) || 1;
    const recRev = recAll.reduce((s,c)=>s+c.r,0);
    const recShare = Math.round(recRev/totRev*100);
    const recLtv = recAll.length ? Math.round(recRev/recAll.length) : 0;
    const oneLtv = oneAll.length ? Math.round(oneAll.reduce((s,c)=>s+c.r,0)/oneAll.length) : 0;
    const ltvMult = oneLtv ? Math.round(recLtv/oneLtv) : 0;
    const recAvgJobs = recAll.length ? Math.round(recAll.reduce((s,c)=>s+c.j,0)/recAll.length) : 0;
    const statTile = (v,l) => '<div style="flex:1;min-width:118px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;border-left:4px solid var(--green4)"><div class="serif" style="font-size:26px;font-weight:600;color:var(--ink);line-height:1">'+v+'</div><div style="font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4">'+l+'</div></div>';
    const valueCard = recAll.length ? `<div class="card"><div class="h">Why recurring is worth most</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px">
          ${statTile(recShare+'%','of revenue comes from your regulars')}
          ${ltvMult>1?statTile(ltvMult+'\u00d7','what a one-off is worth, '+fmt(recLtv)+' vs '+fmt(oneLtv)+' on average'):''}
          ${recAvgJobs?statTile(recAvgJobs,'visits from the average regular, against one for a typical one-off'):''}
        </div>
        <ul style="margin:0;padding-left:18px;font-size:13px;color:#4a554c;line-height:1.75">
          <li>Income you can count on. The diary is booked in advance, so less time is spent chasing the next job.</li>
          <li>Steady through winter, when one-off work dries up and gets more competitive.</li>
          <li>Tighter rounds. Regulars cluster by area and day, so there is less driving and the week plans itself.</li>
          <li>Easy upsells on top of the visit: pressure washing, hedge cutting, clearances and seasonal work.</li>
          <li>Better customers. Trusted clients who pay on time and are relaxed about the odd reschedule.</li>
          <li>A stronger business. Recurring income holds up in a downturn and is worth far more if you ever sell or take on staff.</li>
        </ul>
      </div>` : '<div class="card"><div class="h">Why recurring is worth most</div><div style="color:var(--muted);font-size:13px">No recurring customers in this view yet.</div></div>';
    // Churned regulars, folded in from the old Churned tab (the other side of the recurring book).
    const chTotal = churnedList.reduce((s,c)=>s+c.r,0);
    const chMike = churnedList.filter(c=>c.f==='Mike').length, chAdam = churnedList.filter(c=>c.f==='Adam').length;
    const chWho = franchiseeView==='All' ? (chMike+' on Mike\u2019s patch, '+chAdam+' on Adam\u2019s') : ('all on '+franchiseeView+'\u2019s patch');
    const churnedSection = `<div class="card" style="margin-bottom:24px">
        <div class="h" style="color:var(--red)">Churned regulars</div>
        <div class="ib ia" style="margin-top:0;margin-bottom:18px"><b>Why churn matters:</b> losing the odd customer is normal, a bit of two steps forward and one back. People move, circumstances change and some gardens come to a natural end, so this will never be zero. What matters is the rate. A slow trickle is healthy; a sudden jump usually means something to put right, whether that is work slipping below standard, slow or unclear communication, or visits being missed or rushed. Treat a rising number as an early warning, not just a tally.</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:12px">${churnedList.length} churned${franchiseeView!=='All'?' \u00b7 '+franchiseeView:''}. Was recurring or had 5+ jobs, then no visit for 90+ days.</div>
        ${churnedList.length ? churnReasonBreakdownHTML(churnedList) : ''}
        ${churnedList.length===0?'<div style="color:var(--muted);text-align:center;padding:40px">No churned customers in this period.</div>':
          '<div class="table-wrap"><table><thead><tr>'+sortTh('Churned','n','Customer')+'<th class="c">Owner</th>'+sortTh('Churned','j','Jobs','r')+sortTh('Churned','r','Lifetime','r')+sortTh('Churned','first','First','r')+sortTh('Churned','last','Last visit','r')+sortTh('Churned','daysSince','Days since last visit','r')+'<th>Reason &amp; note</th></tr></thead>'+
          '<tbody>'+sortRows(churnedList,churnSort.k,churnSort.d).map(c=>'<tr data-cust="'+escAttr(c.n)+'"><td style="font-weight:500">'+custName(c)+'</td><td class="c">'+badge(c.f)+'</td><td class="r">'+c.j+'</td><td class="r" style="font-weight:600;color:var(--red)">'+fmt(c.r)+'</td><td class="r" style="color:var(--muted);font-size:12px">'+fmtDate(c.first)+'</td><td class="r" style="color:var(--muted);font-size:12px">'+fmtDate(c.last)+'</td><td class="r">'+c.daysSince+'</td><td><select class="disp-sel'+(c.disp?'':' unset')+'" onchange="setCustomerDisp(this.closest(\'tr\').dataset.cust, this.value)">'+dispOptions(c.disp)+'</select><input class="note-in" style="margin-top:5px" placeholder="Add a note" value="'+escAttr(c.note)+'" onchange="saveCustomerNoteText(this.closest(\'tr\').dataset.cust, this.value)"></td></tr>').join('')+'</tbody></table></div>'+
          '<div class="ib ig"><b>Total lifetime value lost:</b> '+fmt(chTotal)+'. '+chWho+'. A re-engagement push targeting the biggest names could win back recurring revenue.</div>'}
      </div>`;
    el.innerHTML = `
      <div class="grid grid-4">
        <div class="card accent-top" style="border-top-color:var(--green4)"><div class="kpi-l">Active Recurring</div><div class="kpi-v">${recCusts.length}</div><div class="kpi-s">customers on a schedule</div></div>
        <div class="card accent-top"><div class="kpi-l">Avg per Visit</div><div class="kpi-v">${fmt(recVisitAvg)}</div><div class="kpi-s">${fmt(recRound)} for one round of all</div></div>
        <div class="card accent-top"><div class="kpi-l">Avg Customer LTV</div><div class="kpi-v">${fmt(recAvgLtv)}</div><div class="kpi-s">lifetime revenue per regular</div></div>
        <div class="card accent-top"><div class="kpi-l">Regulars Gained</div><div class="kpi-v">${w.gained}</div><div class="kpi-s">first visit in period</div></div>
        <div class="card accent-top" style="border-top-color:var(--red)"><div class="kpi-l">Regulars Lost</div><div class="kpi-v" style="color:var(--red)">${w.lost}</div><div class="kpi-s">churned in period</div></div>
      </div>
      <div class="grid grid-2">
        <div class="card"><div class="h">Net movement</div>
          <div class="serif" style="font-size:40px;font-weight:600;color:${netColor};line-height:1">${netSign}${w.net}</div>
          <div style="font-size:13px;color:var(--muted);margin-top:6px">${w.gained} gained \u2212 ${w.lost} lost in the selected period</div>
          ${opSplit?`<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:24px;font-size:13px;align-items:center">${opSplit}</div>`:''}
          <div style="font-size:11px;color:var(--muted);margin-top:16px;line-height:1.55"><b>How this works:</b> a regular is anyone on a repeating schedule. Someone counts as gained when their first ever visit lands in this period, and as lost once 90 days pass with no visit. The figures look at your whole job history, so they are right back to the start.</div>
        </div>
        ${valueCard}
      </div>

      <div class="card" style="margin-bottom:24px"><div style="font-size:13px;color:var(--muted);margin-bottom:12px">${recCusts.length} active recurring customers${franchiseeView!=='All'?' \u00b7 '+franchiseeView:''}, from job history</div>
        <div class="table-wrap"><table><thead><tr>${sortTh('Recurring','n','Customer')}<th class="c">Owner</th><th>Frequency</th>${sortTh('Recurring','visit','Avg/visit','r')}${sortTh('Recurring','j','Jobs','r')}${sortTh('Recurring','r','Lifetime','r')}${sortTh('Recurring','first','First')}${sortTh('Recurring','last','Last visit')}<th>Score</th><th>Note</th></tr></thead>
        <tbody>${sortRows(recCusts,recSort.k,recSort.d).map(c=>'<tr data-cust="'+escAttr(c.n)+'"><td style="font-weight:500">'+custName(c)+'</td><td class="c">'+badge(c.f)+'</td><td style="font-size:12px;color:var(--muted)">'+(c.freq||'\u2014')+'</td><td class="r">'+(c.visit>0?fmt(c.visit):'\u2014')+'</td><td class="r">'+c.j+'</td><td class="r" style="font-weight:600;color:var(--green)">'+fmt(c.r)+'</td><td style="color:var(--muted);font-size:12px">'+fmtDate(c.first)+'</td><td style="color:var(--muted);font-size:12px">'+fmtDate(c.last)+'</td><td>'+scorePill(c)+'</td><td><input class="note-in" placeholder="Add a note" value="'+escAttr(c.note)+'" onchange="saveCustomerNoteText(this.closest(\'tr\').dataset.cust, this.value)"></td></tr>').join('')}</tbody></table></div>
      </div>
      ${churnedSection}
      ${moves.length ? '<div class="card"><div class="h">Recent schedule changes (live app log)</div><div class="table-wrap"><table><thead><tr><th>Customer</th><th class="c">Owner</th><th>Service</th><th>Frequency</th><th class="r">Value</th><th class="c">Status</th><th>Created</th><th>Cancelled</th></tr></thead><tbody>'+moves.map(x=>'<tr><td style="font-weight:500">'+(x._cust||'\u2014')+'</td><td class="c">'+(x._franchisee?badge(x._franchisee):'\u2014')+'</td><td style="font-size:12px">'+(x._svc||'\u2014')+'</td><td style="font-size:12px;color:var(--muted)">'+(x._freq||'\u2014')+'</td><td class="r">'+(x._value>0?fmt(x._value):'\u2014')+'</td><td class="c">'+statusBadge(x._status)+'</td><td style="color:var(--muted);font-size:12px">'+fmtDate(x._created)+'</td><td style="color:var(--muted);font-size:12px">'+(x._canceled?fmtDate(x._canceled):'\u2014')+'</td></tr>').join('')+'</tbody></table></div></div>' : ''}
    `;
  }

  else if (activeTab==='Scorecard') {
    el.innerHTML = renderScorecardTab();
  }

  else if (activeTab==='Missing Prices') {
    el.innerHTML = `<div class="card"><div class="h" style="color:var(--amber)">Jobs missing a price (\u00a30)</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:16px">${missingPriceData.reduce((s,c)=>s+c.z,0)} jobs at \u00a30 (free assessment visits excluded). Run Fix Missing Prices from the MTG app menu to auto-fix where possible.</div>
      ${missingPriceData.length===0?'<div style="color:var(--muted);text-align:center;padding:40px">No missing prices in this period.</div>':
      '<div class="table-wrap"><table><thead><tr>'+sortTh('Missing Prices','n','Customer')+sortTh('Missing Prices','z','\u00a30 Jobs','r')+sortTh('Missing Prices','a','Avg When Priced','r')+sortTh('Missing Prices','est','Est. Missing','r')+'<th>Service</th></tr></thead>'+
      '<tbody>'+sortRows(missingPriceData,missSort.k,missSort.d).map(c=>{const e=c.est;return'<tr><td style="font-weight:500">'+c.n+'</td><td class="r" style="font-weight:600;color:var(--amber)">'+c.z+'</td><td class="r">'+(c.a>0?fmt(c.a):'Never priced')+'</td><td class="r" style="font-weight:600;color:'+(e>0?'var(--green6)':'#ccc')+'">'+(e>0?'~'+fmt(e):'\u2014')+'</td><td style="font-size:12px;color:var(--muted)">'+(c.svc||'\u2014')+'</td></tr>'}).join('')+'</tbody></table></div>'+
      '<div class="ib io"><b>Action:</b> update recurring booking prices in the MTG app for customers showing "Never priced". These are active regulars with no pricing set.</div>'}
    </div>`;
  }
}

function showLogin(msg) {
  const ov = document.getElementById('loginOverlay');
  if (ov) ov.style.display = 'flex';
  const er = document.getElementById('loginErr'); if (er) er.textContent = msg || '';
  const lb = document.getElementById('logoutBtn'); if (lb) lb.style.display = 'none';
  const wi = document.getElementById('whoami'); if (wi) wi.textContent = '';
  const lp = document.getElementById('loginPass'); if (lp) lp.value = '';
  const lu = document.getElementById('loginUser'); if (lu) lu.focus();
}
function hideLogin() { const ov = document.getElementById('loginOverlay'); if (ov) ov.style.display = 'none'; }

function doLogin() {
  const u = (document.getElementById('loginUser').value || '').trim();
  const p = document.getElementById('loginPass').value || '';
  const remember = document.getElementById('loginRemember').checked;
  const er = document.getElementById('loginErr');
  if (!u || !p) { er.textContent = 'Enter your username and password.'; return; }
  er.textContent = 'Checking...';
  const cb = 'mtg_login_' + Date.now();
  const s = document.createElement('script');
  let done = false;
  const cleanup = () => { try { delete window[cb]; } catch(_) { window[cb] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); };
  window[cb] = function(d) {
    done = true; cleanup();
    if (d && d.ok) {
      auth = { user: u.toLowerCase(), pass: p, role: d.role || 'All', name: d.name || u };
      try {
        (remember ? localStorage : sessionStorage).setItem('mtg_auth', JSON.stringify(auth));
        (remember ? sessionStorage : localStorage).removeItem('mtg_auth');
      } catch(_) {}
      er.textContent = '';
      hideLogin();
      applyRole();
      loadData();
    } else {
      er.textContent = (d && d.error) ? d.error : 'Could not log in.';
    }
  };
  s.onerror = function() { if (!done) { cleanup(); er.textContent = 'Could not reach the app. Try again.'; } };
  setTimeout(() => { if (!done) { cleanup(); er.textContent = 'No response from the app. Try again.'; } }, 20000);
  s.src = API_URL + (API_URL.indexOf('?') === -1 ? '?' : '&') + 'action=login&user=' + encodeURIComponent(u) + '&pass=' + encodeURIComponent(p) + '&callback=' + cb;
  document.head.appendChild(s);
}

function doLogout() {
  auth = null;
  try { localStorage.removeItem('mtg_auth'); sessionStorage.removeItem('mtg_auth'); } catch(_) {}
  showLogin('');
}

function applyRole() {
  const lb = document.getElementById('logoutBtn'); if (lb) lb.style.display = auth ? 'inline-block' : 'none';
  const wi = document.getElementById('whoami');
  if (wi) wi.textContent = auth ? (auth.name + (auth.role !== 'All' ? ' \u00b7 ' + auth.role + ' only' : '')) : '';
  const vs = document.getElementById('viewSelect');
  if (auth && auth.role !== 'All') {
    franchiseeView = auth.role;
    if (vs) vs.style.display = 'none';
    callsWho = auth.name;
  } else {
    if (vs) vs.style.display = '';
    if (auth) {
      callsWho = auth.name;
      // Default the opening view to the logged-in operator; the All toggle stays available.
      const op = { mike: 'Mike', adam: 'Adam' }[(auth.name || '').toLowerCase()];
      if (op) franchiseeView = op;
    }
  }
}

(function initAuth() {
  const lb = document.getElementById('loginBtn');
  if (lb) lb.addEventListener('click', doLogin);
  const lp = document.getElementById('loginPass');
  if (lp) lp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  const lu = document.getElementById('loginUser');
  if (lu) lu.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginPass').focus(); });
  let saved = null;
  try { saved = localStorage.getItem('mtg_auth') || sessionStorage.getItem('mtg_auth'); } catch(_) {}
  if (saved) { try { auth = JSON.parse(saved); } catch(_) { auth = null; } }
  if (auth && auth.user && auth.pass) { hideLogin(); applyRole(); loadData(); }
  else { showLogin(''); }
})();
</script>
</body>
</html>
